<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>MISTRESS COMMAND | Bed Protocol</title>
  <style>
    :root {
      --red: #ef4444;
      --red-glow: rgba(239, 68, 68, 0.4);
      --dark: #090d16;
      --panel: #111827;
      --panel-border: #1f2937;
      --accent: #38bdf8;
      --success: #22c55e;
      --warning: #f59e0b;
      --text: #f3f4f6;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, monospace; }

    body {
      background-color: var(--dark);
      color: var(--text);
      height: 100dvh;
      display: flex;
      overflow: hidden;
    }

    /* Sidebar Hardware Dashboard */
    #dashboard {
      width: 280px;
      background: var(--panel);
      border-right: 1px solid var(--panel-border);
      padding: 20px 16px;
      display: flex;
      flex-direction: column;
      gap: 14px;
      overflow-y: auto;
    }

    .dash-header {
      color: var(--red);
      font-size: 13px;
      font-weight: 700;
      letter-spacing: 1.5px;
      text-transform: uppercase;
      text-align: center;
      padding-bottom: 8px;
      border-bottom: 1px solid var(--panel-border);
    }

    .status-light {
      padding: 12px;
      background: #182234;
      border: 1px solid #2d3748;
      border-radius: 8px;
      font-size: 11px;
      text-transform: uppercase;
      letter-spacing: 1px;
      font-weight: 700;
      text-align: center;
      transition: all 0.3s ease;
      color: #94a3b8;
    }

    .status-light.active {
      border-color: var(--red);
      color: #fee2e2;
      background: #3b0712;
      box-shadow: 0 0 15px var(--red-glow);
    }

    .status-light.cooldown {
      border-color: var(--warning);
      color: #fef3c7;
      background: #451a03;
    }

    .pulse { animation: slap-pulse 0.6s infinite alternate; }
    @keyframes slap-pulse {
      0% { background: #3b0712; transform: scale(1); }
      100% { background: #5c0818; transform: scale(1.02); box-shadow: 0 0 20px var(--red); }
    }

    /* Main Console Area */
    #main-console {
      flex: 1;
      display: flex;
      flex-direction: column;
      position: relative;
    }

    .header {
      width: 100%;
      padding: 14px 20px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-bottom: 1px solid var(--panel-border);
      background: rgba(17, 24, 39, 0.7);
    }

    .settings-btn {
      background: none;
      border: none;
      color: #94a3b8;
      font-size: 22px;
      cursor: pointer;
    }

    /* Call Status & Avatar Card */
    .call-card {
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 10px 0;
      text-align: center;
    }

    .avatar-wrapper {
      position: relative;
      width: 68px;
      height: 68px;
      border-radius: 50%;
      background: linear-gradient(135deg, #f97316, #ec4899);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 26px;
      box-shadow: 0 4px 15px rgba(0,0,0,0.5);
      margin-bottom: 6px;
    }

    .pulse-ring {
      position: absolute;
      width: 100%;
      height: 100%;
      border-radius: 50%;
      border: 2px solid var(--accent);
      opacity: 0;
      pointer-events: none;
    }

    .talking .pulse-ring { animation: ring-pulse 1.4s infinite ease-out; }
    .listening .pulse-ring { border-color: var(--success); animation: ring-pulse 1.8s infinite ease-out; }

    @keyframes ring-pulse {
      0% { transform: scale(1); opacity: 0.9; }
      100% { transform: scale(1.6); opacity: 0; }
    }

    .caller-name { font-size: 18px; font-weight: 700; }
    .call-status { font-size: 12px; color: #94a3b8; margin-top: 2px; }

    /* Chat Log */
    .chat-container {
      flex: 1;
      padding: 16px 20px;
      overflow-y: auto;
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .bubble {
      max-width: 80%;
      padding: 10px 14px;
      border-radius: 10px;
      font-size: 14px;
      line-height: 1.5;
      word-wrap: break-word;
    }

    .bubble.katee {
      align-self: flex-start;
      background: #1f2937;
      color: #f3f4f6;
      border-left: 3px solid var(--red);
    }

    .bubble.user {
      align-self: flex-end;
      background: #2563eb;
      color: white;
    }

    .bubble.interim { opacity: 0.7; border: 1px dashed #60a5fa; }
    .bubble.system {
      align-self: center;
      background: rgba(239, 68, 68, 0.2);
      border: 1px solid var(--red);
      color: #fca5a5;
      font-size: 11px;
      text-align: center;
    }

    /* Action Bar */
    .action-bar {
      background: #111827;
      border-top: 1px solid var(--panel-border);
      padding: 12px 20px;
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .voice-controls {
      display: flex;
      justify-content: center;
      gap: 16px;
      align-items: center;
    }

    .btn-circle {
      width: 52px;
      height: 52px;
      border-radius: 50%;
      border: none;
      color: white;
      font-size: 20px;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: transform 0.15s ease;
      box-shadow: 0 4px 15px rgba(0,0,0,0.4);
    }

    .btn-circle:active { transform: scale(0.92); }
    .btn-call { background-color: var(--success); }
    .btn-pause { background-color: var(--warning); }
    .btn-end { background-color: var(--danger); }

    .input-row { display: flex; gap: 8px; }
    .text-input {
      flex: 1;
      background: #090d16;
      border: 1px solid #374151;
      border-radius: 8px;
      padding: 10px 14px;
      color: white;
      font-size: 14px;
      outline: none;
    }
    .btn-send {
      background: var(--red);
      color: black;
      font-weight: 700;
      border: none;
      padding: 0 20px;
      border-radius: 8px;
      cursor: pointer;
    }

    /* Settings Modal */
    .modal {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,0.85);
      padding: 20px;
      align-items: center;
      justify-content: center;
      z-index: 100;
    }

    .modal.open { display: flex; }
    .modal-content {
      background: #111827;
      border: 1px solid #374151;
      border-radius: 14px;
      padding: 20px;
      width: 100%;
      max-width: 500px;
      max-height: 88vh;
      overflow-y: auto;
    }
    .modal-content h3 { margin-bottom: 12px; color: var(--red); }
    .input-group { margin-bottom: 14px; }
    .input-group label { display: block; font-size: 12px; color: #94a3b8; margin-bottom: 5px; }
    .input-group input, .input-group textarea, .input-group select {
      width: 100%;
      padding: 9px;
      border-radius: 8px;
      border: 1px solid #374151;
      background: #090d16;
      color: white;
      font-size: 13px;
    }
    .modal-actions { display: flex; justify-content: space-between; align-items: center; margin-top: 16px; }
    .btn-secondary { background: #374151; border: none; color: white; padding: 8px 14px; border-radius: 6px; cursor: pointer; font-size: 12px; }

    @media (max-width: 768px) {
      body { flex-direction: column; }
      #dashboard { width: 100%; height: auto; padding: 10px 16px; flex-direction: row; flex-wrap: wrap; gap: 8px; }
      .dash-header { width: 100%; border-bottom: none; padding-bottom: 2px; }
      .status-light { flex: 1 1 calc(50% - 8px); padding: 8px; font-size: 10px; }
    }
  </style>
</head>

      kokoroVoice: localStorage.getItem('katee_kokoro_voice') || 'af_bella',
      releaseWebhook: (localStorage.getItem('katee_release_webhook') || 'https://sequematic.com/trigger-custom-webhook/F79270CD27/133520').trim(),
      slapOnWebhook: (localStorage.getItem('katee_slap_on_webhook') || 'https://sequematic.com/trigger-custom-webhook/F79270CD27/106684').trim(),
      slapOffWebhook: (localStorage.getItem('katee_slap_off_webhook') || 'https://sequematic.com/trigger-custom-webhook/F79270CD27/106695').trim(),
      vibeOnWebhook: (localStorage.getItem('katee_vibe_on_webhook') || 'https://sequematic.com/trigger-custom-webhook/F79270CD27/133522').trim(),
      vibeOffWebhook: (localStorage.getItem('katee_vibe_off_webhook') || 'https://sequematic.com/trigger-custom-webhook/F79270CD27/133525').trim(),
      prompt: localStorage.getItem('katee_prompt') || DEFAULT_PROMPT
    };

    let isCalling = false;
    let isPaused = false;
    let isProcessing = false;
    let recognition = null;
    let silenceTimer = null;
    let synth = window.speechSynthesis;
    let currentAudioElement = null;

    let vibeAutoOffTimer = null;
    let vibeCooldownUntil = 0;

      document.getElementById('memoryNotesInput').value = kateeMemory.sessionNotes || "";
      document.getElementById('memoryStatsDisplay').innerText = `Sessions: ${kateeMemory.totalSessions} | Slaps: ${kateeMemory.totalSlaps || 0} | Vibes: ${kateeMemory.totalVibes || 0}`;

      if (lower.includes("good girl") || lower.includes("no way") || lower.includes("refuse") || lower.includes("bitch")) kateeTemper = Math.min(100, kateeTemper + 35);
      else if (lower.includes("mistress") || lower.includes("sorry") || lower.includes("yes")) kateeTemper = Math.max(0, kateeTemper - 25);
      
      const badge = document.getElementById('moodBadge');
      if (kateeTemper <= 35) { badge.innerText = `Mood: Seductive (${kateeTemper}%)`; badge.style.color = "#4ade80"; badge.style.background = "rgba(34, 197, 94, 0.2)"; }

      return `\n\n[TEMPER: ${kateeTemper}/100] State: ${kateeTemper > 65 ? 'FURIOUS' : (kateeTemper > 35 ? 'Irritated' : 'Seductive')}`;
    }

    apiOrUrlInput.value = config.apiOrUrl;
    kokoroUrlInput.value = config.kokoroUrl;
    kokoroVoiceSelect.value = config.kokoroVoice;
    releaseWebhookInput.value = config.releaseWebhook;
    slapOnWebhookInput.value = config.slapOnWebhook;
    slapOffWebhookInput.value = config.slapOffWebhook;
    vibeOnWebhookInput.value = config.vibeOnWebhook;
    vibeOffWebhookInput.value = config.vibeOffWebhook;
    systemPromptInput.value = config.prompt;
    updateMemoryUI();

    resetPromptBtn.onclick = () => { systemPromptInput.value = DEFAULT_PROMPT; };
    openSettings.onclick = () => { settingsModal.classList.add('open'); };
    clearMemoryBtn.onclick = () => { if(confirm("Wipe memory?")) { kateeMemory = {totalSessions:0, totalSlaps:0, totalVibes:0, sessionNotes:""}; saveKateeMemory(); }};

    saveSettingsBtn.onclick = () => {
      config.apiOrUrl = apiOrUrlInput.value.trim();
      config.kokoroUrl = kokoroUrlInput.value.trim();
      config.kokoroVoice = kokoroVoiceSelect.value;
      config.releaseWebhook = releaseWebhookInput.value.trim();
      config.slapOnWebhook = slapOnWebhookInput.value.trim();
      config.slapOffWebhook = slapOffWebhookInput.value.trim();
      config.vibeOnWebhook = vibeOnWebhookInput.value.trim();
      config.vibeOffWebhook = vibeOffWebhookInput.value.trim();
      config.prompt = systemPromptInput.value.trim();

      localStorage.setItem('katee_api_url', config.apiOrUrl);
      localStorage.setItem('katee_kokoro_url', config.kokoroUrl);
      localStorage.setItem('katee_kokoro_voice', config.kokoroVoice);
      localStorage.setItem('katee_release_webhook', config.releaseWebhook);
      localStorage.setItem('katee_slap_on_webhook', config.slapOnWebhook);
      localStorage.setItem('katee_slap_off_webhook', config.slapOffWebhook);
      localStorage.setItem('katee_vibe_on_webhook', config.vibeOnWebhook);
      localStorage.setItem('katee_vibe_off_webhook', config.vibeOffWebhook);
      localStorage.setItem('katee_prompt', config.prompt);

      kateeMemory.sessionNotes = document.getElementById('memoryNotesInput').value;
      saveKateeMemory();

        const img = new Image(); img.src = url + (url.includes('?') ? '&' : '?') + 't=' + Date.now();
      } catch (err) {}
    }

    function updateLight(id, label, active, pulse = false, cooldown = false) {
      const el = document.getElementById(id);
      if (!el) return;
      el.innerText = label;
      active ? el.classList.add('active') : el.classList.remove('active');
      pulse ? el.classList.add('pulse') : el.classList.remove('pulse');
      cooldown ? el.classList.add('cooldown') : el.classList.remove('cooldown');
    }

      if (now < vibeCooldownUntil) {

        return;

      if (/\[SLAP_OFF\]/i.test(raw)) {
        sendWebhook(config.slapOffWebhook);
        updateLight("light-slap", "Ball-Slapper: IDLE", false, false);
      }

      // Vibrator (Burst Mode 3-6s with 9s Cooldown)
      if (/\[VIBE_ON\]/i.test(raw)) {
        triggerVibratorBurst();
      }
      if (/\[VIBE_OFF\]/i.test(raw)) {
        if (vibeAutoOffTimer) clearTimeout(vibeAutoOffTimer);
        sendWebhook(config.vibeOffWebhook);
        updateLight("light-vibe", "Vibrator: OFF", false, false, false);
      }
    }

    // --- ENGINE ---
    async function executeTurn(userText) {
      callCard.className = "call-card";
      callStatus.innerText = "Katie is thinking...";
      chatHistory.push({ role: "user", content: userText });
      if (chatHistory.length > 6) chatHistory = chatHistory.slice(-6);

      try {
        const mood = updateKatieMood(userText);
        const res = await fetch(config.apiOrUrl + "/v1/chat/completions", {
          method: "POST",
          headers: { "Content-Type": "application/json", "ngrok-skip-browser-warning": "true" },
          body: JSON.stringify({
            messages: [{ role: "system", content: config.prompt + mood }, ...chatHistory],
            max_tokens: 120, temperature: 0.7, stop: ["User:", "\nUser:"]
          })
        });
        const data = await res.json();
        const raw = data.choices[0].message.content.trim();
        
        parseHardwareActions(raw);

        let cleanText = raw.replace(/\[.*?\]/g, '').replace(/<think>[\s\S]*?<\/think>/gi, '').replace(/\*[^*]*\*/g, '').trim();
        const sentences = cleanText.match(/[^.!?]+[.!?]+/g);
        if (sentences && sentences.length > 2) cleanText = sentences.slice(0, 2).join(' ');

        chatHistory.push({ role: "assistant", content: cleanText });
        appendMessage('katee', cleanText);
        playVoice(cleanText);

      } catch (err) {
        appendMessage('system', "Connection Error: Check LM Studio & Cloudflare tunnel.");
        resumeListeningWithDelay(2500);
      }
    }

    async function playVoice(text) {
      callCard.className = "call-card talking";
      callStatus.innerText = "Katie is speaking...";
      if (config.kokoroUrl) {
        try {
          const res = await fetch(config.kokoroUrl + "/v1/audio/speech", {
            method: "POST",
            headers: { "Content-Type": "application/json", "ngrok-skip-browser-warning": "true" },
            body: JSON.stringify({ input: text, voice: config.kokoroVoice, response_format: "mp3" })
          });
          const blob = await res.blob();
          document.getElementById('audioPlayback').src = URL.createObjectURL(blob);
          document.getElementById('audioPlayback').onended = () => resumeListeningWithDelay(600);
          return;
        } catch (e) {}
      }
      const u = new SpeechSynthesisUtterance(text);
      u.onend = () => resumeListeningWithDelay(600);
      synth.speak(u);
    }

    // --- INPUT HANDLING ---
    function sendTextMessage() { const t = userTextInput.value.trim(); if(t && !isProcessing) { userTextInput.value=""; appendMessage('user', t); executeTurn(t); }}
    
    callBtn.onclick = () => {
      isCalling = true; isPaused = false; chatLog.innerHTML = '';
      callBtn.style.display="none"; pauseBtn.style.display="flex"; hangupBtn.style.display="flex";
      callCard.className="call-card listening"; callStatus.innerText="Listening...";
      startSpeechTurn();
    };

    pauseBtn.onclick = () => {
      if (!isCalling) return;
      isPaused = !isPaused;
      if (isPaused) {
        if (recognition) try { recognition.abort(); } catch (e) {}
        clearTimeout(silenceTimer);
        callCard.className = "call-card"; callStatus.innerText = "⏸️ Call Paused";
        pauseBtn.innerText = "▶️"; pauseBtn.style.backgroundColor = "var(--success)";
      } else {
        pauseBtn.innerText = "⏸️"; pauseBtn.style.backgroundColor = "var(--warning)";
        callStatus.innerText = "Listening..."; callCard.className = "call-card listening";
        startSpeechTurn();
      }
    };

    hangupBtn.onclick = () => {
      isCalling = false; callCard.className="call-card"; callStatus.innerText="Ended";
      callBtn.style.display="flex"; pauseBtn.style.display="none"; hangupBtn.style.display="none";
      if(recognition) recognition.abort();
      
      kateeMemory.totalSessions++;
      kateeMemory.sessionNotes = `Session ${kateeMemory.totalSessions}: ${kateeTemper > 60 ? 'Ended while furious.' : 'Ended normally.'}`;
      saveKateeMemory();
    };

    function startSpeechTurn() {
      const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
      if (!SR || !isCalling || isPaused) return;
      recognition = new SR();
      recognition.continuous = false; recognition.interimResults = true;
      recognition.lang = 'en-US';
      recognition.onresult = (e) => {
        const t = e.results[0][0].transcript;
        appendMessage('user', t, true);
        if (t.toUpperCase().includes("RED")) {
          sendWebhook(config.releaseWebhook);
          sendWebhook(config.slapOffWebhook);
          sendWebhook(config.vibeOffWebhook);
          updateLight("light-restraints", "Restraints: RELEASED", false);
          updateLight("light-slap", "Ball-Slapper: IDLE", false, false);
          updateLight("light-vibe", "Vibrator: OFF", false, false, false);
        }
        if (e.results[0].isFinal) {
          clearTimeout(silenceTimer);
          silenceTimer = setTimeout(() => {
            appendMessage('user', t, false); executeTurn(t);
          }, 1000);
        }
      };
      recognition.onend = () => { if(isCalling && !isPaused) recognition.start(); };
      recognition.start();
    }

    function resumeListeningWithDelay(ms) { 
      callCard.className="call-card"; 
      setTimeout(() => { if(isCalling && !isPaused) startSpeechTurn(); }, ms); 
    }

    function appendMessage(sender, text, interim=false) {
      if(!text) return;
      if(interim) {
        if(!currentInterimBubble) { currentInterimBubble = document.createElement('div'); currentInterimBubble.className='bubble user interim'; chatLog.appendChild(currentInterimBubble); }
        currentInterimBubble.textContent = text;
      } else {
        if(currentInterimBubble) { currentInterimBubble.remove(); currentInterimBubble=null; }
        const b = document.createElement('div'); b.className=`bubble ${sender}`; b.textContent=text; chatLog.appendChild(b);
      }
      chatLog.scrollTop = chatLog.scrollHeight;
    }
  </script>
</body>
