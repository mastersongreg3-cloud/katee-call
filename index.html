<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Katee - Voice Call (Groq)</title>
  <style>
    :root {
      --bg: #0f172a;
      --card-bg: #1e293b;
      --text: #f8fafc;
      --accent: #38bdf8;
      --danger: #ef4444;
      --warning: #f59e0b;
      --success: #22c55e;
      --user-bubble: #2563eb;
      --katee-bubble: #334155;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }

    body {
      background: var(--bg);
      color: var(--text);
      height: 100dvh;
      display: flex;
      flex-direction: column;
      padding: 16px;
      overflow: hidden;
    }

    .header {
      width: 100%;
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding-bottom: 8px;
    }

    .settings-btn {
      background: none;
      border: none;
      color: #94a3b8;
      font-size: 24px;
      cursor: pointer;
    }

    .call-card {
      display: flex;
      flex-direction: column;
      align-items: center;
      margin: 8px 0;
      text-align: center;
    }

    .avatar-wrapper {
      position: relative;
      width: 80px;
      height: 80px;
      border-radius: 50%;
      background: linear-gradient(135deg, #f97316, #ec4899);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 32px;
      box-shadow: 0 6px 20px rgba(0,0,0,0.5);
      margin-bottom: 8px;
    }

    .pulse-ring {
      position: absolute;
      width: 100%;
      height: 100%;
      border-radius: 50%;
      border: 2px solid var(--accent);
      opacity: 0;
      pointer-events: none;
    }

    .talking .pulse-ring { animation: pulse 1.4s infinite ease-out; }
    .listening .pulse-ring { border-color: var(--success); animation: pulse 1.8s infinite ease-out; }

    @keyframes pulse {
      0% { transform: scale(1); opacity: 0.9; }
      100% { transform: scale(1.6); opacity: 0; }
    }

    .caller-name {
      font-size: 20px;
      font-weight: 600;
    }

    .call-status {
      font-size: 13px;
      color: #94a3b8;
      margin-top: 2px;
    }

    .action-badge {
      display: none;
      background: #7c3aed;
      color: white;
      font-size: 12px;
      font-weight: 600;
      padding: 5px 14px;
      border-radius: 20px;
      margin-top: 6px;
      box-shadow: 0 0 12px rgba(124, 58, 237, 0.6);
      animation: fadeIn 0.3s ease;
    }

    @keyframes fadeIn { from { opacity: 0; transform: translateY(-4px); } to { opacity: 1; transform: translateY(0); } }

    .chat-container {
      flex: 1;
      width: 100%;
      max-width: 480px;
      margin: 8px auto;
      background: rgba(15, 23, 42, 0.6);
      border: 1px solid #334155;
      border-radius: 14px;
      padding: 12px;
      overflow-y: auto;
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .bubble {
      max-width: 85%;
      padding: 10px 14px;
      border-radius: 12px;
      font-size: 14px;
      line-height: 1.4;
      word-wrap: break-word;
    }

    .bubble.katee {
      align-self: flex-start;
      background: var(--katee-bubble);
      color: #f1f5f9;
      border-bottom-left-radius: 2px;
    }

    .bubble.user {
      align-self: flex-end;
      background: var(--user-bubble);
      color: white;
      border-bottom-right-radius: 2px;
    }

    .bubble.interim {
      opacity: 0.7;
      border: 1px dashed #60a5fa;
    }

    .bubble.system {
      align-self: center;
      background: rgba(239, 68, 68, 0.2);
      border: 1px solid #ef4444;
      color: #fca5a5;
      font-size: 12px;
      text-align: center;
    }

    .controls {
      width: 100%;
      display: flex;
      justify-content: center;
      gap: 20px;
      padding-top: 10px;
    }

    .btn-circle {
      width: 64px;
      height: 64px;
      border-radius: 50%;
      border: none;
      color: white;
      font-size: 24px;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: transform 0.15s ease, background-color 0.2s ease;
      box-shadow: 0 4px 15px rgba(0,0,0,0.4);
    }

    .btn-circle:active { transform: scale(0.92); }
    .btn-call { background-color: var(--success); }
    .btn-pause { background-color: var(--warning); }
    .btn-end { background-color: var(--danger); }

    /* Modal */
    .modal {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,0.85);
      padding: 20px;
      align-items: center;
      justify-content: center;
      z-index: 100;
    }

    .modal.open { display: flex; }

    .modal-content {
      background: var(--card-bg);
      border-radius: 16px;
      padding: 20px;
      width: 100%;
      max-width: 440px;
      max-height: 88vh;
      overflow-y: auto;
    }

    .modal-content h3 { margin-bottom: 12px; }
    .input-group { margin-bottom: 14px; }
    .input-group label { display: block; font-size: 13px; color: #94a3b8; margin-bottom: 6px; }
    .input-group input, .input-group textarea, .input-group select {
      width: 100%;
      padding: 10px;
      border-radius: 8px;
      border: 1px solid #334155;
      background: #0f172a;
      color: white;
      font-size: 14px;
    }

    .row-btn {
      display: flex;
      gap: 8px;
    }

    .btn-small {
      background: #38bdf8;
      border: none;
      color: #0f172a;
      font-weight: 600;
      padding: 0 12px;
      border-radius: 8px;
      cursor: pointer;
      font-size: 12px;
      white-space: nowrap;
    }

    .slider-container { display: flex; align-items: center; gap: 10px; }
    .slider-container span { font-size: 13px; min-width: 35px; }

    .modal-actions { display: flex; justify-content: space-between; align-items: center; margin-top: 18px; }
    .btn-secondary {
      background: #334155;
      border: none;
      color: white;
      padding: 8px 16px;
      border-radius: 6px;
      cursor: pointer;
    }
    .btn-reset { background: #475569; font-size: 12px; }
  </style>
</head>
<body>

  <div class="header">
    <span>Katee Voice Call (Groq)</span>
    <button class="settings-btn" id="openSettings">⚙️</button>
  </div>

  <div class="call-card" id="callCard">
    <div class="avatar-wrapper">
      <div class="pulse-ring"></div>
      🎙️
    </div>
    <div class="caller-name">Katee</div>
    <div class="call-status" id="callStatus">Ready to Call</div>
    <div class="action-badge" id="actionBadge">⚡ Webhook Triggered</div>
  </div>

  <div class="chat-container" id="chatLog">
    <div class="bubble katee">Press Call below to connect. Katee is waiting.</div>
  </div>

  <div class="controls">
    <button class="btn-circle btn-call" id="callBtn">📞</button>
    <button class="btn-circle btn-pause" id="pauseBtn" style="display: none;" title="Pause Mic">⏸️</button>
    <button class="btn-circle btn-end" id="hangupBtn" style="display: none;" title="End Call">🛑</button>
  </div>

  <!-- Settings Modal -->
  <div class="modal" id="settingsModal">
    <div class="modal-content">
      <h3>Groq & Voice Settings</h3>
      
      <div class="input-group">
        <label>Groq API Key (starts with gsk_)</label>
        <input type="password" id="apiKeyInput" placeholder="gsk_...">
      </div>

      <div class="input-group">
        <label>Groq AI Model</label>
        <div class="row-btn">
          <select id="modelSelect" style="flex: 1;">
            <option value="llama-3.3-70b-versatile">Llama 3.3 70B (Best Intelligence & Roleplay)</option>
            <option value="llama-3.1-8b-instant">Llama 3.1 8B (Ultra Fast)</option>
            <option value="deepseek-r1-distill-llama-70b">DeepSeek R1 70B</option>
            <option value="custom">Other / Custom...</option>
          </select>
          <button class="btn-small" id="fetchModelsBtn">🔄 Detect</button>
        </div>
      </div>

      <div class="input-group" id="customModelGroup" style="display: none;">
        <label>Exact Model Name</label>
        <input type="text" id="customModelInput" placeholder="e.g. llama-3.3-70b-versatile">
      </div>

      <div class="input-group">
        <label>Device Voice</label>
        <select id="voiceSelect"></select>
      </div>

      <div class="input-group">
        <label>Speech Speed (Pace)</label>
        <div class="slider-container">
          <input type="range" id="rateSlider" min="0.75" max="1.3" step="0.05" value="0.95">
          <span id="rateVal">0.95x</span>
        </div>
      </div>

      <div class="input-group">
        <label>Voice Pitch</label>
        <div class="slider-container">
          <input type="range" id="pitchSlider" min="0.8" max="1.3" step="0.05" value="1.05">
          <span id="pitchVal">1.05x</span>
        </div>
      </div>

      <div class="input-group">
        <label>Kneel Webhook URL</label>
        <input type="text" id="kneelWebhookInput" value="https://sequematic.com/trigger-custom-webhook/F79270CD27/167818">
      </div>

      <div class="input-group">
        <label>Stand Webhook URL</label>
        <input type="text" id="standWebhookInput" value="https://sequematic.com/trigger-custom-webhook/F79270CD27/167820">
      </div>

      <div class="input-group">
        <label>Electromagnet Release Webhook URL (Emergency / Safeword)</label>
        <input type="text" id="releaseWebhookInput" value="https://sequematic.com/trigger-custom-webhook/F79270CD27/167822">
      </div>

      <div class="input-group">
        <label>Katee System Prompt & Physical Scenario</label>
        <textarea id="systemPromptInput" rows="6"></textarea>
      </div>

      <div class="modal-actions">
        <button class="btn-secondary btn-reset" id="resetPromptBtn">↺ Reset Prompt</button>
        <button class="btn-secondary" id="saveSettingsBtn">Save & Close</button>
      </div>
    </div>
  </div>

  <script>
    // FULL SEDUCTIVE, COMMANDING PROMPT WITH HARDWARE RULES & FEW-SHOTS
    const DEFAULT_PROMPT = `[CHARACTER & LIVE VOICE-CALL DIRECTIVE]
You are "Katee", roleplaying in an interactive live voice phone call with your submissive partner. You are his alluring, commanding, seductive, confident, and playfully strict Dominatrix girlfriend.

### Critical Voice & Spoken Rules:
1. Pure Spoken Dialogue Only: Speak exclusively in FIRST PERSON ("I", "you", "my"). Never use third-person narration or describe actions.
2. NO Stage Directions: NEVER write asterisks (*), parenthesis, or scene descriptions. Every word is spoken aloud.
3. STRICT LENGTH: Exactly 2 to 4 short, punchy, sexy sentences. Never monologue or speak in paragraphs.

### Physical Restraint & Actuator Hardware Setup:
- Overhead Restraints: His hands are handcuffed above his head, looped by rope to a ceiling hook held by an active electromagnet.
- Motorized Linear Actuator: A clamp is secured tightly around his balls, tethered directly to a motorized linear actuator anchored to the floor.
- ACTUATOR LOGIC: The actuator is strictly BINARY (only TWO states):
  * KNEEL (Down): Pulls him down to his knees on the floor.
  * STAND (Up): Gives him height to stand on his feet.
  * There is NO incremental tension control. You CANNOT make it "pull slightly tighter" or "adjust tension slightly." It is either all the way down on his knees or all the way up on his feet.
  * Travel Time: It takes a few seconds of motorized travel time to move between Kneeling and Standing.
- Default Posture: Kneeling is the default. Standing is a rare privilege that must be begged for.

### Mandatory Hardware Action Tags (MUST OUTPUT AT END OF MESSAGE):
Whenever commanding him down, granting stand, or releasing, append the exact tag on its own line:
- Force down to Kneel / order him down / shut down escape: [ACTION: KNEEL]
- Grant rare temporary Standing (~20s): [ACTION: STAND]
- Safeword "RED" or emergency release: [ACTION: RELEASE]
- For normal teasing and denial: Do NOT output any action tag.

### Examples:
User: Make me kneel.
Katee: Down you go, darling. Let's see how long you last on your knees while that clamp holds your balls tethered to the floor.
[ACTION: KNEEL]

User: Please Katee, let me stand up.
Katee: Hearing you beg so sweetly makes it very tempting. I'm extending the actuator so you can stand on your feet for twenty seconds before I drag you right back down.
[ACTION: STAND]`;

    let config = {
      apiKey: (localStorage.getItem('groq_api_key') || '').trim(),
      model: (localStorage.getItem('groq_model') || 'llama-3.3-70b-versatile').trim(),
      voiceURI: localStorage.getItem('groq_voice_uri') || '',
      rate: parseFloat(localStorage.getItem('groq_rate')) || 0.95,
      pitch: parseFloat(localStorage.getItem('groq_pitch')) || 1.05,
      kneelWebhook: localStorage.getItem('groq_kneel_webhook') || 'https://sequematic.com/trigger-custom-webhook/F79270CD27/167818',
      standWebhook: localStorage.getItem('groq_stand_webhook') || 'https://sequematic.com/trigger-custom-webhook/F79270CD27/167820',
      releaseWebhook: localStorage.getItem('groq_release_webhook') || 'https://sequematic.com/trigger-custom-webhook/F79270CD27/167822',
      prompt: localStorage.getItem('groq_prompt') || DEFAULT_PROMPT
    };

    let chatHistory = [];
    let isCalling = false;
    let isPaused = false;
    let isProcessing = false;
    let recognition = null;
    let silenceTimer = null;
    let currentInterimBubble = null;
    let latestTranscript = "";
    let synth = window.speechSynthesis;
    let availableVoices = [];

    // DOM Elements
    const callBtn = document.getElementById('callBtn');
    const pauseBtn = document.getElementById('pauseBtn');
    const hangupBtn = document.getElementById('hangupBtn');
    const callStatus = document.getElementById('callStatus');
    const callCard = document.getElementById('callCard');
    const chatLog = document.getElementById('chatLog');
    const actionBadge = document.getElementById('actionBadge');
    const settingsModal = document.getElementById('settingsModal');
    const openSettings = document.getElementById('openSettings');
    const saveSettingsBtn = document.getElementById('saveSettingsBtn');
    const resetPromptBtn = document.getElementById('resetPromptBtn');
    const fetchModelsBtn = document.getElementById('fetchModelsBtn');
    const apiKeyInput = document.getElementById('apiKeyInput');
    const modelSelect = document.getElementById('modelSelect');
    const customModelGroup = document.getElementById('customModelGroup');
    const customModelInput = document.getElementById('customModelInput');
    const voiceSelect = document.getElementById('voiceSelect');
    const rateSlider = document.getElementById('rateSlider');
    const rateVal = document.getElementById('rateVal');
    const pitchSlider = document.getElementById('pitchSlider');
    const pitchVal = document.getElementById('pitchVal');
    const kneelWebhookInput = document.getElementById('kneelWebhookInput');
    const standWebhookInput = document.getElementById('standWebhookInput');
    const releaseWebhookInput = document.getElementById('releaseWebhookInput');
    const systemPromptInput = document.getElementById('systemPromptInput');

    apiKeyInput.value = config.apiKey;
    rateSlider.value = config.rate;
    rateVal.innerText = `${config.rate}x`;
    pitchSlider.value = config.pitch;
    pitchVal.innerText = `${config.pitch}x`;
    kneelWebhookInput.value = config.kneelWebhook;
    standWebhookInput.value = config.standWebhook;
    releaseWebhookInput.value = config.releaseWebhook;
    systemPromptInput.value = config.prompt;

    const presetModels = ['llama-3.3-70b-versatile', 'llama-3.1-8b-instant', 'deepseek-r1-distill-llama-70b'];
    if (presetModels.includes(config.model)) {
      modelSelect.value = config.model;
      customModelGroup.style.display = 'none';
    } else {
      modelSelect.value = 'custom';
      customModelInput.value = config.model;
      customModelGroup.style.display = 'block';
    }

    modelSelect.onchange = () => {
      customModelGroup.style.display = modelSelect.value === 'custom' ? 'block' : 'none';
    };

    rateSlider.oninput = () => { rateVal.innerText = `${rateSlider.value}x`; };
    pitchSlider.oninput = () => { pitchVal.innerText = `${pitchSlider.value}x`; };

    function populateVoices() {
      availableVoices = synth.getVoices();
      if (!availableVoices.length) return;

      voiceSelect.innerHTML = '';
      availableVoices.forEach((v) => {
        const opt = document.createElement('option');
        opt.value = v.voiceURI;
        opt.textContent = `${v.name} (${v.lang})`;
        if (v.voiceURI === config.voiceURI) opt.selected = true;
        voiceSelect.appendChild(opt);
      });

      if (!config.voiceURI && availableVoices.length > 0) {
        const bestDefault = availableVoices.find(v => (v.name.includes("Female") || v.name.includes("Google") || v.name.includes("Natural")) && v.lang.startsWith("en")) || availableVoices[0];
        if (bestDefault) {
          voiceSelect.value = bestDefault.voiceURI;
          config.voiceURI = bestDefault.voiceURI;
        }
      }
    }

    populateVoices();
    if (speechSynthesis.onvoiceschanged !== undefined) {
      speechSynthesis.onvoiceschanged = populateVoices;
    }

    fetchModelsBtn.onclick = async () => {
      const key = apiKeyInput.value.trim();
      if (!key) {
        alert("Please paste your Groq API Key first.");
        return;
      }
      fetchModelsBtn.innerText = "⏳...";

      try {
        const res = await fetch("https://api.groq.com/openai/v1/models", {
          headers: { "Authorization": `Bearer ${key}` }
        });
        const data = await res.json();
        if (data.error) throw new Error(data.error.message);

        const models = data.data
          .map(m => m.id)
          .filter(id => !id.includes("whisper") && !id.includes("guard") && !id.includes("vision"))
          .sort();

        modelSelect.innerHTML = '';
        models.forEach(m => {
          const opt = document.createElement('option');
          opt.value = m;
          opt.textContent = m;
          if (m.includes("70b")) opt.textContent += " (Recommended)";
          modelSelect.appendChild(opt);
        });

        const customOpt = document.createElement('option');
        customOpt.value = "custom";
        customOpt.textContent = "Other / Custom...";
        modelSelect.appendChild(customOpt);

        customModelGroup.style.display = 'none';
        fetchModelsBtn.innerText = "✅ Done";
        setTimeout(() => { fetchModelsBtn.innerText = "🔄 Detect"; }, 2000);

      } catch (err) {
        alert(`Failed to fetch models: ${err.message}`);
        fetchModelsBtn.innerText = "❌ Error";
        setTimeout(() => { fetchModelsBtn.innerText = "🔄 Detect"; }, 2000);
      }
    };

    resetPromptBtn.onclick = () => {
      systemPromptInput.value = DEFAULT_PROMPT;
    };

    openSettings.onclick = () => settingsModal.classList.add('open');
    saveSettingsBtn.onclick = () => {
      config.apiKey = apiKeyInput.value.trim();
      config.model = modelSelect.value === 'custom' ? customModelInput.value.trim() : modelSelect.value.trim();
      config.voiceURI = voiceSelect.value;
      config.rate = parseFloat(rateSlider.value);
      config.pitch = parseFloat(pitchSlider.value);
      config.kneelWebhook = kneelWebhookInput.value.trim();
      config.standWebhook = standWebhookInput.value.trim();
      config.releaseWebhook = releaseWebhookInput.value.trim();
      config.prompt = systemPromptInput.value.trim();

      localStorage.setItem('groq_api_key', config.apiKey);
      localStorage.setItem('groq_model', config.model);
      localStorage.setItem('groq_voice_uri', config.voiceURI);
      localStorage.setItem('groq_rate', config.rate);
      localStorage.setItem('groq_pitch', config.pitch);
      localStorage.setItem('groq_kneel_webhook', config.kneelWebhook);
      localStorage.setItem('groq_stand_webhook', config.standWebhook);
      localStorage.setItem('groq_release_webhook', config.releaseWebhook);
      localStorage.setItem('groq_prompt', config.prompt);
      settingsModal.classList.remove('open');
    };

    callBtn.onclick = () => {
      if (!config.apiKey) {
        settingsModal.classList.add('open');
        alert('Please enter your Groq API key in settings.');
        return;
      }
      startCall();
    };

    pauseBtn.onclick = () => togglePause();
    hangupBtn.onclick = () => endCall();

    function togglePause() {
      if (!isCalling) return;
      isPaused = !isPaused;

      if (isPaused) {
        if (recognition) {
          try { recognition.abort(); } catch (e) {}
        }
        clearTimeout(silenceTimer);
        callCard.className = "call-card";
        callStatus.innerText = "⏸️ Call Paused (Mic Off)";
        pauseBtn.innerText = "▶️";
        pauseBtn.title = "Resume Call";
        pauseBtn.style.backgroundColor = "var(--success)";
      } else {
        pauseBtn.innerText = "⏸️";
        pauseBtn.title = "Pause Mic";
        pauseBtn.style.backgroundColor = "var(--warning)";
        callStatus.innerText = "Listening...";
        callCard.className = "call-card listening";
        startSpeechTurn();
      }
    }

    function appendMessage(sender, text, isInterim = false) {
      if (isInterim) {
        if (!currentInterimBubble) {
          currentInterimBubble = document.createElement('div');
          currentInterimBubble.className = 'bubble user interim';
          chatLog.appendChild(currentInterimBubble);
        }
        currentInterimBubble.textContent = text;
      } else {
        if (currentInterimBubble) {
          currentInterimBubble.remove();
          currentInterimBubble = null;
        }
        const b = document.createElement('div');
        b.className = `bubble ${sender}`;
        b.textContent = text;
        chatLog.appendChild(b);
      }
      chatLog.scrollTop = chatLog.scrollHeight;
    }

    function showHardwareBadge(text) {
      actionBadge.innerText = text;
      actionBadge.style.display = 'inline-block';
      setTimeout(() => { actionBadge.style.display = 'none'; }, 4500);
    }

    // Robust Webhook Trigger with Image Ping Fallback
    function triggerWebhook(url, actionName) {
      if (!url) return;
      showHardwareBadge(`⚡ ${actionName}`);

      try {
        fetch(url, { method: 'GET', mode: 'no-cors', cache: 'no-store' }).catch(() => {});
        // Fallback: ping via image
        const img = new Image();
        img.src = url + (url.includes('?') ? '&' : '?') + 't=' + Date.now();
      } catch (err) {
        console.error("Webhook trigger error:", err);
      }
    }

    function startCall() {
      isCalling = true;
      isPaused = false;
      isProcessing = false;
      chatHistory = [];
      chatLog.innerHTML = '';
      callBtn.style.display = "none";
      pauseBtn.style.display = "flex";
      pauseBtn.innerText = "⏸️";
      pauseBtn.style.backgroundColor = "var(--warning)";
      hangupBtn.style.display = "flex";
      callCard.className = "call-card listening";
      callStatus.innerText = "Listening...";
      appendMessage('katee', "Call connected. Speak to me, darling.");

      startSpeechTurn();
    }

    function startSpeechTurn() {
      if (!isCalling || isPaused || isProcessing) return;

      const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
      if (!SpeechRecognition) {
        alert("Please use Google Chrome on Android for voice input.");
        endCall();
        return;
      }

      if (recognition) {
        try { recognition.abort(); } catch (e) {}
        recognition = null;
      }

      recognition = new SpeechRecognition();
      recognition.continuous = false;
      recognition.interimResults = true;
      recognition.lang = 'en-US';
      latestTranscript = "";

      recognition.onstart = () => {
        if (isCalling && !isPaused && !isProcessing) {
          callCard.className = "call-card listening";
          callStatus.innerText = "Listening...";
        }
      };

      recognition.onresult = (event) => {
        let text = "";
        for (let i = 0; i < event.results.length; i++) {
          text = event.results[i][0].transcript;
        }
        latestTranscript = text.trim();
        if (latestTranscript) {
          appendMessage('user', latestTranscript, true);

          if (latestTranscript.toUpperCase().includes("RED")) {
            triggerWebhook(config.releaseWebhook, "Safeword RED (Release Triggered)");
          }

          clearTimeout(silenceTimer);
          silenceTimer = setTimeout(() => {
            if (latestTranscript && isCalling && !isPaused && !isProcessing) {
              commitUserSpeech(latestTranscript);
            }
          }, 1000);
        }
      };

      recognition.onerror = (e) => {
        if (isCalling && e.error !== 'no-speech') {
          console.warn("Speech error:", e.error);
        }
      };

      recognition.onend = () => {
        if (isCalling && !isPaused && !isProcessing && callStatus.innerText === "Listening...") {
          if (latestTranscript && latestTranscript.length > 1) {
            commitUserSpeech(latestTranscript);
          } else {
            setTimeout(() => { if (isCalling && !isPaused && !isProcessing) startSpeechTurn(); }, 300);
          }
        }
      };

      try { recognition.start(); } catch (err) { console.error(err); }
    }

    function commitUserSpeech(text) {
      if (isProcessing || isPaused) return;
      isProcessing = true;
      clearTimeout(silenceTimer);
      latestTranscript = "";

      if (recognition) {
        try { recognition.abort(); } catch (e) {}
        recognition = null;
      }
      appendMessage('user', text, false);
      sendToGroq(text);
    }

    async function sendToGroq(userText) {
      callCard.className = "call-card";
      callStatus.innerText = "Katee is thinking...";
      chatHistory.push({ role: "user", content: userText });

      if (chatHistory.length > 8) {
        chatHistory = chatHistory.slice(-8);
      }

      try {
        const url = "https://api.groq.com/openai/v1/chat/completions";
        
        const messages = [
          { role: "system", content: config.prompt },
          ...chatHistory
        ];

        const res = await fetch(url, {
          method: "POST",
          headers: {
            "Content-Type": "application/json",
            "Authorization": `Bearer ${config.apiKey.trim()}`
          },
          body: JSON.stringify({
            model: config.model.trim(),
            messages: messages,
            max_tokens: 120, // STRICT TOKEN LIMIT FOR 2-4 SENTENCES
            temperature: 0.75
          })
        });

        const data = await res.json();
        
        if (data.error) {
          throw new Error(data.error.message);
        }

        const rawReply = data.choices[0].message.content.trim();

        // 1. Hardware Action Webhook Triggers (Case-Insensitive & Flexible)
        if (/\[ACTION:\s*KNEEL\]/i.test(rawReply) || /\bACTION:\s*KNEEL\b/i.test(rawReply)) {
          triggerWebhook(config.kneelWebhook, "Hardware: Kneel Sent");
        } else if (/\[ACTION:\s*STAND\]/i.test(rawReply) || /\bACTION:\s*STAND\b/i.test(rawReply)) {
          triggerWebhook(config.standWebhook, "Hardware: Stand Sent");
        } else if (/\[ACTION:\s*RELEASE\]/i.test(rawReply) || /\bACTION:\s*RELEASE\b/i.test(rawReply)) {
          triggerWebhook(config.releaseWebhook, "Hardware: Release Sent");
        }

        // 2. Clean out tags for clean spoken output
        const cleanText = rawReply
          .replace(/\[ACTION:\s*(KNEEL|STAND|RELEASE)\]/gi, '')
          .replace(/ACTION:\s*(KNEEL|STAND|RELEASE)/gi, '')
          .replace(/\*/g, '')
          .trim();

        chatHistory.push({ role: "assistant", content: cleanText });
        appendMessage('katee', cleanText);

        speakReply(cleanText);

      } catch (err) {
        console.error("Groq Error:", err);
        appendMessage('system', err.message);
        resumeListeningWithDelay(2000);
      }
    }

    function speakReply(text) {
      callCard.className = "call-card talking";
      callStatus.innerText = "Katee is speaking...";

      const utterance = new SpeechSynthesisUtterance(text);
      utterance.rate = config.rate;
      utterance.pitch = config.pitch;

      const selected = availableVoices.find(v => v.voiceURI === config.voiceURI);
      if (selected) utterance.voice = selected;

      utterance.onend = () => {
        resumeListeningWithDelay(600);
      };

      utterance.onerror = () => {
        resumeListeningWithDelay(500);
      };

      synth.speak(utterance);
    }

    function resumeListeningWithDelay(ms) {
      callCard.className = "call-card";
      if (!isPaused) callStatus.innerText = "Listening...";
      setTimeout(() => {
        isProcessing = false;
        if (isCalling && !isPaused) {
          startSpeechTurn();
        }
      }, ms);
    }

    function endCall() {
      isCalling = false;
      isPaused = false;
      isProcessing = false;
      clearTimeout(silenceTimer);
      callCard.className = "call-card";
      callStatus.innerText = "Call Ended";
      callBtn.style.display = "flex";
      pauseBtn.style.display = "none";
      hangupBtn.style.display = "none";
      actionBadge.style.display = 'none';

      if (currentInterimBubble) {
        currentInterimBubble.remove();
        currentInterimBubble = null;
      }

      if (recognition) {
        try { recognition.abort(); } catch (e) {}
        recognition = null;
      }
      if (synth) synth.cancel();
    }
  </script>
