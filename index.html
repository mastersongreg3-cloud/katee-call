      const badge = document.getElementById('moodBadge');
      if (badge) {
        if (kateeTemper <= 35) { 
          badge.innerText = `Mood: Seductive (${kateeTemper}%)`;

        } else if (kateeTemper <= 65) { 
          badge.innerText = `Mood: Irritated (${kateeTemper}%)`; 
          badge.style.color = "#fbbf24"; 
          badge.style.background = "rgba(245, 158, 11, 0.2)"; 
        } else { 
          badge.innerText = `Mood: Furious (${kateeTemper}%)`; 
          badge.style.color = "#f87171"; 
          badge.style.background = "rgba(239, 68, 68, 0.2)"; 
        }
      }

      // 5. INJECT DYNAMIC MOOD & PARROT WARNING INTO PROMPT
      let moodDirective = `\n\n[CURRENT TEMPER: ${kateeTemper}/100]\n`;
      if (consecutiveSamePhraseCount >= 1) {
        moodDirective += `WARNING: The user is repeating "${lower}" like a lazy broken record without thinking. Call him out for repeating himself, demand a real answer to what you said, and do NOT reward him.\n`;
      }
      
      if (kateeTemper <= 35) {
        moodDirective += `State: Seductive & Pleased. Slapper is mostly IDLE. Use [VIBE_ON] for quick teasing bursts if he pleases you.`;
      } else if (kateeTemper <= 65) {
        moodDirective += `State: Irritated. Discipline him with [SLAP_ON] and let the slapper run while you talk.`;
      } else {
        moodDirective += `State: FURIOUS & RUTHLESS. You are angry. If the slapper is not on, turn it on with [SLAP_ON] and LEAVE IT SLAPPING. Refuse to turn it off until he gives thoughtful, sincere apologies.`;
      }
      return moodDirective;
    }

    // --- DOM SETUP ---

      localStorage.setItem('katee_prompt', config.prompt);

      const notesInput = document.getElementById('memoryNotesInput');
      if (notesInput) {
        kateeMemory.sessionNotes = notesInput.value.trim();
        saveKateeMemory();
      }
      settingsModal.classList.remove('open');

    // --- HARDWARE WEBHOOK DISPATCHER ---
    function sendWebhook(url) {
      if (!url) return;
      console.log("EXEC HARDWARE: " + url);
      try {
        fetch(url, { method: 'GET', mode: 'no-cors', cache: 'no-store' }).catch(() => {});
        const img = new Image(); img.src = url + (url.includes('?') ? '&' : '?') + 't=' + Date.now();
      } catch (err) {}
    }

    function updateLight(id, label, active, pulse = false, cooldown = false) {
      const el = document.getElementById(id);
      if (!el) return;
      el.innerText = label;
      active ? el.classList.add('active') : el.classList.remove('active');
      pulse ? el.classList.add('pulse') : el.classList.remove('pulse');
      cooldown ? el.classList.add('cooldown') : el.classList.remove('cooldown');
    }

    // --- VIBRATOR BURST (3-6s) & 9s COOLDOWN ---
    function triggerVibratorBurst() {
      const now = Date.now();
      if (now < vibeCooldownUntil) {
        const remainingSec = Math.ceil((vibeCooldownUntil - now) / 1000);
        console.log(`Vibrator on cooldown: ${remainingSec}s remaining`);
        return;
      }

      const burstDurationSec = Math.floor(Math.random() * 4) + 3;
      sendWebhook(config.vibeOnWebhook);
      updateLight("light-vibe", `Vibrator: ACTIVE (${burstDurationSec}s)`, true);
      kateeMemory.totalVibes = (kateeMemory.totalVibes || 0) + 1;
      saveKateeMemory();

      if (vibeAutoOffTimer) clearTimeout(vibeAutoOffTimer);

      vibeAutoOffTimer = setTimeout(() => {
        sendWebhook(config.vibeOffWebhook);
        vibeCooldownUntil = Date.now() + 9000;
        updateLight("light-vibe", "Vibrator: COOLDOWN (9s)", false, false, true);

        let cdRemaining = 9;
        const cdInterval = setInterval(() => {
          cdRemaining--;
          if (cdRemaining > 0) {
            updateLight("light-vibe", `Vibrator: COOLDOWN (${cdRemaining}s)`, false, false, true);
          } else {
            clearInterval(cdInterval);
            updateLight("light-vibe", "Vibrator: OFF", false, false, false);
          }
        }, 1000);

      }, burstDurationSec * 1000);
    }

// --- BULLETPROOF ACTION PARSER (WITH NEGATION GUARDS) ---
    function parseHardwareActions(raw) {
      const lower = raw.toLowerCase();
      const elapsedMinutes = callStartTime ? Math.floor((Date.now() - callStartTime) / 60000) : 0;

      // Check if she is explicitly refusing or saying NO
      const isNegated = /\b(not|won't|wont|never|refuse|why would i|don't think|no way|not going to|not gonna)\b/i.test(lower);

      // 1. [UNTIE] / RELEASE / Safeword RED
      if (/\[?UNTIE\]?/i.test(raw) || /\[?ACTION:\s*RELEASE\]?/i.test(raw) || lower.includes("disengage the electromagnet")) {
        // Block untie if she is refusing (e.g. "I'm not untying you") unless it's the safeword RED
        if (!isNegated && (elapsedMinutes >= 15 || lower.includes("safeword") || lower.includes("red"))) {
          sendWebhook(config.releaseWebhook);
          sendWebhook(config.slapOffWebhook);
          sendWebhook(config.vibeOffWebhook);
          isSlapperActive = false;
          if (vibeAutoOffTimer) clearTimeout(vibeAutoOffTimer);
          updateLight("light-restraints", "Restraints: RELEASED", false);
          updateLight("light-slap", "Ball-Slapper: IDLE", false, false);
          updateLight("light-vibe", "Vibrator: OFF", false, false, false);
        }
      }

      // 2. BALL-SLAPPER OFF (Strictly blocked if she says "won't stop" or "not turning off")
      const wantsSlapOff = /\[?SLAP[_\s-]?OFF:?\]?/i.test(raw) || 
        (!isNegated && (lower.includes("stop slapping") || lower.includes("turn off the slapper") || lower.includes("break from me slapping")));

      if (wantsSlapOff && !isNegated) {
        if (isSlapperActive) {
          sendWebhook(config.slapOffWebhook);
          isSlapperActive = false;
          updateLight("light-slap", "Ball-Slapper: IDLE", false, false);
        }
      } 
      // 3. BALL-SLAPPER ON
      else if (/\[?SLAP[_\s-]?ON:?\]?/i.test(raw) || (!isNegated && (lower.includes("slapper on") || lower.includes("turn on the slapper") || lower.includes("start slapping")))) {
        if (!isSlapperActive) {
          sendWebhook(config.slapOnWebhook);
          isSlapperActive = true;
          updateLight("light-slap", "Slapping Balls...", true, true);
          kateeMemory.totalSlaps = (kateeMemory.totalSlaps || 0) + 1;
          saveKateeMemory();
        }
      }

      // 4. VIBRATOR (3-6s burst with 9s cooldown)
      if (!isNegated && (/\[?VIBE[_\s-]?ON:?\]?/i.test(raw) || lower.includes("vibrator on") || lower.includes("vibe on") || lower.includes("turn on the vibrator"))) {
        triggerVibratorBurst();
      }
      if (/\[?VIBE[_\s-]?OFF:?\]?/i.test(raw) || (!isNegated && (lower.includes("vibrator off") || lower.includes("turn off the vibrator")))) {
        if (vibeAutoOffTimer) clearTimeout(vibeAutoOffTimer);
        sendWebhook(config.vibeOffWebhook);
        updateLight("light-vibe", "Vibrator: OFF", false, false, false);
      }
    }

    // --- ENGINE ---
    function sendTextMessage() { 
      const t = userTextInput.value.trim(); 
      if (t && !isProcessing) { 
        userTextInput.value = ""; 
        appendMessage('user', t, false); 
        executeTurn(t); 
      }
    }

    function commitUserSpeech(text) {
      if (isProcessing || isPaused || !text || !text.trim()) return;
      isProcessing = true;
      clearTimeout(silenceTimer);
      latestTranscript = "";

      if (recognition) {
        try { recognition.abort(); } catch (e) {}
      }

      appendMessage('user', text, false);
      executeTurn(text);
    }

    async function executeTurn(userText) {
      isProcessing = true;
      callCard.className = "call-card";
      callStatus.innerText = "Katie is thinking...";
      chatHistory.push({ role: "user", content: userText });
      if (chatHistory.length > 6) chatHistory = chatHistory.slice(-6);

      try {
        let baseUrl = config.apiOrUrl.replace(/\/+$/, '');
        if (!baseUrl.includes('/v1')) baseUrl += '/v1';
        const url = `${baseUrl}/chat/completions`;

        const mood = updateKatieMood(userText);
        const elapsedMinutes = callStartTime ? Math.floor((Date.now() - callStartTime) / 60000) : 0;
        const timeDirective = `\n\n[SESSION ELAPSED TIME: ${elapsedMinutes} MINUTES / 30 MINUTES TOTAL]`;

        const res = await fetch(url, {
          method: "POST",
          headers: { "Content-Type": "application/json", "ngrok-skip-browser-warning": "true" },
          body: JSON.stringify({
            messages: [{ role: "system", content: config.prompt + mood + timeDirective }, ...chatHistory],
            max_tokens: 120, 
            temperature: 0.7, 
            stop: ["User:", "\nUser:", "Human:"]
          })
        });

        const data = await res.json();
        if (data.error) throw new Error(data.error.message || JSON.stringify(data.error));

        const raw = (data.choices?.[0]?.message?.content || "").trim();
        parseHardwareActions(raw);

// FORCIBLY STRIP TAGS & SWAP PASSIVE WORDS BEFORE KOKORO SPEAKS
        let cleanText = raw
          .replace(/\[.*?\]/g, '')
          .replace(/<think>[\s\S]*?<\/think>/gi, '')
          .replace(/\b(VIBE_ON|VIBE_OFF|SLAP_ON|SLAP_OFF|UNTIE|VIBE ON|VIBE OFF|SLAP ON|SLAP OFF):?/gi, '')
          .replace(/\bthe ball-slapper machine\b/gi, 'me slapping your balls')
          .replace(/\bthe ball-slapper\b/gi, 'me slapping your balls')
          .replace(/\bthe slapper\b/gi, 'me slapping your balls')
          .replace(/\ba break from the slapper\b/gi, 'a break from me slapping your balls')
          .replace(/\*[^*]*\*/g, '')
          .trim();

        const sentences = cleanText.match(/[^.!?]+[.!?]+/g);
        if (sentences && sentences.length > 2) cleanText = sentences.slice(0, 2).join(' ');

        if (!cleanText) cleanText = "Stay right where you are and take it like a good boy.";

        chatHistory.push({ role: "assistant", content: cleanText });
        appendMessage('katee', cleanText, false);
        playVoice(cleanText);

      } catch (err) {
        console.error("Execute Error:", err);
        appendMessage('system', "Connection Error: Check LM Studio & Cloudflare tunnel.", false);
        resumeListeningWithDelay(2500);
      }
    }

    async function playVoice(text) {
      callCard.className = "call-card talking";
      callStatus.innerText = "Katie is speaking...";

      if (config.kokoroUrl) {
        try {
          let baseUrl = config.kokoroUrl.replace(/\/+$/, '');
          if (!baseUrl.includes('/v1')) baseUrl += '/v1';
          const ttsUrl = `${baseUrl}/audio/speech`;

          const res = await fetch(ttsUrl, {
            method: "POST",
            headers: { "Content-Type": "application/json", "ngrok-skip-browser-warning": "true" },
            body: JSON.stringify({ input: text, voice: config.kokoroVoice, response_format: "mp3" })
          });

          if (!res.ok) throw new Error("Kokoro TTS request failed");

          const blob = await res.blob();
          const audioEl = document.getElementById('audioPlayback');
          audioEl.src = URL.createObjectURL(blob);
          audioEl.onended = () => { resumeListeningWithDelay(600); };
          audioEl.play().catch(() => {});
          return;

        } catch (e) {
          console.warn("Kokoro TTS Offline, using browser voice fallback:", e);
        }
      }

      const u = new SpeechSynthesisUtterance(text);
      u.rate = 0.95;
      u.onend = () => resumeListeningWithDelay(600);
      synth.speak(u);
    }

    // --- CALL CONTROLS & SPEECH ENGINE ---
    callBtn.onclick = () => {
      if (!config.apiOrUrl) {
        settingsModal.classList.add('open');
        alert('Please enter your LM Studio URL in settings.');
        return;
      }

      isCalling = true; 
      isPaused = false; 
      isProcessing = false;
      callStartTime = Date.now();
      chatLog.innerHTML = '';
      callBtn.style.display = "none"; 
      pauseBtn.style.display = "flex"; 
      pauseBtn.innerText = "⏸️";
      pauseBtn.style.backgroundColor = "var(--warning)";
      hangupBtn.style.display = "flex";
      callCard.className = "call-card listening"; 
      callStatus.innerText = "Listening...";
      appendMessage('katee', "Hardware linked. You are tied to the bed. I'm listening, handsome.", false);
      startSpeechTurn();
    };

    pauseBtn.onclick = () => {
      if (!isCalling) return;
      isPaused = !isPaused;
      if (isPaused) {
        if (recognition) try { recognition.abort(); } catch (e) {}
        clearTimeout(silenceTimer);
        callCard.className = "call-card"; 
        callStatus.innerText = "⏸️ Call Paused";
        pauseBtn.innerText = "▶️"; 
        pauseBtn.style.backgroundColor = "var(--success)";
      } else {
        pauseBtn.innerText = "⏸️"; 
        pauseBtn.style.backgroundColor = "var(--warning)";
        callStatus.innerText = "Listening..."; 
        callCard.className = "call-card listening";
        startSpeechTurn();
      }
    };

    hangupBtn.onclick = () => {
      isCalling = false; 
      isPaused = false; 
      isProcessing = false;
      callStartTime = null;
      clearTimeout(silenceTimer);
      callCard.className = "call-card"; 
      callStatus.innerText = "Call Ended";
      callBtn.style.display = "flex"; 
      pauseBtn.style.display = "none"; 
      hangupBtn.style.display = "none";

      // Stop slapper on hangup
      if (isSlapperActive) {
        sendWebhook(config.slapOffWebhook);
        isSlapperActive = false;
        updateLight("light-slap", "Ball-Slapper: IDLE", false, false);
      }
      if (vibeAutoOffTimer) clearTimeout(vibeAutoOffTimer);

      if (currentInterimBubble) { currentInterimBubble.remove(); currentInterimBubble = null; }
      if (recognition) try { recognition.abort(); } catch (e) {}
      if (synth) synth.cancel();

      if (chatHistory.length >= 2) {
        kateeMemory.totalSessions++;
        kateeMemory.sessionNotes = `Session ${kateeMemory.totalSessions}: ${kateeTemper > 60 ? 'Ended while furious. User was defiant.' : 'Ended normally.'}`;
        saveKateeMemory();
      }
    };

    function startSpeechTurn() {
      if (!isCalling || isPaused || isProcessing) return;

      const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
      if (!SpeechRecognition) {
        alert("Please use Google Chrome on Android for voice input.");
        return;
      }

      if (recognition) {
        try { recognition.abort(); } catch (e) {}
        recognition = null;
      }

      recognition = new SpeechRecognition();
      recognition.continuous = false;
      recognition.interimResults = true;
      recognition.lang = 'en-US';
      latestTranscript = "";

      recognition.onstart = () => {
        if (isCalling && !isPaused && !isProcessing) {
          callCard.className = "call-card listening";
          callStatus.innerText = "Listening...";
        }
      };

      recognition.onresult = (event) => {
        let text = "";
        for (let i = 0; i < event.results.length; i++) {
          text = event.results[i][0].transcript;
        }
        latestTranscript = text.trim();

        if (latestTranscript) {
          appendMessage('user', latestTranscript, true);

          if (latestTranscript.toUpperCase().includes("RED")) {
            sendWebhook(config.releaseWebhook);
            sendWebhook(config.slapOffWebhook);
            sendWebhook(config.vibeOffWebhook);
            isSlapperActive = false;
            if (vibeAutoOffTimer) clearTimeout(vibeAutoOffTimer);
            updateLight("light-restraints", "Restraints: RELEASED", false);
            updateLight("light-slap", "Ball-Slapper: IDLE", false, false);
            updateLight("light-vibe", "Vibrator: OFF", false, false, false);
          }

          clearTimeout(silenceTimer);
          silenceTimer = setTimeout(() => {
            if (latestTranscript && isCalling && !isPaused && !isProcessing) {
              commitUserSpeech(latestTranscript);
            }
          }, 1000);
        }
      };

      recognition.onerror = (e) => {
        if (e.error !== 'no-speech') {
          console.warn("Speech error:", e.error);
        }
      };

      recognition.onend = () => {
        if (isCalling && !isPaused && !isProcessing && callStatus.innerText === "Listening...") {
          if (latestTranscript && latestTranscript.length > 1) {
            commitUserSpeech(latestTranscript);
          } else {
            setTimeout(() => {
              if (isCalling && !isPaused && !isProcessing) startSpeechTurn();
            }, 300);
          }
        }
      };

      try {
        recognition.start();
      } catch (err) {
        console.error("Mic start error:", err);
      }
    }

    function resumeListeningWithDelay(ms) { 
      callCard.className = "call-card"; 
      if (!isPaused && isCalling) callStatus.innerText = "Listening...";
      setTimeout(() => {
        isProcessing = false;
        if (isCalling && !isPaused) startSpeechTurn();
      }, ms); 
    }

    function appendMessage(sender, text, isInterim = false) {
      if (!text || typeof text !== 'string' || !text.trim()) return;

      if (isInterim) {
        if (!currentInterimBubble) {
          currentInterimBubble = document.createElement('div');
          currentInterimBubble.className = 'bubble user interim';
          chatLog.appendChild(currentInterimBubble);
        }
        currentInterimBubble.textContent = text;
      } else {
        if (currentInterimBubble) {
          currentInterimBubble.remove();
          currentInterimBubble = null;
        }
        const b = document.createElement('div');
        b.className = `bubble ${sender}`;
        b.textContent = text;
        chatLog.appendChild(b);
      }
      chatLog.scrollTop = chatLog.scrollHeight;
    }
  </script>
