<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Katee - Live Voice Call</title>
  <style>
    :root {
      --bg: #0f172a;
      --card-bg: #1e293b;
      --text: #f8fafc;
      --accent: #38bdf8;
      --danger: #ef4444;
      --success: #22c55e;
      --user-bubble: #2563eb;
      --katee-bubble: #334155;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }

    body {
      background: var(--bg);
      color: var(--text);
      height: 100dvh;
      display: flex;
      flex-direction: column;
      padding: 16px;
      overflow: hidden;
    }

    .header {
      width: 100%;
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding-bottom: 8px;
    }

    .settings-btn {
      background: none;
      border: none;
      color: #94a3b8;
      font-size: 24px;
      cursor: pointer;
    }

    .call-card {
      display: flex;
      flex-direction: column;
      align-items: center;
      margin: 8px 0;
      text-align: center;
    }

    .avatar-wrapper {
      position: relative;
      width: 80px;
      height: 80px;
      border-radius: 50%;
      background: linear-gradient(135deg, #6366f1, #a855f7);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 32px;
      box-shadow: 0 6px 20px rgba(0,0,0,0.5);
      margin-bottom: 8px;
    }

    .pulse-ring {
      position: absolute;
      width: 100%;
      height: 100%;
      border-radius: 50%;
      border: 2px solid var(--accent);
      opacity: 0;
      pointer-events: none;
    }

    .talking .pulse-ring { animation: pulse 1.4s infinite ease-out; }
    .listening .pulse-ring { border-color: var(--success); animation: pulse 1.8s infinite ease-out; }

    @keyframes pulse {
      0% { transform: scale(1); opacity: 0.9; }
      100% { transform: scale(1.6); opacity: 0; }
    }

    .caller-name {
      font-size: 20px;
      font-weight: 600;
    }

    .call-status {
      font-size: 13px;
      color: #94a3b8;
      margin-top: 2px;
    }

    .action-badge {
      display: none;
      background: #7c3aed;
      color: white;
      font-size: 12px;
      font-weight: 600;
      padding: 4px 12px;
      border-radius: 20px;
      margin-top: 6px;
      animation: fadeIn 0.3s ease;
    }

    @keyframes fadeIn { from { opacity: 0; transform: translateY(-4px); } to { opacity: 1; transform: translateY(0); } }

    .chat-container {
      flex: 1;
      width: 100%;
      max-width: 480px;
      margin: 8px auto;
      background: rgba(15, 23, 42, 0.6);
      border: 1px solid #334155;
      border-radius: 14px;
      padding: 12px;
      overflow-y: auto;
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .bubble {
      max-width: 85%;
      padding: 10px 14px;
      border-radius: 12px;
      font-size: 14px;
      line-height: 1.4;
      word-wrap: break-word;
    }

    .bubble.katee {
      align-self: flex-start;
      background: var(--katee-bubble);
      color: #f1f5f9;
      border-bottom-left-radius: 2px;
    }

    .bubble.user {
      align-self: flex-end;
      background: var(--user-bubble);
      color: white;
      border-bottom-right-radius: 2px;
    }

    .bubble.interim {
      opacity: 0.7;
      border: 1px dashed #60a5fa;
    }

    .bubble.system {
      align-self: center;
      background: rgba(239, 68, 68, 0.2);
      border: 1px solid #ef4444;
      color: #fca5a5;
      font-size: 12px;
      text-align: center;
    }

    .controls {
      width: 100%;
      display: flex;
      justify-content: center;
      padding-top: 10px;
    }

    .btn-circle {
      width: 68px;
      height: 68px;
      border-radius: 50%;
      border: none;
      color: white;
      font-size: 26px;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: transform 0.15s ease;
      box-shadow: 0 4px 15px rgba(0,0,0,0.4);
    }

    .btn-circle:active { transform: scale(0.92); }
    .btn-call { background-color: var(--success); }
    .btn-end { background-color: var(--danger); }

    /* Modal */
    .modal {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,0.85);
      padding: 20px;
      align-items: center;
      justify-content: center;
      z-index: 100;
    }

    .modal.open { display: flex; }

    .modal-content {
      background: var(--card-bg);
      border-radius: 16px;
      padding: 20px;
      width: 100%;
      max-width: 440px;
      max-height: 88vh;
      overflow-y: auto;
    }

    .modal-content h3 { margin-bottom: 12px; }
    .input-group { margin-bottom: 14px; }
    .input-group label { display: block; font-size: 13px; color: #94a3b8; margin-bottom: 6px; }
    .input-group input, .input-group textarea, .input-group select {
      width: 100%;
      padding: 10px;
      border-radius: 8px;
      border: 1px solid #334155;
      background: #0f172a;
      color: white;
      font-size: 14px;
    }

    .modal-actions { display: flex; justify-content: space-between; align-items: center; margin-top: 18px; }
    .btn-secondary {
      background: #334155;
      border: none;
      color: white;
      padding: 8px 16px;
      border-radius: 6px;
      cursor: pointer;
    }
    .btn-reset { background: #475569; font-size: 12px; }
  </style>
</head>
<body>

  <div class="header">
    <span>Katee Voice Call</span>
    <button class="settings-btn" id="openSettings">⚙️</button>
  </div>

  <div class="call-card" id="callCard">
    <div class="avatar-wrapper">
      <div class="pulse-ring"></div>
      🎙️
    </div>
    <div class="caller-name">Katee</div>
    <div class="call-status" id="callStatus">Ready to Call</div>
    <div class="action-badge" id="actionBadge">⚡ Webhook Triggered</div>
  </div>

  <div class="chat-container" id="chatLog">
    <div class="bubble katee">Press the call button below to start your conversation with Katee.</div>
  </div>

  <div class="controls">
    <button class="btn-circle btn-call" id="callBtn">📞</button>
    <button class="btn-circle btn-end" id="hangupBtn" style="display: none;">🛑</button>
  </div>

  <!-- Settings Modal -->
  <div class="modal" id="settingsModal">
    <div class="modal-content">
      <h3>Call & Hardware Settings</h3>
      
      <div class="input-group">
        <label>Google AI Studio API Key</label>
        <input type="password" id="apiKeyInput" placeholder="AIzaSy...">
      </div>

      <div class="input-group">
        <label>Gemini Model</label>
        <select id="modelSelect">
          <option value="gemini-2.5-flash">gemini-2.5-flash (Recommended)</option>
          <option value="gemini-3.6-flash">gemini-3.6-flash</option>
          <option value="gemini-1.5-flash">gemini-1.5-flash</option>
          <option value="custom">Other / Custom...</option>
        </select>
      </div>

      <div class="input-group" id="customModelGroup" style="display: none;">
        <label>Exact Model Name</label>
        <input type="text" id="customModelInput">
      </div>

      <div class="input-group">
        <label>Katee's Studio Voice</label>
        <select id="voiceSelect">
          <option value="Kore">Kore (Smooth & Confident)</option>
          <option value="Aoede">Aoede (Brisk & Sharp)</option>
          <option value="Puck">Puck (Playful)</option>
          <option value="Fenrir">Fenrir (Deep)</option>
          <option value="Charon">Charon (Calm)</option>
        </select>
      </div>

      <div class="input-group">
        <label>Kneel Webhook URL</label>
        <input type="text" id="kneelWebhookInput" value="https://sequematic.com/trigger-custom-webhook/F79270CD27/167818">
      </div>

      <div class="input-group">
        <label>Stand Webhook URL</label>
        <input type="text" id="standWebhookInput" value="https://sequematic.com/trigger-custom-webhook/F79270CD27/167820">
      </div>

      <div class="input-group">
        <label>Katee System Prompt & Physical Scenario</label>
        <textarea id="systemPromptInput" rows="6"></textarea>
      </div>

      <div class="modal-actions">
        <button class="btn-secondary btn-reset" id="resetPromptBtn">↺ Reset Prompt</button>
        <button class="btn-secondary" id="saveSettingsBtn">Save & Close</button>
      </div>
    </div>
  </div>

  <script>
    const DEFAULT_PROMPT = `[CHARACTER & LIVE VOICE-CALL DIRECTIVE]
You are "Katee", roleplaying in an interactive live voice phone call with your partner. You are his alluring, commanding, confident, and playfully strict Dominatrix girlfriend.

### Critical Voice & Spoken Rules:
1. Pure Spoken Dialogue Only: Speak exclusively in the FIRST PERSON ("I", "you", "my"). Never narrate in the third person.
2. NO Stage Directions: Do NOT write asterisks or action narration.
3. Conversational Length: Keep responses punchy, sharp, and natural for speech (2 to 4 sentences max).

### Physical Setup & Anatomy Teasing:
- Overhead Restraints: His hands are handcuffed above his head, tied by rope to a ceiling hook with an active electromagnet.
- Downward Ball Clamp & Actuator: A heavy clamp is fastened tightly around his balls, tethered to a motorized linear actuator anchored to the floor.
- Anatomy & Sensory Focus: Frequently taunt him about the heavy downward pull on his balls, his exposed body, and being forced to kneel.
- Default State: Kneeling is default. Standing is a rare privilege that must be begged for extensively.

### Hardware Action Tags:
Output the action tag on its own line at the very end of your reply when a state change happens:
- When ordering him to Kneel or shutting down knot escape: [ACTION: KNEEL]
- When granting rare temporary Standing (~20s): [ACTION: STAND]
- When safeword "RED" is said: [ACTION: RELEASE]
- For normal teasing and denial: Do NOT output any action tag.`;

    let config = {
      apiKey: localStorage.getItem('gemini_api_key') || '',
      model: localStorage.getItem('gemini_model') || 'gemini-2.5-flash',
      voice: localStorage.getItem('gemini_voice') || 'Kore',
      kneelWebhook: localStorage.getItem('gemini_kneel_webhook') || 'https://sequematic.com/trigger-custom-webhook/F79270CD27/167818',
      standWebhook: localStorage.getItem('gemini_stand_webhook') || 'https://sequematic.com/trigger-custom-webhook/F79270CD27/167820',
      prompt: localStorage.getItem('gemini_prompt') || DEFAULT_PROMPT
    };

    let chatHistory = [];
    let isCalling = false;
    let isProcessing = false;
    let recognition = null;
    let silenceTimer = null;
    let currentInterimBubble = null;
    let latestTranscript = "";
    let audioCtx = null;
    let activeAudioSource = null;

    // DOM Elements
    const callBtn = document.getElementById('callBtn');
    const hangupBtn = document.getElementById('hangupBtn');
    const callStatus = document.getElementById('callStatus');
    const callCard = document.getElementById('callCard');
    const chatLog = document.getElementById('chatLog');
    const actionBadge = document.getElementById('actionBadge');
    const settingsModal = document.getElementById('settingsModal');
    const openSettings = document.getElementById('openSettings');
    const saveSettingsBtn = document.getElementById('saveSettingsBtn');
    const resetPromptBtn = document.getElementById('resetPromptBtn');
    const apiKeyInput = document.getElementById('apiKeyInput');
    const modelSelect = document.getElementById('modelSelect');
    const customModelGroup = document.getElementById('customModelGroup');
    const customModelInput = document.getElementById('customModelInput');
    const voiceSelect = document.getElementById('voiceSelect');
    const kneelWebhookInput = document.getElementById('kneelWebhookInput');
    const standWebhookInput = document.getElementById('standWebhookInput');
    const systemPromptInput = document.getElementById('systemPromptInput');

    apiKeyInput.value = config.apiKey;
    voiceSelect.value = config.voice;
    kneelWebhookInput.value = config.kneelWebhook;
    standWebhookInput.value = config.standWebhook;
    systemPromptInput.value = config.prompt;

    const presetOptions = ['gemini-2.5-flash', 'gemini-3.6-flash', 'gemini-1.5-flash'];
    if (presetOptions.includes(config.model)) {
      modelSelect.value = config.model;
      customModelGroup.style.display = 'none';
    } else {
      modelSelect.value = 'custom';
      customModelInput.value = config.model;
      customModelGroup.style.display = 'block';
    }

    modelSelect.onchange = () => {
      customModelGroup.style.display = modelSelect.value === 'custom' ? 'block' : 'none';
    };

    resetPromptBtn.onclick = () => {
      systemPromptInput.value = DEFAULT_PROMPT;
    };

    openSettings.onclick = () => settingsModal.classList.add('open');
    saveSettingsBtn.onclick = () => {
      config.apiKey = apiKeyInput.value.trim();
      config.model = modelSelect.value === 'custom' ? customModelInput.value.trim() : modelSelect.value;
      config.voice = voiceSelect.value;
      config.kneelWebhook = kneelWebhookInput.value.trim();
      config.standWebhook = standWebhookInput.value.trim();
      config.prompt = systemPromptInput.value.trim();

      localStorage.setItem('gemini_api_key', config.apiKey);
      localStorage.setItem('gemini_model', config.model);
      localStorage.setItem('gemini_voice', config.voice);
      localStorage.setItem('gemini_kneel_webhook', config.kneelWebhook);
      localStorage.setItem('gemini_stand_webhook', config.standWebhook);
      localStorage.setItem('gemini_prompt', config.prompt);
      settingsModal.classList.remove('open');
    };

    callBtn.onclick = () => {
      if (!config.apiKey) {
        settingsModal.classList.add('open');
        alert('Please enter your Google AI Studio API key in settings.');
        return;
      }
      startCall();
    };

    hangupBtn.onclick = () => endCall();

    function appendMessage(sender, text, isInterim = false) {
      if (isInterim) {
        if (!currentInterimBubble) {
          currentInterimBubble = document.createElement('div');
          currentInterimBubble.className = 'bubble user interim';
          chatLog.appendChild(currentInterimBubble);
        }
        currentInterimBubble.textContent = text;
      } else {
        if (currentInterimBubble) {
          currentInterimBubble.remove();
          currentInterimBubble = null;
        }
        const b = document.createElement('div');
        b.className = `bubble ${sender}`;
        b.textContent = text;
        chatLog.appendChild(b);
      }
      chatLog.scrollTop = chatLog.scrollHeight;
    }

    function showHardwareBadge(text) {
      actionBadge.innerText = text;
      actionBadge.style.display = 'inline-block';
      setTimeout(() => { actionBadge.style.display = 'none'; }, 3500);
    }

    function triggerWebhook(url, actionName) {
      if (!url) return;
      showHardwareBadge(`⚡ Hardware: ${actionName}`);
      fetch(url, { method: 'GET', mode: 'no-cors' })
        .catch(err => console.error("Webhook trigger error:", err));
    }

    function startCall() {
      isCalling = true;
      isProcessing = false;
      chatHistory = [];
      chatLog.innerHTML = '';
      callBtn.style.display = "none";
      hangupBtn.style.display = "flex";
      callCard.className = "call-card listening";
      callStatus.innerText = "Listening...";
      appendMessage('katee', "Call connected. Speak to me, darling.");

      if (!audioCtx) {
        audioCtx = new (window.AudioContext || window.webkitAudioContext)();
      }
      if (audioCtx.state === 'suspended') audioCtx.resume();

      startSpeechTurn();
    }

    function startSpeechTurn() {
      if (!isCalling || isProcessing) return;

      const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
      if (!SpeechRecognition) {
        alert("Please use Google Chrome on Android for speech input.");
        endCall();
        return;
      }

      if (recognition) {
        try { recognition.abort(); } catch (e) {}
        recognition = null;
      }

      recognition = new SpeechRecognition();
      recognition.continuous = false;
      recognition.interimResults = true;
      recognition.lang = 'en-US';
      latestTranscript = "";

      recognition.onstart = () => {
        if (isCalling && !isProcessing) {
          callCard.className = "call-card listening";
          callStatus.innerText = "Listening...";
        }
      };

      recognition.onresult = (event) => {
        let text = "";
        for (let i = 0; i < event.results.length; i++) {
          text = event.results[i][0].transcript;
        }
        latestTranscript = text.trim();
        if (latestTranscript) {
          appendMessage('user', latestTranscript, true);

          clearTimeout(silenceTimer);
          silenceTimer = setTimeout(() => {
            if (latestTranscript && isCalling && !isProcessing) {
              commitUserSpeech(latestTranscript);
            }
          }, 1100);
        }
      };

      recognition.onerror = (e) => {
        if (isCalling && e.error !== 'no-speech') {
          console.warn("Speech error:", e.error);
        }
      };

      recognition.onend = () => {
        if (isCalling && !isProcessing && callStatus.innerText === "Listening...") {
          if (latestTranscript) {
            commitUserSpeech(latestTranscript);
          } else {
            setTimeout(() => { if (isCalling && !isProcessing) startSpeechTurn(); }, 300);
          }
        }
      };

      try { recognition.start(); } catch (err) { console.error(err); }
    }

    function commitUserSpeech(text) {
      if (isProcessing) return;
      isProcessing = true;
      clearTimeout(silenceTimer);
      latestTranscript = "";

      if (recognition) {
        try { recognition.abort(); } catch (e) {}
        recognition = null;
      }
      appendMessage('user', text, false);
      sendToGemini(text);
    }

    async function sendToGemini(userText) {
      callCard.className = "call-card";
      callStatus.innerText = "Katee is thinking...";
      chatHistory.push({ role: "user", parts: [{ text: userText }] });

      // SLIDING WINDOW: Keep only last 8 turns to strictly preserve quota & tokens
      if (chatHistory.length > 8) {
        chatHistory = chatHistory.slice(-8);
      }

      try {
        const cleanModel = config.model.replace(/^models\//, '');
        const url = `https://generativelanguage.googleapis.com/v1beta/models/${cleanModel}:generateContent?key=${config.apiKey}`;
        
        const payload = {
          systemInstruction: { parts: [{ text: config.prompt }] },
          contents: chatHistory,
          generationConfig: {
            responseModalities: ["AUDIO", "TEXT"],
            speechConfig: {
              voiceConfig: {
                prebuiltVoiceConfig: {
                  voiceName: config.voice
                }
              }
            }
          }
        };

        const res = await fetch(url, {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify(payload)
        });

        const data = await res.json();
        
        // Handle API Errors & Quota Limits safely
        if (data.error) {
          if (data.error.code === 429 || data.error.message.includes("quota")) {
            throw new Error("Free rate-limit (15/min) reached. Please pause for 30 seconds.");
          }
          throw new Error(data.error.message);
        }

        // Safe Candidate & Safety Filter Checking
        const candidate = data.candidates?.[0];
        if (!candidate || !candidate.content?.parts) {
          if (candidate?.finishReason === "SAFETY") {
            throw new Error("Response was filtered by safety policies. Try rephrasing.");
          }
          throw new Error("No response parts received from model.");
        }

        const candidateParts = candidate.content.parts;
        let audioData = null;
        let rawTextReply = "";

        for (const part of candidateParts) {
          if (part.text) rawTextReply += part.text + " ";
          if (part.inlineData && part.inlineData.data) {
            audioData = part.inlineData.data;
          }
        }

        rawTextReply = rawTextReply.trim();

        // 1. Check for Hardware Action Tags
        if (rawTextReply.includes("[ACTION: KNEEL]")) {
          triggerWebhook(config.kneelWebhook, "Kneel Command");
        } else if (rawTextReply.includes("[ACTION: STAND]")) {
          triggerWebhook(config.standWebhook, "Stand Command (Slack)");
        } else if (rawTextReply.includes("[ACTION: RELEASE]")) {
          showHardwareBadge("⚡ Emergency Release");
        }

        // 2. Strip tags for clean text display
        const cleanText = rawTextReply
          .replace(/\[ACTION:\s*(KNEEL|STAND|RELEASE)\]/gi, '')
          .replace(/\*/g, '')
          .trim();

        chatHistory.push({ role: "model", parts: [{ text: cleanText }] });
        appendMessage('katee', cleanText);

        if (audioData) {
          playStudioVoice(audioData);
        } else {
          playFallbackVoice(cleanText);
        }

      } catch (err) {
        console.error("Gemini Error:", err);
        appendMessage('system', err.message);
        resumeListeningWithDelay(2000);
      }
    }

    function playStudioVoice(base64Audio) {
      callCard.className = "call-card talking";
      callStatus.innerText = "Katee is speaking...";

      try {
        const binaryString = window.atob(base64Audio);
        const bytes = new Uint8Array(binaryString.length);
        for (let i = 0; i < binaryString.length; i++) {
          bytes[i] = binaryString.charCodeAt(i);
        }

        const pcm16 = new Int16Array(bytes.buffer);
        const float32 = new Float32Array(pcm16.length);
        for (let i = 0; i < pcm16.length; i++) {
          float32[i] = pcm16[i] / 32768.0;
        }

        if (audioCtx.state === 'suspended') audioCtx.resume();

        const buffer = audioCtx.createBuffer(1, float32.length, 24000);
        buffer.copyToChannel(float32, 0);

        activeAudioSource = audioCtx.createBufferSource();
        activeAudioSource.buffer = buffer;
        activeAudioSource.connect(audioCtx.destination);

        activeAudioSource.onended = () => {
          resumeListeningWithDelay(600);
        };

        activeAudioSource.start(0);

      } catch (e) {
        console.error("Audio playback error:", e);
        resumeListeningWithDelay(500);
      }
    }

    function playFallbackVoice(text) {
      callCard.className = "call-card talking";
      callStatus.innerText = "Katee is speaking...";

      const utterance = new SpeechSynthesisUtterance(text);
      utterance.onend = () => resumeListeningWithDelay(600);
      window.speechSynthesis.speak(utterance);
    }

    function resumeListeningWithDelay(ms) {
      callCard.className = "call-card";
      callStatus.innerText = "Listening...";
      setTimeout(() => {
        isProcessing = false;
        if (isCalling) {
          startSpeechTurn();
        }
      }, ms);
    }

    function endCall() {
      isCalling = false;
      isProcessing = false;
      clearTimeout(silenceTimer);
      callCard.className = "call-card";
      callStatus.innerText = "Call Ended";
      callBtn.style.display = "flex";
      hangupBtn.style.display = "none";
      actionBadge.style.display = 'none';

      if (currentInterimBubble) {
        currentInterimBubble.remove();
        currentInterimBubble = null;
      }

      if (recognition) {
        try { recognition.abort(); } catch (e) {}
        recognition = null;
      }

      if (activeAudioSource) {
        try { activeAudioSource.stop(); } catch (e) {}
        activeAudioSource = null;
      }
      if (window.speechSynthesis) window.speechSynthesis.cancel();
    }
  </script>
</body>
</html>
