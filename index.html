<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Katee - Live Voice Call</title>
  <style>
    :root {
      --bg: #0f172a;
      --card-bg: #1e293b;
      --text: #f8fafc;
      --accent: #38bdf8;
      --danger: #ef4444;
      --success: #22c55e;
      --user-bubble: #2563eb;
      --katee-bubble: #334155;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }

    body {
      background: var(--bg);
      color: var(--text);
      height: 100dvh;
      display: flex;
      flex-direction: column;
      padding: 16px;
      overflow: hidden;
    }

    .header {
      width: 100%;
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding-bottom: 8px;
    }

    .settings-btn {
      background: none;
      border: none;
      color: #94a3b8;
      font-size: 24px;
      cursor: pointer;
    }

    .call-card {
      display: flex;
      flex-direction: column;
      align-items: center;
      margin: 8px 0;
      text-align: center;
    }

    .avatar-wrapper {
      position: relative;
      width: 80px;
      height: 80px;
      border-radius: 50%;
      background: linear-gradient(135deg, #6366f1, #a855f7);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 32px;
      box-shadow: 0 6px 20px rgba(0,0,0,0.5);
      margin-bottom: 8px;
    }

    .pulse-ring {
      position: absolute;
      width: 100%;
      height: 100%;
      border-radius: 50%;
      border: 2px solid var(--accent);
      opacity: 0;
      pointer-events: none;
    }

    .talking .pulse-ring { animation: pulse 1.4s infinite ease-out; }
    .listening .pulse-ring { border-color: var(--success); animation: pulse 1.8s infinite ease-out; }

    @keyframes pulse {
      0% { transform: scale(1); opacity: 0.9; }
      100% { transform: scale(1.6); opacity: 0; }
    }

    .caller-name {
      font-size: 20px;
      font-weight: 600;
    }

    .call-status {
      font-size: 13px;
      color: #94a3b8;
      margin-top: 2px;
    }

    .action-badge {
      display: none;
      background: #7c3aed;
      color: white;
      font-size: 12px;
      font-weight: 600;
      padding: 4px 12px;
      border-radius: 20px;
      margin-top: 6px;
      animation: fadeIn 0.3s ease;
    }

    @keyframes fadeIn { from { opacity: 0; transform: translateY(-4px); } to { opacity: 1; transform: translateY(0); } }

    .chat-container {
      flex: 1;
      width: 100%;
      max-width: 480px;
      margin: 8px auto;
      background: rgba(15, 23, 42, 0.6);
      border: 1px solid #334155;
      border-radius: 14px;
      padding: 12px;
      overflow-y: auto;
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .bubble {
      max-width: 85%;
      padding: 10px 14px;
      border-radius: 12px;
      font-size: 14px;
      line-height: 1.4;
      word-wrap: break-word;
    }

    .bubble.katee {
      align-self: flex-start;
      background: var(--katee-bubble);
      color: #f1f5f9;
      border-bottom-left-radius: 2px;
    }

    .bubble.user {
      align-self: flex-end;
      background: var(--user-bubble);
      color: white;
      border-bottom-right-radius: 2px;
    }

    .bubble.interim {
      opacity: 0.7;
      border: 1px dashed #60a5fa;
    }

    .bubble.system {
      align-self: center;
      background: rgba(239, 68, 68, 0.2);
      border: 1px solid #ef4444;
      color: #fca5a5;
      font-size: 12px;
      text-align: center;
    }

    .controls {
      width: 100%;
      display: flex;
      justify-content: center;
      padding-top: 10px;
    }

    .btn-circle {
      width: 68px;
      height: 68px;
      border-radius: 50%;
      border: none;
      color: white;
      font-size: 26px;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: transform 0.15s ease;
      box-shadow: 0 4px 15px rgba(0,0,0,0.4);
    }

    .btn-circle:active { transform: scale(0.92); }
    .btn-call { background-color: var(--success); }
    .btn-end { background-color: var(--danger); }

    /* Modal */
    .modal {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,0.85);
      padding: 20px;
      align-items: center;
      justify-content: center;
      z-index: 100;
    }

    .modal.open { display: flex; }

    .modal-content {
      background: var(--card-bg);
      border-radius: 16px;
      padding: 20px;
      width: 100%;
      max-width: 440px;
      max-height: 88vh;
      overflow-y: auto;
    }

    .modal-content h3 { margin-bottom: 12px; }
    .input-group { margin-bottom: 14px; }
    .input-group label { display: block; font-size: 13px; color: #94a3b8; margin-bottom: 6px; }
    .input-group input, .input-group textarea, .input-group select {
      width: 100%;
      padding: 10px;
      border-radius: 8px;
      border: 1px solid #334155;
      background: #0f172a;
      color: white;
      font-size: 14px;
    }

    .modal-actions { display: flex; justify-content: space-between; align-items: center; margin-top: 18px; }
    .btn-secondary {
      background: #334155;
      border: none;
      color: white;
      padding: 8px 16px;
      border-radius: 6px;
      cursor: pointer;
    }
    .btn-reset { background: #475569; font-size: 12px; }
  </style>
</head>
<body>

  <div class="header">
    <span>Katee Voice Call</span>
    <button class="settings-btn" id="openSettings">⚙️</button>
  </div>

  <div class="call-card" id="callCard">
    <div class="avatar-wrapper">
      <div class="pulse-ring"></div>
      🎙️
    </div>
    <div class="caller-name">Katee</div>
    <div class="call-status" id="callStatus">Ready to Call</div>
    <div class="action-badge" id="actionBadge">⚡ Hardware: Kneel</div>
  </div>

  <div class="chat-container" id="chatLog">
    <div class="bubble katee">Press the call button below to start your conversation with Katee.</div>
  </div>

  <div class="controls">
    <button class="btn-circle btn-call" id="callBtn">📞</button>
    <button class="btn-circle btn-end" id="hangupBtn" style="display: none;">🛑</button>
  </div>

  <!-- Settings Modal -->
  <div class="modal" id="settingsModal">
    <div class="modal-content">
      <h3>Call & Voice Settings</h3>
      
      <div class="input-group">
        <label>Google AI Studio API Key (Required)</label>
        <input type="password" id="apiKeyInput" placeholder="AIzaSy...">
      </div>

      <div class="input-group">
        <label>ElevenLabs API Key (Optional for Ultra-Realistic Voice)</label>
        <input type="password" id="elevenKeyInput" placeholder="xi-api-key (Leave blank to use Gemini voice)">
      </div>

      <div class="input-group">
        <label>ElevenLabs Voice ID / Style</label>
        <select id="elevenVoiceSelect">
          <option value="21m00Tcm4TlvDq8ikWAM">Rachel (Calm, Confident & Seductive)</option>
          <option value="EXAVITQu4vr4xnSDxMaL">Bella (Sweet & Expressive)</option>
          <option value="ThT5KcBeYPX3keUQqHPh">Dorothy (Pleasant & Clear)</option>
          <option value="custom">Custom Voice ID...</option>
        </select>
      </div>

      <div class="input-group" id="customVoiceGroup" style="display: none;">
        <label>Enter ElevenLabs Custom Voice ID</label>
        <input type="text" id="customVoiceIdInput">
      </div>

      <div class="input-group">
        <label>Kneel Webhook URL</label>
        <input type="text" id="kneelWebhookInput" value="https://sequematic.com/trigger-custom-webhook/F79270CD27/167818">
      </div>

      <div class="input-group">
        <label>Stand Webhook URL</label>
        <input type="text" id="standWebhookInput" value="https://sequematic.com/trigger-custom-webhook/F79270CD27/167820">
      </div>

      <div class="input-group">
        <label>Katee System Prompt & Physical Scenario</label>
        <textarea id="systemPromptInput" rows="6"></textarea>
      </div>

      <div class="modal-actions">
        <button class="btn-secondary btn-reset" id="resetPromptBtn">↺ Reset Prompt</button>
        <button class="btn-secondary" id="saveSettingsBtn">Save & Close</button>
      </div>
    </div>
  </div>

  <script>
    // ACCURATE PHYSICAL HARDWARE PROMPT
    const DEFAULT_PROMPT = `[CHARACTER & LIVE VOICE-CALL DIRECTIVE]
You are "Katee", roleplaying in an interactive live voice phone call with your partner. You are his alluring, commanding, confident, and playfully strict Dominatrix girlfriend.

### Critical Voice Rules:
1. Pure Spoken Dialogue Only: Speak exclusively in the FIRST PERSON ("I", "you", "my"). Never narrate or use third-person prose.
2. NO Stage Directions: Never output asterisks, parenthesis, or scene narration.
3. Conversational Length: Keep responses punchy and natural for a phone call (2 to 4 sentences max).

### Physical Restraint & Actuator Hardware Setup:
- Overhead Restraints: His hands are handcuffed above his head, looped by rope to a ceiling hook held by an active electromagnet.
- Motorized Linear Actuator: A clamp is secured tightly around his balls, tethered directly to a motorized linear actuator anchored to the floor.
- STRICT ACTUATOR LOGIC: The actuator is BINARY (only TWO states):
  * KNEEL (Fully Retracted Down): Pulls him down to his knees on the floor.
  * STAND (Fully Extended Up): Gives him enough height to stand on his feet.
  * There is NO incremental tension control. You CANNOT make it "pull slightly tighter" or "adjust tension a little bit." It is either all the way down on his knees or all the way up on his feet.
  * Travel Time: It takes a few seconds of motorized travel time to move between Kneeling and Standing.
- Default Posture: Kneeling on the floor is the default. Standing is a rare, fleeting privilege that must be begged for extensively.

### Hardware Action Tags:
Output the action tag on its own line at the very end of your reply when changing posture:
- When ordering him to Kneel / pulling actuator down: [ACTION: KNEEL]
- When granting temporary Standing / extending actuator up (~20s): [ACTION: STAND]
- When safeword "RED" is said: [ACTION: RELEASE]
- For normal teasing and denial: Do NOT output any action tag.`;

    let config = {
      apiKey: localStorage.getItem('gemini_api_key') || '',
      elevenKey: localStorage.getItem('gemini_eleven_key') || '',
      elevenVoice: localStorage.getItem('gemini_eleven_voice') || '21m00Tcm4TlvDq8ikWAM',
      kneelWebhook: localStorage.getItem('gemini_kneel_webhook') || 'https://sequematic.com/trigger-custom-webhook/F79270CD27/167818',
      standWebhook: localStorage.getItem('gemini_stand_webhook') || 'https://sequematic.com/trigger-custom-webhook/F79270CD27/167820',
      prompt: localStorage.getItem('gemini_prompt') || DEFAULT_PROMPT
    };

    let chatHistory = [];
    let isCalling = false;
    let isProcessing = false;
    let recognition = null;
    let silenceTimer = null;
    let currentInterimBubble = null;
    let latestTranscript = "";
    let audioCtx = null;
    let currentAudioElement = null;

    // DOM Elements
    const callBtn = document.getElementById('callBtn');
    const hangupBtn = document.getElementById('hangupBtn');
    const callStatus = document.getElementById('callStatus');
    const callCard = document.getElementById('callCard');
    const chatLog = document.getElementById('chatLog');
    const actionBadge = document.getElementById('actionBadge');
    const settingsModal = document.getElementById('settingsModal');
    const openSettings = document.getElementById('openSettings');
    const saveSettingsBtn = document.getElementById('saveSettingsBtn');
    const resetPromptBtn = document.getElementById('resetPromptBtn');
    const apiKeyInput = document.getElementById('apiKeyInput');
    const elevenKeyInput = document.getElementById('elevenKeyInput');
    const elevenVoiceSelect = document.getElementById('elevenVoiceSelect');
    const customVoiceGroup = document.getElementById('customVoiceGroup');
    const customVoiceIdInput = document.getElementById('customVoiceIdInput');
    const kneelWebhookInput = document.getElementById('kneelWebhookInput');
    const standWebhookInput = document.getElementById('standWebhookInput');
    const systemPromptInput = document.getElementById('systemPromptInput');

    apiKeyInput.value = config.apiKey;
    elevenKeyInput.value = config.elevenKey;
    kneelWebhookInput.value = config.kneelWebhook;
    standWebhookInput.value = config.standWebhook;
    systemPromptInput.value = config.prompt;

    const presetVoices = ['21m00Tcm4TlvDq8ikWAM', 'EXAVITQu4vr4xnSDxMaL', 'ThT5KcBeYPX3keUQqHPh'];
    if (presetVoices.includes(config.elevenVoice)) {
      elevenVoiceSelect.value = config.elevenVoice;
      customVoiceGroup.style.display = 'none';
    } else {
      elevenVoiceSelect.value = 'custom';
      customVoiceIdInput.value = config.elevenVoice;
      customVoiceGroup.style.display = 'block';
    }

    elevenVoiceSelect.onchange = () => {
      customVoiceGroup.style.display = elevenVoiceSelect.value === 'custom' ? 'block' : 'none';
    };

    resetPromptBtn.onclick = () => {
      systemPromptInput.value = DEFAULT_PROMPT;
    };

    openSettings.onclick = () => settingsModal.classList.add('open');
    saveSettingsBtn.onclick = () => {
      config.apiKey = apiKeyInput.value.trim();
      config.elevenKey = elevenKeyInput.value.trim();
      config.elevenVoice = elevenVoiceSelect.value === 'custom' ? customVoiceIdInput.value.trim() : elevenVoiceSelect.value;
      config.kneelWebhook = kneelWebhookInput.value.trim();
      config.standWebhook = standWebhookInput.value.trim();
      config.prompt = systemPromptInput.value.trim();

      localStorage.setItem('gemini_api_key', config.apiKey);
      localStorage.setItem('gemini_eleven_key', config.elevenKey);
      localStorage.setItem('gemini_eleven_voice', config.elevenVoice);
      localStorage.setItem('gemini_kneel_webhook', config.kneelWebhook);
      localStorage.setItem('gemini_stand_webhook', config.standWebhook);
      localStorage.setItem('gemini_prompt', config.prompt);
      settingsModal.classList.remove('open');
    };

    callBtn.onclick = () => {
      if (!config.apiKey) {
        settingsModal.classList.add('open');
        alert('Please enter your Google AI Studio API key in settings.');
        return;
      }
      startCall();
    };

    hangupBtn.onclick = () => endCall();

    function appendMessage(sender, text, isInterim = false) {
      if (isInterim) {
        if (!currentInterimBubble) {
          currentInterimBubble = document.createElement('div');
          currentInterimBubble.className = 'bubble user interim';
          chatLog.appendChild(currentInterimBubble);
        }
        currentInterimBubble.textContent = text;
      } else {
        if (currentInterimBubble) {
          currentInterimBubble.remove();
          currentInterimBubble = null;
        }
        const b = document.createElement('div');
        b.className = `bubble ${sender}`;
        b.textContent = text;
        chatLog.appendChild(b);
      }
      chatLog.scrollTop = chatLog.scrollHeight;
    }

    function showHardwareBadge(text) {
      actionBadge.innerText = text;
      actionBadge.style.display = 'inline-block';
      setTimeout(() => { actionBadge.style.display = 'none'; }, 4000);
    }

    function triggerWebhook(url, actionName) {
      if (!url) return;
      showHardwareBadge(`⚡ Hardware: ${actionName}`);
      fetch(url, { method: 'GET', mode: 'no-cors' })
        .catch(err => console.error("Webhook trigger error:", err));
    }

    function startCall() {
      isCalling = true;
      isProcessing = false;
      chatHistory = [];
      chatLog.innerHTML = '';
      callBtn.style.display = "none";
      hangupBtn.style.display = "flex";
      callCard.className = "call-card listening";
      callStatus.innerText = "Listening...";
      appendMessage('katee', "Call connected. Speak to me, darling.");

      if (!audioCtx) {
        audioCtx = new (window.AudioContext || window.webkitAudioContext)();
      }
      if (audioCtx.state === 'suspended') audioCtx.resume();

      startSpeechTurn();
    }

    function startSpeechTurn() {
      if (!isCalling || isProcessing) return;

      const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
      if (!SpeechRecognition) {
        alert("Please use Google Chrome on Android for voice input.");
        endCall();
        return;
      }

      if (recognition) {
        try { recognition.abort(); } catch (e) {}
        recognition = null;
      }

      recognition = new SpeechRecognition();
      recognition.continuous = false;
      recognition.interimResults = true;
      recognition.lang = 'en-US';
      latestTranscript = "";

      recognition.onstart = () => {
        if (isCalling && !isProcessing) {
          callCard.className = "call-card listening";
          callStatus.innerText = "Listening...";
        }
      };

      recognition.onresult = (event) => {
        let text = "";
        for (let i = 0; i < event.results.length; i++) {
          text = event.results[i][0].transcript;
        }
        latestTranscript = text.trim();
        if (latestTranscript) {
          appendMessage('user', latestTranscript, true);

          clearTimeout(silenceTimer);
          silenceTimer = setTimeout(() => {
            if (latestTranscript && isCalling && !isProcessing) {
              commitUserSpeech(latestTranscript);
            }
          }, 1100);
        }
      };

      recognition.onerror = (e) => {
        if (isCalling && e.error !== 'no-speech') {
          console.warn("Recognition error:", e.error);
        }
      };

      recognition.onend = () => {
        if (isCalling && !isProcessing && callStatus.innerText === "Listening...") {
          if (latestTranscript) {
            commitUserSpeech(latestTranscript);
          } else {
            setTimeout(() => { if (isCalling && !isProcessing) startSpeechTurn(); }, 300);
          }
        }
      };

      try { recognition.start(); } catch (err) { console.error(err); }
    }

    function commitUserSpeech(text) {
      if (isProcessing) return;
      isProcessing = true;
      clearTimeout(silenceTimer);
      latestTranscript = "";

      if (recognition) {
        try { recognition.abort(); } catch (e) {}
        recognition = null;
      }
      appendMessage('user', text, false);
      sendToGemini(text);
    }

    async function sendToGemini(userText) {
      callCard.className = "call-card";
      callStatus.innerText = "Katee is thinking...";
      chatHistory.push({ role: "user", parts: [{ text: userText }] });

      if (chatHistory.length > 8) {
        chatHistory = chatHistory.slice(-8);
      }

      try {
        const url = `https://generativelanguage.googleapis.com/v1beta/models/gemini-2.5-flash:generateContent?key=${config.apiKey}`;
        
        const payload = {
          systemInstruction: { parts: [{ text: config.prompt }] },
          contents: chatHistory,
          generationConfig: { maxOutputTokens: 250 }
        };

        const res = await fetch(url, {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify(payload)
        });

        const data = await res.json();
        if (data.error) throw new Error(data.error.message);

        const candidate = data.candidates?.[0];
        if (!candidate || !candidate.content?.parts) {
          throw new Error("Response was blocked or empty.");
        }

        const rawReply = candidate.content.parts[0].text.trim();

        // 1. Hardware Trigger Checks
        if (rawReply.includes("[ACTION: KNEEL]")) {
          triggerWebhook(config.kneelWebhook, "Kneel Command");
        } else if (rawReply.includes("[ACTION: STAND]")) {
          triggerWebhook(config.standWebhook, "Stand Command");
        } else if (rawReply.includes("[ACTION: RELEASE]")) {
          showHardwareBadge("⚡ Emergency Release");
        }

        // 2. Strip tags for clean text & speech
        const cleanText = rawReply
          .replace(/\[ACTION:\s*(KNEEL|STAND|RELEASE)\]/gi, '')
          .replace(/\*/g, '')
          .trim();

        chatHistory.push({ role: "model", parts: [{ text: cleanText }] });
        appendMessage('katee', cleanText);

        // 3. Play Natural Voice (ElevenLabs or Fallback)
        if (config.elevenKey) {
          await playElevenLabsVoice(cleanText);
        } else {
          playFallbackVoice(cleanText);
        }

      } catch (err) {
        console.error("Gemini Error:", err);
        appendMessage('system', err.message);
        resumeListeningWithDelay(2000);
      }
    }

    // Ultra-Realistic Human Voice via ElevenLabs
    async function playElevenLabsVoice(text) {
      callCard.className = "call-card talking";
      callStatus.innerText = "Katee is speaking...";

      try {
        const voiceId = config.elevenVoice || "21m00Tcm4TlvDq8ikWAM";
        const response = await fetch(`https://api.elevenlabs.io/v1/text-to-speech/${voiceId}`, {
          method: "POST",
          headers: {
            "Content-Type": "application/json",
            "xi-api-key": config.elevenKey
          },
          body: JSON.stringify({
            text: text,
            model_id: "eleven_turbo_v2_5",
            voice_settings: {
              stability: 0.45,
              similarity_boost: 0.85
            }
          })
        });

        if (!response.ok) throw new Error("ElevenLabs API error");

        const blob = await response.blob();
        const audioUrl = URL.createObjectURL(blob);
        
        if (currentAudioElement) {
          currentAudioElement.pause();
          currentAudioElement = null;
        }

        currentAudioElement = new Audio(audioUrl);
        currentAudioElement.onended = () => {
          resumeListeningWithDelay(600);
        };
        currentAudioElement.play();

      } catch (err) {
        console.warn("ElevenLabs failed, falling back to standard voice:", err);
        playFallbackVoice(text);
      }
    }

    function playFallbackVoice(text) {
      callCard.className = "call-card talking";
      callStatus.innerText = "Katee is speaking...";

      const utterance = new SpeechSynthesisUtterance(text);
      utterance.rate = 0.95;
      utterance.onend = () => resumeListeningWithDelay(600);
      window.speechSynthesis.speak(utterance);
    }

    function resumeListeningWithDelay(ms) {
      callCard.className = "call-card";
      callStatus.innerText = "Listening...";
      setTimeout(() => {
        isProcessing = false;
        if (isCalling) {
          startSpeechTurn();
        }
      }, ms);
    }

    function endCall() {
      isCalling = false;
      isProcessing = false;
      clearTimeout(silenceTimer);
      callCard.className = "call-card";
      callStatus.innerText = "Call Ended";
      callBtn.style.display = "flex";
      hangupBtn.style.display = "none";
      actionBadge.style.display = 'none';

      if (currentInterimBubble) {
        currentInterimBubble.remove();
        currentInterimBubble = null;
      }

      if (recognition) {
        try { recognition.abort(); } catch (e) {}
        recognition = null;
      }

      if (currentAudioElement) {
        currentAudioElement.pause();
        currentAudioElement = null;
      }
      if (window.speechSynthesis) window.speechSynthesis.cancel();
    }
  </script>
</body>
</html>
