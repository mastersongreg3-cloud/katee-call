<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Katie - Voice Call</title>
  <style>
    :root {
      --bg: #0f172a;
      --card-bg: #1e293b;
      --text: #f8fafc;
      --accent: #38bdf8;
      --danger: #ef4444;
      --warning: #f59e0b;
      --success: #22c55e;
      --user-bubble: #2563eb;
      --Katie-bubble: #334155;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }

    body {
      background: var(--bg);
      color: var(--text);
      height: 100dvh;
      display: flex;
      flex-direction: column;
      padding: 16px;
      overflow: hidden;
    }

    .header {
      width: 100%;
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding-bottom: 8px;
    }

    .settings-btn {
      background: none;
      border: none;
      color: #94a3b8;
      font-size: 24px;
      cursor: pointer;
    }

    .call-card {
      display: flex;
      flex-direction: column;
      align-items: center;
      margin: 4px 0 8px 0;
      text-align: center;
    }

    .avatar-wrapper {
      position: relative;
      width: 72px;
      height: 72px;
      border-radius: 50%;
      background: linear-gradient(135deg, #f97316, #ec4899);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 28px;
      box-shadow: 0 6px 20px rgba(0,0,0,0.5);
      margin-bottom: 6px;
    }

    .pulse-ring {
      position: absolute;
      width: 100%;
      height: 100%;
      border-radius: 50%;
      border: 2px solid var(--accent);
      opacity: 0;
      pointer-events: none;
    }

    .talking .pulse-ring { animation: pulse 1.4s infinite ease-out; }
    .listening .pulse-ring { border-color: var(--success); animation: pulse 1.8s infinite ease-out; }

    @keyframes pulse {
      0% { transform: scale(1); opacity: 0.9; }
      100% { transform: scale(1.6); opacity: 0; }
    }

    .caller-name {
      font-size: 19px;
      font-weight: 600;
    }

    .call-status {
      font-size: 13px;
      color: #94a3b8;
      margin-top: 2px;
    }

    .timer-banner {
      display: none;
      width: 100%;
      max-width: 480px;
      margin: 0 auto 8px auto;
      background: linear-gradient(135deg, #6366f1, #8b5cf6);
      color: white;
      font-size: 13px;
      font-weight: 700;
      text-align: center;
      padding: 8px 14px;
      border-radius: 10px;
      box-shadow: 0 4px 15px rgba(99, 102, 241, 0.4);
      letter-spacing: 0.3px;
      animation: bannerPulse 2s infinite ease-in-out;
    }

    .timer-banner.expired {
      background: linear-gradient(135deg, #ef4444, #dc2626);
      box-shadow: 0 4px 15px rgba(239, 68, 68, 0.5);
    }

    @keyframes bannerPulse {
      0%, 100% { transform: scale(1); }
      50% { transform: scale(1.02); }
    }

    .chat-container {
      flex: 1;
      width: 100%;
      max-width: 480px;
      margin: 0 auto;
      background: rgba(15, 23, 42, 0.6);
      border: 1px solid #334155;
      border-radius: 14px;
      padding: 12px;
      overflow-y: auto;
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .bubble {
      max-width: 85%;
      padding: 10px 14px;
      border-radius: 12px;
      font-size: 14px;
      line-height: 1.4;
      word-wrap: break-word;
    }

    .bubble.Katie {
      align-self: flex-start;
      background: var(--Katie-bubble);
      color: #f1f5f9;
      border-bottom-left-radius: 2px;
    }

    .bubble.user {
      align-self: flex-end;
      background: var(--user-bubble);
      color: white;
      border-bottom-right-radius: 2px;
    }

    .bubble.interim {
      opacity: 0.7;
      border: 1px dashed #60a5fa;
    }

    .bubble.system {
      align-self: center;
      background: rgba(239, 68, 68, 0.2);
      border: 1px solid #ef4444;
      color: #fca5a5;
      font-size: 12px;
      text-align: center;
    }

    .controls {
      width: 100%;
      display: flex;
      justify-content: center;
      gap: 20px;
      padding-top: 10px;
    }

    .btn-circle {
      width: 64px;
      height: 64px;
      border-radius: 50%;
      border: none;
      color: white;
      font-size: 24px;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: transform 0.15s ease, background-color 0.2s ease;
      box-shadow: 0 4px 15px rgba(0,0,0,0.4);
    }

    .btn-circle:active { transform: scale(0.92); }
    .btn-call { background-color: var(--success); }
    .btn-pause { background-color: var(--warning); }
    .btn-end { background-color: var(--danger); }

    /* Modal */
    .modal {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,0.85);
      padding: 20px;
      align-items: center;
      justify-content: center;
      z-index: 100;
    }

    .modal.open { display: flex; }

    .modal-content {
      background: var(--card-bg);
      border-radius: 16px;
      padding: 20px;
      width: 100%;
      max-width: 440px;
      max-height: 88vh;
      overflow-y: auto;
    }

    .modal-content h3 { margin-bottom: 12px; }
    .input-group { margin-bottom: 14px; }
    .input-group label { display: block; font-size: 13px; color: #94a3b8; margin-bottom: 6px; }
    .input-group input, .input-group textarea, .input-group select {
      width: 100%;
      padding: 10px;
      border-radius: 8px;
      border: 1px solid #334155;
      background: #0f172a;
      color: white;
      font-size: 14px;
    }

    .slider-container { display: flex; align-items: center; gap: 10px; }
    .slider-container span { font-size: 13px; min-width: 45px; font-weight: 600; color: #38bdf8; }

    .modal-actions { display: flex; justify-content: space-between; align-items: center; margin-top: 18px; }
    .btn-secondary {
      background: #334155;
      border: none;
      color: white;
      padding: 8px 16px;
      border-radius: 6px;
      cursor: pointer;
    }
    .btn-reset { background: #475569; font-size: 12px; }
  </style>
</head>

          sessionNotes: ""
        };
        saveKatieMemory();
      }
    };

    openSettings.onclick = () => {
      updateMemoryUI();
      settingsModal.classList.add('open');
    };

    saveSettingsBtn.onclick = () => {
      config.apiOrUrl = apiOrUrlInput.value.trim();
      config.kokoroUrl = kokoroUrlInput.value.trim();
      config.kokoroVoice = kokoroVoiceSelect.value;
      config.standDuration = parseInt(standDurationSlider.value) || 30;
      config.kneelWebhook = kneelWebhookInput.value.trim();
      config.standWebhook = standWebhookInput.value.trim();
      config.releaseWebhook = releaseWebhookInput.value.trim();
      config.prompt = systemPromptInput.value.trim();

      localStorage.setItem('Katie_api_url', config.apiOrUrl);
      localStorage.setItem('Katie_kokoro_url', config.kokoroUrl);
      localStorage.setItem('Katie_kokoro_voice', config.kokoroVoice);
      localStorage.setItem('Katie_stand_duration', config.standDuration);
      localStorage.setItem('Katie_kneel_webhook', config.kneelWebhook);
      localStorage.setItem('Katie_stand_webhook', config.standWebhook);
      localStorage.setItem('Katie_release_webhook', config.releaseWebhook);
      localStorage.setItem('Katie_prompt', config.prompt);

      const notesInput = document.getElementById('memoryNotesInput');
      if (notesInput) {
        KatieMemory.sessionNotes = notesInput.value.trim();
        saveKatieMemory();
      }

      settingsModal.classList.remove('open');
    };

    callBtn.onclick = () => {
      if (!config.apiOrUrl) {
        settingsModal.classList.add('open');
        alert('Please enter your LM Studio URL in settings.');
        return;
      }
      startCall();
    };

    pauseBtn.onclick = () => togglePause();
    hangupBtn.onclick = () => endCall();

    function togglePause() {
      if (!isCalling) return;
      isPaused = !isPaused;

      if (isPaused) {
        if (recognition) {
          try { recognition.abort(); } catch (e) {}
        }
        clearTimeout(silenceTimer);
        callCard.className = "call-card";
        callStatus.innerText = "⏸️ Call Paused (Mic Off)";
        pauseBtn.innerText = "▶️";
        pauseBtn.title = "Resume Call";
        pauseBtn.style.backgroundColor = "var(--success)";
      } else {
        pauseBtn.innerText = "⏸️";
        pauseBtn.title = "Pause Mic";
        pauseBtn.style.backgroundColor = "var(--warning)";
        callStatus.innerText = "Listening...";
        callCard.className = "call-card listening";
        startSpeechTurn();
      }
    }

    function appendMessage(sender, text, isInterim = false) {
      if (!text || typeof text !== 'string' || !text.trim()) return;
      
      if (isInterim) {
        if (!currentInterimBubble) {
          currentInterimBubble = document.createElement('div');
          currentInterimBubble.className = 'bubble user interim';
          chatLog.appendChild(currentInterimBubble);
        }
        currentInterimBubble.textContent = text;
      } else {
        if (currentInterimBubble) {
          currentInterimBubble.remove();
          currentInterimBubble = null;
        }
        const b = document.createElement('div');
        b.className = `bubble ${sender}`;
        b.textContent = text;
        chatLog.appendChild(b);
      }
      chatLog.scrollTop = chatLog.scrollHeight;
    }

    function triggerWebhook(url, actionName) {
      if (!url) return;
      try {
        fetch(url, { method: 'GET', mode: 'no-cors', cache: 'no-store' }).catch(() => {});
        const img = new Image();
        img.src = url + (url.includes('?') ? '&' : '?') + 't=' + Date.now();
      } catch (err) {
        console.error("Webhook trigger error:", err);
      }
    }

    function stopStandTimer() {
      if (standingAutoKneelTimer) {
        clearTimeout(standingAutoKneelTimer);
        standingAutoKneelTimer = null;
      }
      if (countdownInterval) {
        clearInterval(countdownInterval);
        countdownInterval = null;
      }
      if (pendingStandTimeout) {
        clearTimeout(pendingStandTimeout);
        pendingStandTimeout = null;
      }
    }

    function triggerStandWithTimer(chosenSeconds = 20) {
      stopStandTimer();
      triggerWebhook(config.standWebhook, "Stand Sent");
      KatieMemory.totalStands++;
      saveKatieMemory();

      const totalSeconds = Math.max(10, Math.min(30, chosenSeconds));
      let secondsLeft = totalSeconds;

      timerBanner.className = "timer-banner";
      timerBanner.style.display = "block";
      timerBanner.innerText = `⏳ Standing: ${secondsLeft}s left (Katie granted ${totalSeconds}s)`;

      countdownInterval = setInterval(() => {
        secondsLeft--;
        if (secondsLeft > 0) {
          timerBanner.innerText = `⏳ Standing: ${secondsLeft}s left (Katie granted ${totalSeconds}s)`;
        } else {
          stopStandTimer();
          triggerWebhook(config.kneelWebhook, "Auto-Kneel Triggered");
          KatieMemory.totalKneels++;
          saveKatieMemory();
          timerBanner.className = "timer-banner expired";
          timerBanner.innerText = `⚡ ${totalSeconds}s Expired: Kneel Actuator Triggered`;

          setTimeout(() => {
            if (!standingAutoKneelTimer) timerBanner.style.display = "none";
          }, 3500);
        }
      }, 1000);

      standingAutoKneelTimer = setTimeout(() => {
        stopStandTimer();
      }, totalSeconds * 1000);
    }

    function startCall() {
      isCalling = true;
      isPaused = false;
      isProcessing = false;
      chatHistory = [];
      chatLog.innerHTML = '';
      stopStandTimer();
      timerBanner.style.display = "none";
      callBtn.style.display = "none";
      pauseBtn.style.display = "flex";
      pauseBtn.innerText = "⏸️";
      pauseBtn.style.backgroundColor = "var(--warning)";
      hangupBtn.style.display = "flex";
      callCard.className = "call-card listening";
      callStatus.innerText = "Listening...";
      appendMessage('Katie', "Call connected. I'm listening, handsome.");

      startSpeechTurn();
    }

    function startSpeechTurn() {
      if (!isCalling || isPaused || isProcessing) return;

      const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
      if (!SpeechRecognition) {
        alert("Please use Google Chrome on Android for voice input.");
        endCall();
        return;
      }

      if (recognition) {
        try { recognition.abort(); } catch (e) {}
        recognition = null;
      }

      recognition = new SpeechRecognition();
      recognition.continuous = false;
      recognition.interimResults = true;
      recognition.lang = 'en-US';
      latestTranscript = "";

      recognition.onstart = () => {
        if (isCalling && !isPaused && !isProcessing) {
          callCard.className = "call-card listening";
          callStatus.innerText = "Listening...";
        }
      };

      recognition.onresult = (event) => {
        let text = "";
        for (let i = 0; i < event.results.length; i++) {
          text = event.results[i][0].transcript;
        }
        latestTranscript = text.trim();
        if (latestTranscript) {
          appendMessage('user', latestTranscript, true);

          if (latestTranscript.toUpperCase().includes("RED")) {
            stopStandTimer();
            triggerWebhook(config.releaseWebhook, "Safeword RED (Release Triggered)");
            timerBanner.className = "timer-banner expired";
            timerBanner.style.display = "block";
            timerBanner.innerText = "⚡ EMERGENCY: Electromagnet Released";
          }

          clearTimeout(silenceTimer);
          silenceTimer = setTimeout(() => {
            if (latestTranscript && isCalling && !isPaused && !isProcessing) {
              commitUserSpeech(latestTranscript);
            }
          }, 1000);
        }
      };

      recognition.onerror = (e) => {
        if (isCalling && e.error !== 'no-speech') {
          console.warn("Speech error:", e.error);
        }
      };

      recognition.onend = () => {
        if (isCalling && !isPaused && !isProcessing && callStatus.innerText === "Listening...") {
          if (latestTranscript && latestTranscript.length > 1) {
            commitUserSpeech(latestTranscript);
          } else {
            setTimeout(() => { if (isCalling && !isPaused && !isProcessing) startSpeechTurn(); }, 300);
          }
        }
      };

      try { recognition.start(); } catch (err) { console.error(err); }
    }

    function commitUserSpeech(text) {
      if (isProcessing || isPaused) return;
      isProcessing = true;
      clearTimeout(silenceTimer);
      latestTranscript = "";

      if (recognition) {
        try { recognition.abort(); } catch (e) {}
        recognition = null;
      }
      appendMessage('user', text, false);
      sendToLMStudio(text);
    }

    // --- LM STUDIO ENGINE WITH PERSISTENT MEMORY & TEMPER ---
    async function sendToLMStudio(userText) {
      callCard.className = "call-card";
      callStatus.innerText = "Katie is thinking...";
      chatHistory.push({ role: "user", content: userText });

      if (chatHistory.length > 6) chatHistory = chatHistory.slice(-6);

      try {
        let baseUrl = config.apiOrUrl.replace(/\/+$/, '');
        if (!baseUrl.includes('/v1')) baseUrl += '/v1';
        const url = `${baseUrl}/chat/completions`;

        // Inject Long-Term Memory + Real-Time Mood
        const currentMoodText = updateKatieMood(userText);
        const memoryText = getMemoryPrompt();
        
        const messages = [
          { role: "system", content: config.prompt + memoryText + currentMoodText },
          ...chatHistory
        ];

        const res = await fetch(url, {
          method: "POST",
          headers: {
            "Content-Type": "application/json",
            "ngrok-skip-browser-warning": "true"
          },
          body: JSON.stringify({
            messages: messages,
            max_tokens: 250,
            temperature: 0.65,
            stop: ["User:", "Human:", "Input:", "input your response", "\nUser:", "\nHuman:"]
          })
        });

        const data = await res.json();
        if (data.error) throw new Error(data.error.message || JSON.stringify(data.error));

        const reply = data.choices?.[0]?.message?.content || "";
        processModelReply(reply.trim(), "assistant");

      } catch (err) {
        console.error("LM Studio Error:", err);
        appendMessage('system', `LM Studio Error: ${err.message}\nEnsure LM Studio Server & Cloudflare tunnel are running.`);
        resumeListeningWithDelay(2500);
      }
    }

    // --- SMART PROCESSOR: HARDWARE EVALUATION & 2-SENTENCE ENFORCEMENT ---
    function processModelReply(rawReply, modelRole) {
      const lower = rawReply.toLowerCase();
      const isRefusal = /\b(not|won't|can't|cannot|never|no way|don't|haven't|refuse|not yet)\b/i.test(lower);
      
      const isQuestionOrTest = rawReply.includes("?") || 
        lower.includes("tell me why") || 
        lower.includes("do you think") || 
        lower.includes("if you deserve") || 
        lower.includes("why you deserve") ||
        lower.includes("deserve some time");

      // 1. Detect dynamic seconds from [ACTION: STAND:XX] or spoken dialogue
      const standMatch = rawReply.match(/\[ACTION:\s*STAND(?::\s*(\d+))?\]/i);
      let detectedSeconds = 20;

      if (standMatch && standMatch[1]) {
        detectedSeconds = parseInt(standMatch[1]);
      } else {
        const numMatch = lower.match(/\b(1[0-9]|2[0-9]|30)\s*seconds?\b/);
        if (numMatch) detectedSeconds = parseInt(numMatch[1]);
        else if (lower.includes("ten seconds")) detectedSeconds = 10;
        else if (lower.includes("fifteen seconds")) detectedSeconds = 15;
        else if (lower.includes("twenty seconds")) detectedSeconds = 20;
        else if (lower.includes("twenty-five seconds") || lower.includes("twenty five seconds")) detectedSeconds = 25;
        else if (lower.includes("thirty seconds")) detectedSeconds = 30;
      }

      let shouldStandSeconds = null;

      // 2. Hardware Trigger Evaluation
      const isKneelTrigger = /\[(?:ACTION:\s*)?(?:INSTANT\s+PUNISHMENT\s*)?KNEEL\]/i.test(rawReply) ||
        /\[INSTANT\s+PUNISHMENT\]/i.test(rawReply) ||
        /\bKNEEL\b/i.test(rawReply) ||
        lower.includes("down you go") ||
        lower.includes("back down you go") ||
        lower.includes("stay on your knees") ||
        lower.includes("back on your knees") ||
        lower.includes("patronize your mistress") ||
        lower.includes("learn your place");

      if (/\[ACTION:\s*RELEASE\]/i.test(rawReply) || lower.includes("disengage the electromagnet") || lower.includes("disengaged and you're completely free")) {
        stopStandTimer();
        triggerWebhook(config.releaseWebhook, "Electromagnet Released");
        timerBanner.className = "timer-banner expired";
        timerBanner.style.display = "block";
        timerBanner.innerText = "⚡ EMERGENCY: Electromagnet Released";
      } else if (isKneelTrigger) {
        stopStandTimer();
        triggerWebhook(config.kneelWebhook, "Hardware: Kneel Sent");
        KatieMemory.totalKneels++;
        saveKatieMemory();

        timerBanner.className = "timer-banner expired";
        timerBanner.style.display = "block";
        timerBanner.innerText = "⚡ Kneel Actuator Triggered";

        setTimeout(() => {
          if (!standingAutoKneelTimer) timerBanner.style.display = "none";
        }, 3500);

      } else if (
        KatieTemper <= 35 && 
        !isRefusal && 
        !isQuestionOrTest && 
        (
          standMatch || 
          lower.includes("extending the actuator") ||
          lower.includes("i'm granting you") ||
          lower.includes("i am granting you") ||
          lower.includes("i'll let you stand for") ||
          lower.includes("i am letting you stand for")
        )
      ) {
        shouldStandSeconds = detectedSeconds;
      }

      // 3. Clean Text for Display & Kokoro TTS
      let cleanText = rawReply
        .replace(/<think>[\s\S]*?<\/think>/gi, '')
        .replace(/\[(?:ACTION:\s*)?(?:INSTANT\s+PUNISHMENT\s*)?STAND(?::\s*\d+)?\]/gi, '')
        .replace(/\[(?:ACTION:\s*)?(?:INSTANT\s+PUNISHMENT\s*)?(KNEEL|RELEASE)\]/gi, '')
        .replace(/\[INSTANT\s+PUNISHMENT\]/gi, '')
        .replace(/\[KNEEL\]/gi, '')
        .replace(/ACTION:\s*(KNEEL|STAND|RELEASE)/gi, '')
        .replace(/^(scowls|glares|smirks|laughs|sighs|chuckles|looks|leans|steps|crosses|rolls|stares|pauses|tilts)[^.!?\n]*[.!?:\)]\s*/i, '')
        .replace(/\([^)]*\)/g, '')
        .replace(/\*[^*]*\*/g, '')
        .replace(/(User:|Human:|Input:|input your response).*$/is, '')
        .replace(/([\u2700-\u27BF]|[\uE000-\uF8FF]|\uD83C[\uDC00-\uDFFF]|\uD83D[\uDC00-\uDFFF]|[\u2011-\u26FF]|\uD83E[\uDD10-\uDDFF])/g, '')
        .trim();

      // 4. Smart 2-Sentence Slicer
      const completeSentences = cleanText.match(/[^.!?]+[.!?]+/g);
      if (completeSentences && completeSentences.length > 0) {
        cleanText = completeSentences.slice(0, 2).join(' ').trim();
      }

      if (!cleanText || cleanText.length === 0) {
        cleanText = "Stay right there on your knees, good boy, and keep your focus on me.";
      }

      chatHistory.push({ role: modelRole, content: cleanText });
      appendMessage('Katie', cleanText);
      playVoice(cleanText, shouldStandSeconds);
    }

    // --- KOKORO LOCAL VOICE OR BROWSER FALLBACK WITH TIMED ACTION ---
    async function playVoice(text, standSeconds = null) {
      callCard.className = "call-card talking";
      callStatus.innerText = "Katie is speaking...";

      if (pendingStandTimeout) {
        clearTimeout(pendingStandTimeout);
        pendingStandTimeout = null;
      }

      if (config.kokoroUrl) {
        try {
          let baseUrl = config.kokoroUrl.replace(/\/+$/, '');
          if (!baseUrl.includes('/v1')) baseUrl += '/v1';
          const ttsUrl = `${baseUrl}/audio/speech`;

          const res = await fetch(ttsUrl, {
            method: "POST",
            headers: {
              "Content-Type": "application/json",
              "ngrok-skip-browser-warning": "true"
            },
            body: JSON.stringify({
              input: text,
              voice: config.kokoroVoice || "af_bella",
              model: "kokoro",
              response_format: "mp3"
            })
          });

          if (!res.ok) throw new Error("Kokoro request failed");

          const blob = await res.blob();
          const audioUrl = URL.createObjectURL(blob);

          if (currentAudioElement) {
            currentAudioElement.pause();
            currentAudioElement = null;
          }

          currentAudioElement = new Audio(audioUrl);

          // Triggers the actuator at ~70% through her voice line
          currentAudioElement.onloadedmetadata = () => {
            if (standSeconds) {
              const dur = currentAudioElement.duration || 3;
              const triggerDelayMs = Math.max(600, (dur * 0.7) * 1000);
              
              pendingStandTimeout = setTimeout(() => {
                if (isCalling) triggerStandWithTimer(standSeconds);
              }, triggerDelayMs);
            }
          };

          currentAudioElement.onended = () => {
            resumeListeningWithDelay(600);
          };

          currentAudioElement.play();
          return;

        } catch (e) {
          console.warn("Kokoro error, using browser voice:", e);
        }
      }

      // Browser fallback voice
      if (standSeconds) {
        const estTotalMs = (text.length / 14 / 0.95) * 1000;
        const triggerDelayMs = Math.max(600, estTotalMs * 0.7);
        
        pendingStandTimeout = setTimeout(() => {
          if (isCalling) triggerStandWithTimer(standSeconds);
        }, triggerDelayMs);
      }

      const utterance = new SpeechSynthesisUtterance(text);
      utterance.rate = 0.95;
      utterance.onend = () => {
        resumeListeningWithDelay(600);
      };
      synth.speak(utterance);
    }

    function resumeListeningWithDelay(ms) {
      callCard.className = "call-card";
      if (!isPaused) callStatus.innerText = "Listening...";
      setTimeout(() => {
        isProcessing = false;
        if (isCalling && !isPaused) {
          startSpeechTurn();
        }
      }, ms);
    }

    function endCall() {
      isCalling = false;
      isPaused = false;
      isProcessing = false;
      clearTimeout(silenceTimer);
      stopStandTimer();

      // 🧠 AUTO-DEBRIEF & SAVE SESSION MEMORY
      if (chatHistory.length >= 2) {
        KatieMemory.totalSessions++;
        
        let newNote = `Session ${KatieMemory.totalSessions}: `;
        if (KatieTemper > 65) {
          newNote += `He ended the call while I was furious. Disrespect level was high; he struggled to obey and needed heavy kneeling punishments.`;
        } else if (KatieTemper <= 30) {
          newNote += `He was well-behaved, obedient on his knees, and earned rewards properly.`;
        } else {
          newNote += `He showed some resistance to begging but stayed clamped to the floor.`;
        }
        KatieMemory.sessionNotes = newNote;
        saveKatieMemory();
      }

      timerBanner.style.display = "none";
      callCard.className = "call-card";
      callStatus.innerText = "Call Ended";
      callBtn.style.display = "flex";
      pauseBtn.style.display = "none";
      hangupBtn.style.display = "none";

      if (currentInterimBubble) {
        currentInterimBubble.remove();
        currentInterimBubble = null;
      }

      if (recognition) {
        try { recognition.abort(); } catch (e) {}
        recognition = null;
      }

      if (currentAudioElement) {
        currentAudioElement.pause();
        currentAudioElement = null;
      }
      if (synth) synth.cancel();
    }
  </script>
