      --accent: #38bdf8;
      --danger: #ef4444;
      --warning: #f59e0b;

    * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }

    body {
      background: var(--bg);
      color: var(--text);
      height: 100dvh;
      display: flex;
      flex-direction: column;
      padding: 16px;
      overflow: hidden;
    }

    .header {
      width: 100%;
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding-bottom: 8px;
    }

    .settings-btn {
      background: none;
      border: none;
      color: #94a3b8;
      font-size: 24px;

      display: flex;
      flex-direction: column;
      align-items: center;
      margin: 4px 0 8px 0;
      text-align: center;
    }

    .avatar-wrapper {
      position: relative;
      width: 72px;
      height: 72px;
      border-radius: 50%;
      background: linear-gradient(135deg, #f97316, #ec4899);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 28px;
      box-shadow: 0 6px 20px rgba(0,0,0,0.5);
      margin-bottom: 6px;
    }

    .pulse-ring {
      position: absolute;
      width: 100%;
      height: 100%;
      border-radius: 50%;
      border: 2px solid var(--accent);
      opacity: 0;
      pointer-events: none;
    }

    .talking .pulse-ring { animation: pulse 1.4s infinite ease-out; }
    .listening .pulse-ring { border-color: var(--success); animation: pulse 1.8s infinite ease-out; }

    @keyframes pulse {
      0% { transform: scale(1); opacity: 0.9; }
      100% { transform: scale(1.6); opacity: 0; }

    .caller-name {
      font-size: 19px;
      font-weight: 600;
    }

    .call-status {
      font-size: 13px;
      color: #94a3b8;
      margin-top: 2px;
    }

    .timer-banner {

      width: 100%;
      max-width: 480px;
      margin: 0 auto 8px auto;
      background: linear-gradient(135deg, #6366f1, #8b5cf6);
      color: white;
      font-size: 13px;
      font-weight: 700;
      text-align: center;
      padding: 8px 14px;
      border-radius: 10px;
      box-shadow: 0 4px 15px rgba(99, 102, 241, 0.4);
      letter-spacing: 0.3px;
      animation: bannerPulse 2s infinite ease-in-out;

    .timer-banner.expired {
      background: linear-gradient(135deg, #ef4444, #dc2626);
      box-shadow: 0 4px 15px rgba(239, 68, 68, 0.5);
    }

    @keyframes bannerPulse {
      0%, 100% { transform: scale(1); }
      50% { transform: scale(1.02); }

    .chat-container {
      flex: 1;
      width: 100%;
      max-width: 480px;
      margin: 0 auto;
      background: rgba(15, 23, 42, 0.6);
      border: 1px solid #334155;
      border-radius: 14px;
      padding: 12px;
      overflow-y: auto;
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .bubble {
      max-width: 85%;
      padding: 10px 14px;
      border-radius: 12px;
      font-size: 14px;
      line-height: 1.4;
      word-wrap: break-word;
    }

    .bubble.katee {
      align-self: flex-start;
      background: var(--katee-bubble);
      color: #f1f5f9;
      border-bottom-left-radius: 2px;
    }

    .bubble.user {

      background: var(--user-bubble);
      color: white;
      border-bottom-right-radius: 2px;
    }

    .bubble.interim {

    .bubble.system {

      border: 1px solid #ef4444;
      color: #fca5a5;
      font-size: 12px;
      text-align: center;
    }

    .controls {
      width: 100%;
      display: flex;
      justify-content: center;
      gap: 20px;
      padding-top: 10px;
    }

    .btn-circle {
      width: 64px;
      height: 64px;
      border-radius: 50%;
      border: none;
      color: white;
      font-size: 24px;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;

      box-shadow: 0 4px 15px rgba(0,0,0,0.4);
    }

    .btn-circle:active { transform: scale(0.92); }

    .btn-end { background-color: var(--danger); }

    /* Modal */
    .modal {

      position: fixed;
      inset: 0;
      background: rgba(0,0,0,0.85);
      padding: 20px;
      align-items: center;
      justify-content: center;
      z-index: 100;

    .modal.open { display: flex; }

    .modal-content {

      width: 100%;

      max-height: 88vh;

    .modal-content h3 { margin-bottom: 12px; }
    .input-group { margin-bottom: 14px; }

    .input-group input, .input-group textarea, .input-group select {

      padding: 10px;
      border-radius: 8px;
      border: 1px solid #334155;
      background: #0f172a;
      color: white;
      font-size: 14px;

    .modal-actions { display: flex; justify-content: space-between; align-items: center; margin-top: 18px; }
    .btn-secondary {
      background: #334155;
      border: none;
      color: white;
      padding: 8px 16px;
      border-radius: 6px;
      cursor: pointer;
    }
    .btn-reset { background: #475569; font-size: 12px; }
  </style>
</head>

            if (standingAutoKneelTimer) {
              clearTimeout(standingAutoKneelTimer);
              standingAutoKneelTimer = null;
            }
            if (countdownInterval) {
              clearInterval(countdownInterval);
              countdownInterval = null;
            }
            triggerWebhook(config.kneelWebhook, "Disrespect Penalty: Instant Kneel");
            timerBanner.className = "timer-banner expired";
            timerBanner.style.display = "block";
            timerBanner.innerText = "⚡ Disrespect Penalty: Kneel Triggered";

            setTimeout(() => {
              if (!standingAutoKneelTimer) timerBanner.style.display = "none";
            }, 4000);
          }


          
          clearTimeout(silenceTimer);
          silenceTimer = setTimeout(() => {
            if (latestTranscript && isCalling && !isPaused && !isProcessing) {
              commitUserSpeech(latestTranscript);
            }
          }, 1000);
        }
      };

      recognition.onerror = (e) => {
        if (isCalling && e.error !== 'no-speech') {
          console.warn("Speech error:", e.error);
        }
      };

      recognition.onend = () => {
        if (isCalling && !isPaused && !isProcessing && callStatus.innerText === "Listening...") {
          if (latestTranscript && latestTranscript.length > 1) {
            commitUserSpeech(latestTranscript);
          } else {
            setTimeout(() => { if (isCalling && !isPaused && !isProcessing) startSpeechTurn(); }, 300);
          }
        }
      };

      try { recognition.start(); } catch (err) { console.error(err); }
    }

    function commitUserSpeech(text) {
      if (isProcessing || isPaused) return;
      isProcessing = true;
      clearTimeout(silenceTimer);
      latestTranscript = "";

      if (recognition) {
        try { recognition.abort(); } catch (e) {}
        recognition = null;
      }
      appendMessage('user', text, false);

      if (config.provider === 'lmstudio') {
        sendToLMStudio(text);
      } else if (config.provider === 'gemini') {
        sendToGemini(text);
      } else {
        sendToGroq(text);
      }
    }

    // --- LM STUDIO ENGINE (HARD 50 TOKEN LIMIT) ---
    async function sendToLMStudio(userText) {
      callCard.className = "call-card";
      callStatus.innerText = "Katee is thinking...";
      chatHistory.push({ role: "user", content: userText });

      if (chatHistory.length > 6) chatHistory = chatHistory.slice(-6);

      try {
        let baseUrl = config.apiOrUrl.replace(/\/+$/, '');
        if (!baseUrl.includes('/v1')) baseUrl += '/v1';
        const url = `${baseUrl}/chat/completions`;

        const messages = [
          { role: "system", content: config.prompt },
          ...chatHistory
        ];

        const res = await fetch(url, {
          method: "POST",
          headers: {
            "Content-Type": "application/json",
            "ngrok-skip-browser-warning": "true"
          },
          body: JSON.stringify({
            messages: messages,
            max_tokens: 250, // STRICT: 1 TO 2 SENTENCES ONLY
            temperature: 0.65,
            stop: ["User:", "Human:", "Input:", "input your response", "\nUser:", "\nHuman:"]
          })
        });

        const data = await res.json();
        if (data.error) throw new Error(data.error.message || JSON.stringify(data.error));

        const reply = data.choices?.[0]?.message?.content || "";
        processModelReply(reply.trim(), "assistant");

      } catch (err) {
        console.error("LM Studio Error:", err);
        appendMessage('system', `LM Studio Error: ${err.message}\nEnsure LM Studio Server & Cloudflare tunnel are running.`);
        resumeListeningWithDelay(2500);
      }
    }

    // --- GROQ API ENGINE ---
    async function sendToGroq(userText) {
      callCard.className = "call-card";
      callStatus.innerText = "Katee is thinking...";
      chatHistory.push({ role: "user", content: userText });

      if (chatHistory.length > 6) chatHistory = chatHistory.slice(-6);

      try {
        const url = "https://api.groq.com/openai/v1/chat/completions";
        const messages = [
          { role: "system", content: config.prompt },
          ...chatHistory
        ];

        const res = await fetch(url, {
          method: "POST",
          headers: {
            "Content-Type": "application/json",
            "Authorization": `Bearer ${config.apiOrUrl}`
          },
          body: JSON.stringify({
            model: "llama-3.3-70b-versatile",
            messages: messages,
            max_tokens: 250, // STRICT LIMIT
            temperature: 0.65,
            stop: ["User:", "Human:", "Input:", "input your response", "\nUser:", "\nHuman:"]
          })
        });

        const data = await res.json();
        if (data.error) throw new Error(data.error.message);

        const reply = data.choices?.[0]?.message?.content || "";
        processModelReply(reply.trim(), "assistant");

      } catch (err) {
        console.error("Groq Error:", err);
        appendMessage('system', err.message);
        resumeListeningWithDelay(2000);
      }
    }

    // --- GEMINI API ENGINE ---
    async function sendToGemini(userText) {
      callCard.className = "call-card";
      callStatus.innerText = "Katee is thinking...";
      chatHistory.push({ role: "user", parts: [{ text: userText }] });

      if (chatHistory.length > 6) chatHistory = chatHistory.slice(-6);

      try {
        const url = `https://generativelanguage.googleapis.com/v1beta/models/gemini-2.5-flash:generateContent?key=${config.apiOrUrl}`;
        const payload = {
          systemInstruction: { parts: [{ text: config.prompt }] },
          contents: chatHistory,
          generationConfig: { maxOutputTokens: 50 }
        };

        const res = await fetch(url, {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify(payload)
        });

        const data = await res.json();
        if (data.error) throw new Error(data.error.message);

        const reply = data.candidates?.[0]?.content?.parts?.[0]?.text || "";
        processModelReply(reply.trim(), "model");

      } catch (err) {
        console.error("Gemini Error:", err);
        appendMessage('system', err.message);
        resumeListeningWithDelay(2000);
      }
    }

// --- SMART PROCESSOR: STRIPS ACTIONS & FORCES 1-2 SENTENCES ---
    function processModelReply(rawReply, modelRole) {
      const lower = rawReply.toLowerCase();
      const isRefusal = /\b(not|won't|can't|cannot|never|no way|don't|haven't|refuse|not yet)\b/i.test(lower);

      // 1. Detect dynamic seconds from [ACTION: STAND:XX] or spoken dialogue
      const standMatch = rawReply.match(/\[ACTION:\s*STAND(?::\s*(\d+))?\]/i);
      let detectedSeconds = 20;

      if (standMatch && standMatch[1]) {
        detectedSeconds = parseInt(standMatch[1]);
      } else {
        const numMatch = lower.match(/\b(1[0-9]|2[0-9]|30)\s*seconds?\b/);
        if (numMatch) detectedSeconds = parseInt(numMatch[1]);
        else if (lower.includes("ten seconds")) detectedSeconds = 10;
        else if (lower.includes("fifteen seconds")) detectedSeconds = 15;
        else if (lower.includes("twenty seconds")) detectedSeconds = 20;
        else if (lower.includes("twenty-five seconds") || lower.includes("twenty five seconds")) detectedSeconds = 25;
        else if (lower.includes("thirty seconds")) detectedSeconds = 30;
      }

      // 2. Hardware Trigger Evaluation
      if (/\[ACTION:\s*RELEASE\]/i.test(rawReply) || lower.includes("disengage the electromagnet") || lower.includes("disengaged and you're completely free")) {
        triggerWebhook(config.releaseWebhook, "Electromagnet Released");
        timerBanner.className = "timer-banner expired";
        timerBanner.style.display = "block";
        timerBanner.innerText = "⚡ EMERGENCY: Electromagnet Released";
      } else if (
        standMatch || 
        (!isRefusal && (
          lower.includes("extending the actuator") ||
          lower.includes("let you stand") ||
          lower.includes("on your feet")
        ))
      ) {
        triggerStandWithTimer(detectedSeconds);
      } else if (
        /\[ACTION:\s*KNEEL\]/i.test(rawReply) ||
        lower.includes("down you go") ||
        lower.includes("back down you go") ||
        lower.includes("stay on your knees") ||
        lower.includes("call me good girl") ||
        lower.includes("patronize your mistress")
      ) {
        // Kill the standing timer immediately if running
        if (standingAutoKneelTimer) {
          clearTimeout(standingAutoKneelTimer);
          standingAutoKneelTimer = null;
        }
        if (countdownInterval) {
          clearInterval(countdownInterval);
          countdownInterval = null;
        }
        triggerWebhook(config.kneelWebhook, "Hardware: Kneel Sent");
      }

      // 3. SANITIZATION: Delete "scowls at him", parentheticals, asterisks, and tags
      let cleanText = rawReply
        .replace(/<think>[\s\S]*?<\/think>/gi, '')
        .replace(/\[ACTION:\s*STAND(?::\s*\d+)?\]/gi, '')
        .replace(/\[ACTION:\s*(KNEEL|RELEASE)\]/gi, '')
        .replace(/ACTION:\s*(KNEEL|STAND|RELEASE)/gi, '')
        .replace(/^(scowls|glares|smirks|laughs|sighs|chuckles|looks|leans|steps|crosses|rolls|stares|pauses|tilts)[^.!?\n]*[.!?:\)]\s*/i, '')
        .replace(/\([^)]*\)/g, '')
        .replace(/\*[^*]*\*/g, '')
        .replace(/(User:|Human:|Input:|input your response).*$/is, '')
        .replace(/([\u2700-\u27BF]|[\uE000-\uF8FF]|\uD83C[\uDC00-\uDFFF]|\uD83D[\uDC00-\uDFFF]|[\u2011-\u26FF]|\uD83E[\uDD10-\uDDFF])/g, '')
        .trim();

      // SMART SENTENCE TRIMMER (Guarantees exactly 1 to 2 complete sentences)
      const completeSentences = cleanText.match(/[^.!?]+[.!?]+/g);
      if (completeSentences && completeSentences.length > 0) {
        // Take ONLY the first 2 full sentences and throw away the rest
        cleanText = completeSentences.slice(0, 2).join(' ').trim();
      }

      if (!cleanText || cleanText.length === 0) {
        cleanText = "Stay right there on your knees, good boy, and keep your focus on me.";
      }

      if (config.provider === 'gemini') {
        chatHistory.push({ role: modelRole, parts: [{ text: cleanText }] });
      } else {
        chatHistory.push({ role: modelRole, content: cleanText });
      }

      appendMessage('katee', cleanText);
      playVoice(cleanText);
    }

    // --- KOKORO LOCAL VOICE OR BROWSER FALLBACK ---
    async function playVoice(text) {
      callCard.className = "call-card talking";
      callStatus.innerText = "Katee is speaking...";

      if (config.kokoroUrl) {
        try {
          let baseUrl = config.kokoroUrl.replace(/\/+$/, '');
          if (!baseUrl.includes('/v1')) baseUrl += '/v1';
          const ttsUrl = `${baseUrl}/audio/speech`;

          const res = await fetch(ttsUrl, {
            method: "POST",
            headers: {
              "Content-Type": "application/json",
              "ngrok-skip-browser-warning": "true"
            },
            body: JSON.stringify({
              input: text,
              voice: config.kokoroVoice || "af_bella",
              model: "kokoro",
              response_format: "mp3"
            })
          });

          if (!res.ok) throw new Error("Kokoro request failed");

          const blob = await res.blob();
          const audioUrl = URL.createObjectURL(blob);

          if (currentAudioElement) {
            currentAudioElement.pause();
            currentAudioElement = null;
          }

          currentAudioElement = new Audio(audioUrl);
          currentAudioElement.onended = () => {
            resumeListeningWithDelay(600);
          };
          currentAudioElement.play();
          return;

        } catch (e) {
          console.warn("Kokoro error, using browser voice:", e);
        }
      }

      // Browser fallback voice
      const utterance = new SpeechSynthesisUtterance(text);
      utterance.rate = 0.95;
      utterance.onend = () => resumeListeningWithDelay(600);
      synth.speak(utterance);
    }

    function resumeListeningWithDelay(ms) {
      callCard.className = "call-card";
      if (!isPaused) callStatus.innerText = "Listening...";
      setTimeout(() => {
        isProcessing = false;
        if (isCalling && !isPaused) {
          startSpeechTurn();
        }
      }, ms);
    }

    function endCall() {
      isCalling = false;
      isPaused = false;
      isProcessing = false;
      clearTimeout(silenceTimer);
      if (standingAutoKneelTimer) clearTimeout(standingAutoKneelTimer);
      if (countdownInterval) clearInterval(countdownInterval);
      standingAutoKneelTimer = null;
      countdownInterval = null;

      timerBanner.style.display = "none";
      callCard.className = "call-card";
      callStatus.innerText = "Call Ended";
      callBtn.style.display = "flex";
      pauseBtn.style.display = "none";
      hangupBtn.style.display = "none";

      if (currentInterimBubble) {
        currentInterimBubble.remove();
        currentInterimBubble = null;
      }

      if (recognition) {
        try { recognition.abort(); } catch (e) {}
        recognition = null;
      }

      if (currentAudioElement) {
        currentAudioElement.pause();
        currentAudioElement = null;
      }
      if (synth) synth.cancel();
    }
  </script>
