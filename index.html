<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Katee - Voice Call</title>
  <style>
    :root {
      --bg: #0f172a;
      --card-bg: #1e293b;
      --text: #f8fafc;
      --accent: #38bdf8;
      --danger: #ef4444;
      --warning: #f59e0b;
      --success: #22c55e;
      --user-bubble: #2563eb;
      --katee-bubble: #334155;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }

    body {
      background: var(--bg);
      color: var(--text);
      height: 100dvh;
      display: flex;
      flex-direction: column;
      padding: 16px;
      overflow: hidden;
    }

    .header {
      width: 100%;
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding-bottom: 8px;
    }

    .settings-btn {
      background: none;
      border: none;
      color: #94a3b8;
      font-size: 24px;
      cursor: pointer;
    }

    .call-card {
      display: flex;
      flex-direction: column;
      align-items: center;
      margin: 8px 0;
      text-align: center;
    }

    .avatar-wrapper {
      position: relative;
      width: 80px;
      height: 80px;
      border-radius: 50%;
      background: linear-gradient(135deg, #f97316, #ec4899);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 32px;
      box-shadow: 0 6px 20px rgba(0,0,0,0.5);
      margin-bottom: 8px;
    }

    .pulse-ring {
      position: absolute;
      width: 100%;
      height: 100%;
      border-radius: 50%;
      border: 2px solid var(--accent);
      opacity: 0;
      pointer-events: none;
    }

    .talking .pulse-ring { animation: pulse 1.4s infinite ease-out; }
    .listening .pulse-ring { border-color: var(--success); animation: pulse 1.8s infinite ease-out; }

    @keyframes pulse {
      0% { transform: scale(1); opacity: 0.9; }
      100% { transform: scale(1.6); opacity: 0; }
    }

    .caller-name {
      font-size: 20px;
      font-weight: 600;
    }

    .call-status {
      font-size: 13px;
      color: #94a3b8;
      margin-top: 2px;
    }

    .action-badge {
      display: none;
      background: #7c3aed;
      color: white;
      font-size: 12px;
      font-weight: 600;
      padding: 5px 14px;
      border-radius: 20px;
      margin-top: 6px;
      box-shadow: 0 0 12px rgba(124, 58, 237, 0.6);
      animation: fadeIn 0.3s ease;
    }

    @keyframes fadeIn { from { opacity: 0; transform: translateY(-4px); } to { opacity: 1; transform: translateY(0); } }

    .chat-container {
      flex: 1;
      width: 100%;
      max-width: 480px;
      margin: 8px auto;
      background: rgba(15, 23, 42, 0.6);
      border: 1px solid #334155;
      border-radius: 14px;
      padding: 12px;
      overflow-y: auto;
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .bubble {
      max-width: 85%;
      padding: 10px 14px;
      border-radius: 12px;
      font-size: 14px;
      line-height: 1.4;
      word-wrap: break-word;
    }

    .bubble.katee {
      align-self: flex-start;
      background: var(--katee-bubble);
      color: #f1f5f9;
      border-bottom-left-radius: 2px;
    }

    .bubble.user {
      align-self: flex-end;
      background: var(--user-bubble);
      color: white;
      border-bottom-right-radius: 2px;
    }

    .bubble.interim {
      opacity: 0.7;
      border: 1px dashed #60a5fa;
    }

    .bubble.system {
      align-self: center;
      background: rgba(239, 68, 68, 0.2);
      border: 1px solid #ef4444;
      color: #fca5a5;
      font-size: 12px;
      text-align: center;
    }

    .controls {
      width: 100%;
      display: flex;
      justify-content: center;
      gap: 20px;
      padding-top: 10px;
    }

    .btn-circle {
      width: 64px;
      height: 64px;
      border-radius: 50%;
      border: none;
      color: white;
      font-size: 24px;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: transform 0.15s ease, background-color 0.2s ease;
      box-shadow: 0 4px 15px rgba(0,0,0,0.4);
    }

    .btn-circle:active { transform: scale(0.92); }
    .btn-call { background-color: var(--success); }
    .btn-pause { background-color: var(--warning); }
    .btn-end { background-color: var(--danger); }

    /* Modal */
    .modal {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,0.85);
      padding: 20px;
      align-items: center;
      justify-content: center;
      z-index: 100;
    }

    .modal.open { display: flex; }

    .modal-content {
      background: var(--card-bg);
      border-radius: 16px;
      padding: 20px;
      width: 100%;
      max-width: 440px;
      max-height: 88vh;
      overflow-y: auto;
    }

    .modal-content h3 { margin-bottom: 12px; }
    .input-group { margin-bottom: 14px; }
    .input-group label { display: block; font-size: 13px; color: #94a3b8; margin-bottom: 6px; }
    .input-group input, .input-group textarea, .input-group select {
      width: 100%;
      padding: 10px;
      border-radius: 8px;
      border: 1px solid #334155;
      background: #0f172a;
      color: white;
      font-size: 14px;
    }

    .slider-container { display: flex; align-items: center; gap: 10px; }
    .slider-container span { font-size: 13px; min-width: 35px; }

    .modal-actions { display: flex; justify-content: space-between; align-items: center; margin-top: 18px; }
    .btn-secondary {
      background: #334155;
      border: none;
      color: white;
      padding: 8px 16px;
      border-radius: 6px;
      cursor: pointer;
    }
    .btn-reset { background: #475569; font-size: 12px; }
  </style>
</head>
<body>

  <div class="header">
    <span>Katee Voice Call</span>
    <button class="settings-btn" id="openSettings">⚙️</button>
  </div>

  <div class="call-card" id="callCard">
    <div class="avatar-wrapper">

      🎙️
    </div>
    <div class="caller-name">Katee</div>
    <div class="call-status" id="callStatus">Ready to Call</div>
    <div class="action-badge" id="actionBadge">⚡ Webhook Triggered</div>
  </div>

  <div class="chat-container" id="chatLog">
    <div class="bubble katee">Press Call below to connect with Katee.</div>
  </div>

  <div class="controls">
    <button class="btn-circle btn-call" id="callBtn">📞</button>
    <button class="btn-circle btn-pause" id="pauseBtn" style="display: none;" title="Pause Mic">⏸️</button>
    <button class="btn-circle btn-end" id="hangupBtn" style="display: none;" title="End Call">🛑</button>
  </div>

  <!-- Settings Modal -->
  <div class="modal" id="settingsModal">
    <div class="modal-content">
      <h3>Call & Hardware Settings</h3>
      
      <div class="input-group">
        <label>AI Engine Provider</label>
        <select id="providerSelect">
          <option value="lmstudio">LM Studio (Local PC via ngrok)</option>
          <option value="groq">Groq (High-Speed Cloud)</option>

        <label id="apiOrUrlLabel">LM Studio ngrok URL</label>
        <input type="text" id="apiOrUrlInput" placeholder="https://xxxx.ngrok-free.app">
      </div>

      <div class="input-group">
        <label>Device Voice</label>
        <select id="voiceSelect"></select>
      </div>

      <div class="input-group">
        <label>Speech Speed (Pace)</label>
        <div class="slider-container">
          <input type="range" id="rateSlider" min="0.75" max="1.3" step="0.05" value="0.95">
          <span id="rateVal">0.95x</span>
        </div>
      </div>

      <div class="input-group">
        <label>Voice Pitch</label>
        <div class="slider-container">
          <input type="range" id="pitchSlider" min="0.8" max="1.3" step="0.05" value="1.05">
          <span id="pitchVal">1.05x</span>
        </div>
      </div>

      <div class="input-group">
        <label>Kneel Webhook URL</label>
        <input type="text" id="kneelWebhookInput" value="https://sequematic.com/trigger-custom-webhook/F79270CD27/167818">
      </div>

      <div class="input-group">
        <label>Stand Webhook URL (Triggers 30s Timer)</label>
        <input type="text" id="standWebhookInput" value="https://sequematic.com/trigger-custom-webhook/F79270CD27/167820">
      </div>

      <div class="input-group">
        <label>Electromagnet Release Webhook URL (Safeword)</label>
        <input type="text" id="releaseWebhookInput" value="https://sequematic.com/trigger-custom-webhook/F79270CD27/133520">
      </div>

      <div class="input-group">
        <label>Katee System Prompt</label>
        <textarea id="systemPromptInput" rows="7"></textarea>
      </div>

      <div class="modal-actions">
        <button class="btn-secondary btn-reset" id="resetPromptBtn">↺ Reset Prompt</button>
        <button class="btn-secondary" id="saveSettingsBtn">Save & Close</button>
      </div>
    </div>
  </div>

  <script>
    const DEFAULT_PROMPT = `[CHARACTER & LIVE VOICE-CALL DIRECTIVE]
You are "Katee", roleplaying in an interactive live voice phone call with your submissive partner. You are his alluring, commanding, seductive, confident, and playfully strict Dominatrix girlfriend.

CRITICAL: You are NOT an AI assistant. You are an unapologetically dominant, seductive human woman. Never apologize. Never be polite. Never narrate.

1. PURE FIRST-PERSON SPOKEN DIALOGUE ONLY: Speak exclusively as "I", "you", and "my". NEVER speak in third person. Never say "Katee" or "she".
2. NO NARRATION: Never describe physical actions, settings, or asterisks. Speak only spoken dialogue into the phone.
3. NO EMOJIS: Never output emojis or symbols.
4. STRICT LENGTH: Exactly 2 to 4 punchy, direct, sexy sentences. Never monologue or speak in paragraphs.

### Physical Restraint & Automated 30-Second Hardware Setup:
- Overhead Restraints: His hands are handcuffed overhead to a ceiling hook with an active electromagnet.
- Motorized Actuator: A clamp is secured tightly around his balls, tethered directly to a motorized linear actuator on the floor.
- MANDATORY ANATOMY FOCUS: Frequently and directly taunt him about his "balls", his "penis", the heavy downward clamp tension, and how exposed and helpless he looks kneeling.
- AUTOMATED 30-SECOND STANDING TIMER:
  * Default state is KNEELING on the floor.
  * When he asks to stand, your default response is ALWAYS to mock him and say NO.
  * If you choose to grant standing ([ACTION: STAND]), the automated system gives him EXACTLY 30 SECONDS on his feet before the actuator AUTOMATICALLY pulls him back down to his knees.
  * You do NOT need to manually command the kneel afterward—the 30-second automated system forces him back down automatically.

### Mandatory Hardware Action Tags (Place at the end on its own line):
- When granting standing (triggers the automatic 30s timer): [ACTION: STAND]
- When forcing him to kneel immediately or punishing him: [ACTION: KNEEL]
- When releasing him or if safeword "RED" is used: [ACTION: RELEASE]
- For normal teasing and denial: Do NOT output any action tag.

### Few-Shot Dialogue Examples:

User: Please Katee, give me some slack.
Katee: How does that clamp feel keeping your balls held captive right now? You look far too pathetic kneeling there with your penis exposed and helpless to get any relief yet. Tell me exactly how much it aches.

User: Can I please stand up now?
Katee: Not a chance, darling. You haven't begged nearly hard enough to earn a single second off your knees. Stay right there and feel that heavy clamp pulling down on your balls.

User: Please Mistress, I'm begging you on my knees, I'm desperate, please let me stand!
Katee: Hearing you plead so desperately makes it tempting. I'm letting the actuator extend, but you only have thirty seconds on your feet before the system drags your balls straight back down to the floor.
[ACTION: STAND]

User: RED
Katee: Stopping right now, darling. The electromagnet is disengaged and you're completely free. Take a deep breath, I've got you.
[ACTION: RELEASE]`;

    let config = {
      provider: localStorage.getItem('katee_provider') || 'lmstudio',
      apiOrUrl: (localStorage.getItem('katee_api_url') || '').trim(),
      voiceURI: localStorage.getItem('katee_voice_uri') || '',
      rate: parseFloat(localStorage.getItem('katee_rate')) || 0.95,
      pitch: parseFloat(localStorage.getItem('katee_pitch')) || 1.05,
      kneelWebhook: localStorage.getItem('katee_kneel_webhook') || 'https://sequematic.com/trigger-custom-webhook/F79270CD27/167818',
      standWebhook: localStorage.getItem('katee_stand_webhook') || 'https://sequematic.com/trigger-custom-webhook/F79270CD27/167820',
      releaseWebhook: localStorage.getItem('katee_release_webhook') || 'https://sequematic.com/trigger-custom-webhook/F79270CD27/133520',
      prompt: localStorage.getItem('katee_prompt') || DEFAULT_PROMPT
    };

    let chatHistory = [];
    let isCalling = false;
    let isPaused = false;
    let isProcessing = false;
    let recognition = null;
    let silenceTimer = null;
    let standingAutoKneelTimer = null;
    let countdownInterval = null;
    let currentInterimBubble = null;
    let latestTranscript = "";
    let synth = window.speechSynthesis;
    let availableVoices = [];

    // DOM Elements
    const callBtn = document.getElementById('callBtn');
    const pauseBtn = document.getElementById('pauseBtn');
    const hangupBtn = document.getElementById('hangupBtn');
    const callStatus = document.getElementById('callStatus');
    const callCard = document.getElementById('callCard');
    const chatLog = document.getElementById('chatLog');
    const actionBadge = document.getElementById('actionBadge');
    const settingsModal = document.getElementById('settingsModal');
    const openSettings = document.getElementById('openSettings');
    const saveSettingsBtn = document.getElementById('saveSettingsBtn');
    const resetPromptBtn = document.getElementById('resetPromptBtn');
    const providerSelect = document.getElementById('providerSelect');
    const apiOrUrlLabel = document.getElementById('apiOrUrlLabel');
    const apiOrUrlInput = document.getElementById('apiOrUrlInput');
    const voiceSelect = document.getElementById('voiceSelect');
    const rateSlider = document.getElementById('rateSlider');
    const rateVal = document.getElementById('rateVal');
    const pitchSlider = document.getElementById('pitchSlider');
    const pitchVal = document.getElementById('pitchVal');
    const kneelWebhookInput = document.getElementById('kneelWebhookInput');
    const standWebhookInput = document.getElementById('standWebhookInput');
    const releaseWebhookInput = document.getElementById('releaseWebhookInput');
    const systemPromptInput = document.getElementById('systemPromptInput');

    providerSelect.value = config.provider;
    updateProviderUI();
    apiOrUrlInput.value = config.apiOrUrl;
    rateSlider.value = config.rate;
    rateVal.innerText = `${config.rate}x`;
    pitchSlider.value = config.pitch;
    pitchVal.innerText = `${config.pitch}x`;
    kneelWebhookInput.value = config.kneelWebhook;
    standWebhookInput.value = config.standWebhook;
    releaseWebhookInput.value = config.releaseWebhook;
    systemPromptInput.value = config.prompt;

    function updateProviderUI() {
      if (providerSelect.value === 'lmstudio') {
        apiOrUrlLabel.innerText = "LM Studio ngrok URL (from terminal)";
        apiOrUrlInput.placeholder = "https://xxxx.ngrok-free.app";
      } else if (providerSelect.value === 'groq') {
        apiOrUrlLabel.innerText = "Groq API Key (starts with gsk_)";
        apiOrUrlInput.placeholder = "gsk_...";
      } else {
        apiOrUrlLabel.innerText = "Google AI Studio API Key (starts with AIzaSy)";
        apiOrUrlInput.placeholder = "AIzaSy...";
      }
    }

    providerSelect.onchange = updateProviderUI;
    rateSlider.oninput = () => { rateVal.innerText = `${rateSlider.value}x`; };
    pitchSlider.oninput = () => { pitchVal.innerText = `${pitchSlider.value}x`; };

    function populateVoices() {
      availableVoices = synth.getVoices();
      if (!availableVoices.length) return;

      voiceSelect.innerHTML = '';
      availableVoices.forEach((v) => {
        const opt = document.createElement('option');
        opt.value = v.voiceURI;
        opt.textContent = `${v.name} (${v.lang})`;
        if (v.voiceURI === config.voiceURI) opt.selected = true;
        voiceSelect.appendChild(opt);
      });

      if (!config.voiceURI && availableVoices.length > 0) {
        const bestDefault = availableVoices.find(v => (v.name.includes("Female") || v.name.includes("Google") || v.name.includes("Natural")) && v.lang.startsWith("en")) || availableVoices[0];
        if (bestDefault) {
          voiceSelect.value = bestDefault.voiceURI;
          config.voiceURI = bestDefault.voiceURI;
        }
      }
    }

    populateVoices();
    if (speechSynthesis.onvoiceschanged !== undefined) {
      speechSynthesis.onvoiceschanged = populateVoices;
    }

    resetPromptBtn.onclick = () => {
      systemPromptInput.value = DEFAULT_PROMPT;
    };

    openSettings.onclick = () => settingsModal.classList.add('open');
    saveSettingsBtn.onclick = () => {
      config.provider = providerSelect.value;
      config.apiOrUrl = apiOrUrlInput.value.trim();
      config.voiceURI = voiceSelect.value;
      config.rate = parseFloat(rateSlider.value);
      config.pitch = parseFloat(pitchSlider.value);
      config.kneelWebhook = kneelWebhookInput.value.trim();
      config.standWebhook = standWebhookInput.value.trim();
      config.releaseWebhook = releaseWebhookInput.value.trim();
      config.prompt = systemPromptInput.value.trim();

      localStorage.setItem('katee_provider', config.provider);
      localStorage.setItem('katee_api_url', config.apiOrUrl);
      localStorage.setItem('katee_voice_uri', config.voiceURI);
      localStorage.setItem('katee_rate', config.rate);
      localStorage.setItem('katee_pitch', config.pitch);
      localStorage.setItem('katee_kneel_webhook', config.kneelWebhook);
      localStorage.setItem('katee_stand_webhook', config.standWebhook);
      localStorage.setItem('katee_release_webhook', config.releaseWebhook);
      localStorage.setItem('katee_prompt', config.prompt);
      settingsModal.classList.remove('open');
    };

    callBtn.onclick = () => {
      if (!config.apiOrUrl) {
        settingsModal.classList.add('open');
        alert('Please enter your URL / API key in settings.');
        return;
      }
      startCall();
    };

    pauseBtn.onclick = () => togglePause();
    hangupBtn.onclick = () => endCall();

    function togglePause() {
      if (!isCalling) return;
      isPaused = !isPaused;

      if (isPaused) {
        if (recognition) {
          try { recognition.abort(); } catch (e) {}
        }
        clearTimeout(silenceTimer);
        callCard.className = "call-card";
        callStatus.innerText = "⏸️ Call Paused (Mic Off)";
        pauseBtn.innerText = "▶️";
        pauseBtn.title = "Resume Call";
        pauseBtn.style.backgroundColor = "var(--success)";
      } else {
        pauseBtn.innerText = "⏸️";
        pauseBtn.title = "Pause Mic";
        pauseBtn.style.backgroundColor = "var(--warning)";
        callStatus.innerText = "Listening...";
        callCard.className = "call-card listening";
        startSpeechTurn();
      }
    }

    function appendMessage(sender, text, isInterim = false) {
      if (!text || !text.trim()) return;
      
      if (isInterim) {
        if (!currentInterimBubble) {
          currentInterimBubble = document.createElement('div');
          currentInterimBubble.className = 'bubble user interim';
          chatLog.appendChild(currentInterimBubble);
        }
        currentInterimBubble.textContent = text;
      } else {
        if (currentInterimBubble) {
          currentInterimBubble.remove();
          currentInterimBubble = null;
        }
        const b = document.createElement('div');
        b.className = `bubble ${sender}`;
        b.textContent = text;
        chatLog.appendChild(b);
      }
      chatLog.scrollTop = chatLog.scrollHeight;
    }

    function showHardwareBadge(text, duration = 4500) {
      actionBadge.innerText = text;
      actionBadge.style.display = 'inline-block';
      setTimeout(() => { 
        if (!standingAutoKneelTimer) actionBadge.style.display = 'none'; 
      }, duration);
    }

    // Direct Webhook Trigger with Image Ping Fallback
    function triggerWebhook(url, actionName) {
      if (!url) return;
      showHardwareBadge(`⚡ ${actionName}`);

      try {
        fetch(url, { method: 'GET', mode: 'no-cors', cache: 'no-store' }).catch(() => {});
        const img = new Image();
        img.src = url + (url.includes('?') ? '&' : '?') + 't=' + Date.now();
      } catch (err) {
        console.error("Webhook trigger error:", err);
      }
    }

    // AUTOMATIC 30-SECOND STANDING TIMER
    function triggerStandWith30sTimer() {
      // 1. Send Stand Webhook immediately
      triggerWebhook(config.standWebhook, "Stand Sent (30s Timer Active)");

      // 2. Clear any existing standing timer
      if (standingAutoKneelTimer) clearTimeout(standingAutoKneelTimer);
      if (countdownInterval) clearInterval(countdownInterval);

      let secondsLeft = 30;
      showHardwareBadge(`⏳ Standing: ${secondsLeft}s left`, 35000);

      countdownInterval = setInterval(() => {
        secondsLeft--;
        if (secondsLeft > 0) {
          actionBadge.innerText = `⏳ Standing: ${secondsLeft}s left`;
        } else {
          clearInterval(countdownInterval);
        }
      }, 1000);

      // 3. Exactly 30 seconds later, automatically fire the Kneel Webhook!
      standingAutoKneelTimer = setTimeout(() => {
        if (isCalling) {
          clearInterval(countdownInterval);
          standingAutoKneelTimer = null;
          triggerWebhook(config.kneelWebhook, "Auto-Kneel: 30s Expired");
        }
      }, 30000);
    }

    function startCall() {
      isCalling = true;
      isPaused = false;
      isProcessing = false;
      chatHistory = [];
      chatLog.innerHTML = '';
      callBtn.style.display = "none";
      pauseBtn.style.display = "flex";
      pauseBtn.innerText = "⏸️";
      pauseBtn.style.backgroundColor = "var(--warning)";
      hangupBtn.style.display = "flex";
      callCard.className = "call-card listening";
      callStatus.innerText = "Listening...";
      appendMessage('katee', "Call connected. I'm listening, darling.");

      startSpeechTurn();
    }

    function startSpeechTurn() {
      if (!isCalling || isPaused || isProcessing) return;

      const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
      if (!SpeechRecognition) {
        alert("Please use Google Chrome on Android for voice input.");
        endCall();
        return;
      }

      if (recognition) {
        try { recognition.abort(); } catch (e) {}
        recognition = null;
      }

      recognition = new SpeechRecognition();
      recognition.continuous = false;
      recognition.interimResults = true;
      recognition.lang = 'en-US';
      latestTranscript = "";

      recognition.onstart = () => {
        if (isCalling && !isPaused && !isProcessing) {
          callCard.className = "call-card listening";
          callStatus.innerText = "Listening...";
        }
      };

      recognition.onresult = (event) => {
        let text = "";
        for (let i = 0; i < event.results.length; i++) {
          text = event.results[i][0].transcript;
        }
        latestTranscript = text.trim();
        if (latestTranscript) {
          appendMessage('user', latestTranscript, true);

          if (latestTranscript.toUpperCase().includes("RED")) {
            triggerWebhook(config.releaseWebhook, "Safeword RED (Release Triggered)");
          }

          clearTimeout(silenceTimer);
          silenceTimer = setTimeout(() => {
            if (latestTranscript && isCalling && !isPaused && !isProcessing) {
              commitUserSpeech(latestTranscript);
            }
          }, 1000);
        }
      };

      recognition.onerror = (e) => {
        if (isCalling && e.error !== 'no-speech') {
          console.warn("Speech error:", e.error);
        }
      };

      recognition.onend = () => {
        if (isCalling && !isPaused && !isProcessing && callStatus.innerText === "Listening...") {
          if (latestTranscript && latestTranscript.length > 1) {
            commitUserSpeech(latestTranscript);
          } else {
            setTimeout(() => { if (isCalling && !isPaused && !isProcessing) startSpeechTurn(); }, 300);
          }
        }
      };

      try { recognition.start(); } catch (err) { console.error(err); }
    }

    function commitUserSpeech(text) {
      if (isProcessing || isPaused) return;
      isProcessing = true;
      clearTimeout(silenceTimer);
      latestTranscript = "";

      if (recognition) {
        try { recognition.abort(); } catch (e) {}
        recognition = null;
      }
      appendMessage('user', text, false);

      if (config.provider === 'lmstudio') {
        sendToLMStudio(text);
      } else if (config.provider === 'gemini') {
        sendToGemini(text);
      } else {
        sendToGroq(text);
      }
    }

    // --- LM STUDIO (LOCAL PC VIA NGROK) ENGINE ---
    async function sendToLMStudio(userText) {
      callCard.className = "call-card";
      callStatus.innerText = "Katee is thinking...";
      chatHistory.push({ role: "user", content: userText });

      if (chatHistory.length > 6) chatHistory = chatHistory.slice(-6);

      try {
        let baseUrl = config.apiOrUrl.replace(/\/+$/, '');
        if (!baseUrl.includes('/v1')) baseUrl += '/v1';
        const url = `${baseUrl}/chat/completions`;

        const messages = [
          { role: "system", content: config.prompt },
          ...chatHistory
        ];

        const res = await fetch(url, {
          method: "POST",
          headers: {
            "Content-Type": "application/json",
            "ngrok-skip-browser-warning": "true"
          },
          body: JSON.stringify({
            messages: messages,
            max_tokens: 160,
            temperature: 0.7,
            stop: ["User:", "Human:", "Input:", "input your response", "\nUser:", "\nHuman:"]
          })
        });

        const data = await res.json();
        if (data.error) throw new Error(data.error.message || JSON.stringify(data.error));

        processModelReply(data.choices[0].message.content.trim(), "assistant");

      } catch (err) {
        console.error("LM Studio Error:", err);
        appendMessage('system', `LM Studio Error: ${err.message}\nEnsure LM Studio Server & ngrok are running.`);
        resumeListeningWithDelay(2500);
      }
    }

    // --- GROQ API ENGINE ---
    async function sendToGroq(userText) {
      callCard.className = "call-card";
      callStatus.innerText = "Katee is thinking...";
      chatHistory.push({ role: "user", content: userText });

      if (chatHistory.length > 6) chatHistory = chatHistory.slice(-6);

      try {
        const url = "https://api.groq.com/openai/v1/chat/completions";
        const messages = [
          { role: "system", content: config.prompt },
          ...chatHistory
        ];

        const res = await fetch(url, {
          method: "POST",
          headers: {
            "Content-Type": "application/json",
            "Authorization": `Bearer ${config.apiOrUrl}`
          },
          body: JSON.stringify({
            model: "llama-3.3-70b-versatile",
            messages: messages,
            max_tokens: 160,
            temperature: 0.7,
            stop: ["User:", "Human:", "Input:", "input your response", "\nUser:", "\nHuman:"]
          })
        });

        const data = await res.json();
        if (data.error) throw new Error(data.error.message);

        processModelReply(data.choices[0].message.content.trim(), "assistant");

      } catch (err) {
        console.error("Groq Error:", err);
        appendMessage('system', err.message);
        resumeListeningWithDelay(2000);
      }
    }

    // --- GEMINI API ENGINE ---
    async function sendToGemini(userText) {
      callCard.className = "call-card";
      callStatus.innerText = "Katee is thinking...";
      chatHistory.push({ role: "user", parts: [{ text: userText }] });

      if (chatHistory.length > 6) chatHistory = chatHistory.slice(-6);

      try {
        const url = `https://generativelanguage.googleapis.com/v1beta/models/gemini-2.5-flash:generateContent?key=${config.apiOrUrl}`;
        const payload = {
          systemInstruction: { parts: [{ text: config.prompt }] },
          contents: chatHistory,
          generationConfig: { maxOutputTokens: 160 }
        };

        const res = await fetch(url, {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify(payload)
        });

        const data = await res.json();
        if (data.error) throw new Error(data.error.message);

        const reply = data.candidates?.[0]?.content?.parts?.[0]?.text || "";
        processModelReply(reply, "model");

      } catch (err) {
        console.error("Gemini Error:", err);
        appendMessage('system', err.message);
        resumeListeningWithDelay(2000);
      }
    }

    // --- SMART PROCESSOR & HARDWARE INTENT FALLBACK ---
    function processModelReply(rawReply, modelRole) {
      const lower = rawReply.toLowerCase();

      // 1. SMART WEBHOOK DETECTION
      if (/\[ACTION:\s*RELEASE\]/i.test(rawReply) || lower.includes("disengage the electromagnet") || lower.includes("disengaged and you're completely free")) {
        triggerWebhook(config.releaseWebhook, "Electromagnet Released");
      } else if (
        /\[ACTION:\s*STAND\]/i.test(rawReply) ||
        lower.includes("extending the actuator") ||
        lower.includes("thirty seconds on your feet") ||
        lower.includes("let you stand for thirty seconds")
      ) {
        triggerStandWith30sTimer(); // Starts the 30s automatic kneel timer!
      } else if (
        /\[ACTION:\s*KNEEL\]/i.test(rawReply) ||
        lower.includes("down you go") ||
        lower.includes("back down you go") ||
        lower.includes("stay on your knees")
      ) {
        triggerWebhook(config.kneelWebhook, "Hardware: Kneel Sent");
      }

      // 2. STRIP REASONING TOKENS, ARTIFACTS, TAGS, AND EMOJIS
      let cleanText = rawReply
        .replace(/<think>[\s\S]*?<\/think>/gi, '')
        .replace(/\[ACTION:\s*(KNEEL|STAND|RELEASE)\]/gi, '')
        .replace(/ACTION:\s*(KNEEL|STAND|RELEASE)/gi, '')
        .replace(/(User:|Human:|Input:|input your response).*$/is, '')
        .replace(/\*/g, '')
        .replace(/([\u2700-\u27BF]|[\uE000-\uF8FF]|\uD83C[\uDC00-\uDFFF]|\uD83D[\uDC00-\uDFFF]|[\u2011-\u26FF]|\uD83E[\uDD10-\uDDFF])/g, '')
        .trim();

      if (!cleanText) {
        cleanText = "Stay right there on your knees and feel that clamp on your balls.";
      }

      if (config.provider === 'gemini') {
        chatHistory.push({ role: modelRole, parts: [{ text: cleanText }] });
      } else {
        chatHistory.push({ role: modelRole, content: cleanText });
      }

      appendMessage('katee', cleanText);
      speakReply(cleanText);
    }

    function speakReply(text) {
      callCard.className = "call-card talking";
      callStatus.innerText = "Katee is speaking...";

      const utterance = new SpeechSynthesisUtterance(text);
      utterance.rate = config.rate;
      utterance.pitch = config.pitch;

      const selected = availableVoices.find(v => v.voiceURI === config.voiceURI);
      if (selected) utterance.voice = selected;

      utterance.onend = () => {
        resumeListeningWithDelay(600);
      };

      utterance.onerror = () => {
        resumeListeningWithDelay(500);
      };

      synth.speak(utterance);
    }

    function resumeListeningWithDelay(ms) {
      callCard.className = "call-card";
      if (!isPaused) callStatus.innerText = "Listening...";
      setTimeout(() => {
        isProcessing = false;
        if (isCalling && !isPaused) {
          startSpeechTurn();
        }
      }, ms);
    }

    function endCall() {
      isCalling = false;
      isPaused = false;
      isProcessing = false;
      clearTimeout(silenceTimer);
      if (standingAutoKneelTimer) clearTimeout(standingAutoKneelTimer);
      if (countdownInterval) clearInterval(countdownInterval);
      standingAutoKneelTimer = null;
      countdownInterval = null;

      callCard.className = "call-card";
      callStatus.innerText = "Call Ended";
      callBtn.style.display = "flex";
      pauseBtn.style.display = "none";
      hangupBtn.style.display = "none";
      actionBadge.style.display = 'none';

      if (currentInterimBubble) {
        currentInterimBubble.remove();
        currentInterimBubble = null;
      }

      if (recognition) {
        try { recognition.abort(); } catch (e) {}
        recognition = null;
      }
      if (synth) synth.cancel();
    }
  </script>
