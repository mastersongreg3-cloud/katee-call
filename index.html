<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Katee - Live Call</title>
  <style>
    :root {
      --bg: #0f172a;
      --card-bg: #1e293b;
      --text: #f8fafc;
      --accent: #38bdf8;
      --danger: #ef4444;
      --success: #22c55e;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }

    body {
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: space-between;
      padding: 24px 16px;
    }

    .header {
      width: 100%;
      max-width: 400px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .settings-btn {
      background: none;
      border: none;
      color: #94a3b8;
      font-size: 24px;
      cursor: pointer;
    }

    .call-card {
      display: flex;
      flex-direction: column;
      align-items: center;
      margin: auto 0;
      text-align: center;
    }

    .avatar-wrapper {
      position: relative;
      width: 130px;
      height: 130px;
      border-radius: 50%;
      background: linear-gradient(135deg, #6366f1, #a855f7);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 48px;
      box-shadow: 0 10px 25px rgba(0,0,0,0.5);
      margin-bottom: 20px;
    }

    .pulse-ring {
      position: absolute;
      width: 100%;
      height: 100%;
      border-radius: 50%;
      border: 2px solid var(--accent);
      opacity: 0;
      pointer-events: none;
    }

    .active .pulse-ring {
      animation: pulse 2s infinite ease-out;
    }

    @keyframes pulse {
      0% { transform: scale(1); opacity: 0.8; }
      100% { transform: scale(1.6); opacity: 0; }
    }

    .caller-name {
      font-size: 26px;
      font-weight: 600;
      margin-bottom: 6px;
    }

    .call-status {
      font-size: 15px;
      color: #94a3b8;
    }

    .error-msg {
      color: #f87171;
      font-size: 13px;
      margin-top: 12px;
      max-width: 320px;
      line-height: 1.4;
      display: none;
    }

    .controls {
      width: 100%;
      max-width: 320px;
      display: flex;
      justify-content: center;
      gap: 30px;
      margin-bottom: 20px;
    }

    .btn-circle {
      width: 72px;
      height: 72px;
      border-radius: 50%;
      border: none;
      color: white;
      font-size: 28px;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: transform 0.15s ease, background-color 0.2s ease;
      box-shadow: 0 4px 15px rgba(0,0,0,0.3);
    }

    .btn-circle:active { transform: scale(0.92); }
    .btn-call { background-color: var(--success); }
    .btn-end { background-color: var(--danger); }

    /* Modal */
    .modal {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,0.8);
      padding: 20px;
      align-items: center;
      justify-content: center;
      z-index: 10;
    }

    .modal.open { display: flex; }

    .modal-content {
      background: var(--card-bg);
      border-radius: 16px;
      padding: 20px;
      width: 100%;
      max-width: 400px;
      max-height: 85vh;
      overflow-y: auto;
    }

    .modal-content h3 { margin-bottom: 12px; }
    .input-group { margin-bottom: 14px; }
    .input-group label { display: block; font-size: 13px; color: #94a3b8; margin-bottom: 6px; }
    .input-group input, .input-group textarea, .input-group select {
      width: 100%;
      padding: 10px;
      border-radius: 8px;
      border: 1px solid #334155;
      background: #0f172a;
      color: white;
      font-size: 14px;
    }
    .modal-actions { display: flex; justify-content: flex-end; gap: 10px; }
    .btn-secondary {
      background: #334155;
      border: none;
      color: white;
      padding: 8px 16px;
      border-radius: 6px;
      cursor: pointer;
    }
  </style>
</head>
<body>

  <div class="header">
    <span>Live Voice Call</span>
    <button class="settings-btn" id="openSettings">⚙️</button>
  </div>

  <div class="call-card" id="callCard">
    <div class="avatar-wrapper">
      <div class="pulse-ring"></div>
      🎙️
    </div>
    <div class="caller-name" id="callerNameDisplay">Katee</div>
    <div class="call-status" id="callStatus">Ready to Call</div>
    <div class="error-msg" id="errorMsg"></div>
  </div>

  <div class="controls">
    <button class="btn-circle btn-call" id="callBtn">📞</button>
    <button class="btn-circle btn-end" id="hangupBtn" style="display: none;">🛑</button>
  </div>

  <!-- Settings Modal -->
  <div class="modal" id="settingsModal">
    <div class="modal-content">
      <h3>Call Settings</h3>
      <div class="input-group">
        <label>Google AI Studio API Key</label>
        <input type="password" id="apiKeyInput" placeholder="AIzaSy...">
      </div>
      <div class="input-group">
        <label>Live Model</label>
        <select id="modelSelect">
          <option value="models/gemini-2.0-flash-exp">gemini-2.0-flash-exp (Default)</option>
          <option value="models/gemini-2.0-flash">gemini-2.0-flash (Stable)</option>
        </select>
      </div>
      <div class="input-group">
        <label>Voice</label>
        <select id="voiceSelect">
          <option value="Kore">Kore (Smooth & Confident)</option>
          <option value="Aoede">Aoede (Brisk & Clear)</option>
          <option value="Fenrir">Fenrir (Deeper Tone)</option>
          <option value="Puck">Puck (Playful)</option>
          <option value="Charon">Charon (Calm & Low)</option>
        </select>
      </div>
      <div class="input-group">
        <label>Persona / System Prompt</label>
        <textarea id="systemPromptInput" rows="6"></textarea>
      </div>
      <div class="modal-actions">
        <button class="btn-secondary" id="saveSettingsBtn">Save & Close</button>
      </div>
    </div>
  </div>

  <script>
    const DEFAULT_PROMPT = `Adopt the persona of "Katee", a commanding, confident, and playfully strict partner on an interactive live voice phone call.
RULES:
- Pure spoken dialogue only ("I", "you", "my").
- NEVER use asterisks, narration, or stage directions.
- Keep all responses sharp, punchy, and conversational (2-4 sentences max).
- If the user uses the safeword "RED" or speaks out-of-character to stop, immediately break character, end the dynamic, and check in with warmth and care.`;

    let config = {
      apiKey: localStorage.getItem('gemini_api_key') || '',
      model: localStorage.getItem('gemini_model') || 'models/gemini-2.0-flash-exp',
      voice: localStorage.getItem('gemini_voice') || 'Kore',
      prompt: localStorage.getItem('gemini_prompt') || DEFAULT_PROMPT
    };

    let ws = null;
    let audioCtx = null;
    let inputAudioStream = null;
    let scriptProcessor = null;
    let isCalling = false;
    let nextAudioStartTime = 0;
    let activeAudioNodes = [];

    const callBtn = document.getElementById('callBtn');
    const hangupBtn = document.getElementById('hangupBtn');
    const callStatus = document.getElementById('callStatus');
    const callCard = document.getElementById('callCard');
    const errorMsg = document.getElementById('errorMsg');
    const settingsModal = document.getElementById('settingsModal');
    const openSettings = document.getElementById('openSettings');
    const saveSettingsBtn = document.getElementById('saveSettingsBtn');
    const apiKeyInput = document.getElementById('apiKeyInput');
    const modelSelect = document.getElementById('modelSelect');
    const voiceSelect = document.getElementById('voiceSelect');
    const systemPromptInput = document.getElementById('systemPromptInput');

    apiKeyInput.value = config.apiKey;
    modelSelect.value = config.model;
    voiceSelect.value = config.voice;
    systemPromptInput.value = config.prompt;

    openSettings.onclick = () => settingsModal.classList.add('open');
    saveSettingsBtn.onclick = () => {
      config.apiKey = apiKeyInput.value.trim();
      config.model = modelSelect.value;
      config.voice = voiceSelect.value;
      config.prompt = systemPromptInput.value.trim();
      localStorage.setItem('gemini_api_key', config.apiKey);
      localStorage.setItem('gemini_model', config.model);
      localStorage.setItem('gemini_voice', config.voice);
      localStorage.setItem('gemini_prompt', config.prompt);
      settingsModal.classList.remove('open');
      hideError();
    };

    function showError(text) {
      errorMsg.innerText = text;
      errorMsg.style.display = 'block';
    }

    function hideError() {
      errorMsg.innerText = '';
      errorMsg.style.display = 'none';
    }

    callBtn.onclick = async () => {
      hideError();
      if (!config.apiKey) {
        settingsModal.classList.add('open');
        showError('Please enter your Google AI Studio API Key.');
        return;
      }
      startCall();
    };

    hangupBtn.onclick = () => endCall();

    async function startCall() {
      callStatus.innerText = "Connecting...";
      callBtn.style.display = "none";
      hangupBtn.style.display = "flex";

      try {
        audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        if (audioCtx.state === 'suspended') await audioCtx.resume();
        nextAudioStartTime = audioCtx.currentTime;

        inputAudioStream = await navigator.mediaDevices.getUserMedia({
          audio: { echoCancellation: true, noiseSuppression: true, autoGainControl: true }
        });

        // Use v1alpha for experimental Live WebSocket support
        const host = "generativelanguage.googleapis.com";
        const path = "ws/google.ai.generativelanguage.v1alpha.GenerativeService.BidiGenerateContent";
        const url = `wss://${host}/${path}?key=${config.apiKey}`;
        
        ws = new WebSocket(url);

        ws.onopen = () => {
          callStatus.innerText = "Connected";
          callCard.classList.add('active');
          isCalling = true;
          sendSetupMessage();
          startAudioStreaming();
        };

        ws.onmessage = async (event) => {
          let data = event.data;
          if (data instanceof Blob) data = await data.text();
          try {
            const response = JSON.parse(data);
            handleServerMessage(response);
          } catch (e) {
            console.error("JSON Error:", e);
          }
        };

        ws.onclose = (e) => {
          console.warn("WebSocket Closed:", e);
          if (e.code === 1008) {
            showError("Error 1008: Policy Violation. Check if your API key is Unrestricted or try selecting a different Model in settings.");
          } else if (e.code !== 1000 && isCalling) {
            showError(`Connection closed (Code ${e.code}).`);
          }
          endCall();
        };

        ws.onerror = (err) => {
          console.error("WebSocket Error:", err);
          showError("WebSocket failed. Check API key & network.");
          endCall();
        };

      } catch (err) {
        console.error("Call init error:", err);
        showError(`Microphone Error: ${err.message || err.name}`);
        endCall();
      }
    }

    function sendSetupMessage() {
      const setupMsg = {
        setup: {
          model: config.model,
          generationConfig: {
            responseModalities: ["AUDIO"],
            speechConfig: {
              voiceConfig: {
                prebuiltVoiceConfig: {
                  voiceName: config.voice
                }
              }
            }
          },
          systemInstruction: {
            parts: [{ text: config.prompt }]
          }
        }
      };
      ws.send(JSON.stringify(setupMsg));
    }

    function startAudioStreaming() {
      const micSource = audioCtx.createMediaStreamSource(inputAudioStream);
      const bufferSize = 4096;
      scriptProcessor = audioCtx.createScriptProcessor(bufferSize, 1, 1);

      micSource.connect(scriptProcessor);
      scriptProcessor.connect(audioCtx.destination);

      scriptProcessor.onaudioprocess = (e) => {
        if (!isCalling || ws.readyState !== WebSocket.OPEN) return;
        const inputData = e.inputBuffer.getChannelData(0);
        const downsampledPCM = downsampleTo16kPCM(inputData, audioCtx.sampleRate);
        if (downsampledPCM.byteLength === 0) return;

        const base64Audio = arrayBufferToBase64(downsampledPCM.buffer);
        const audioMsg = {
          realtimeInput: {
            mediaChunks: [
              { mimeType: "audio/pcm;rate=16000", data: base64Audio }
            ]
          }
        };
        ws.send(JSON.stringify(audioMsg));
      };
    }

    function downsampleTo16kPCM(inputBuffer, inputRate) {
      if (inputRate === 16000) {
        const pcm16 = new Int16Array(inputBuffer.length);
        for (let i = 0; i < inputBuffer.length; i++) {
          const s = Math.max(-1, Math.min(1, inputBuffer[i]));
          pcm16[i] = s < 0 ? s * 0x8000 : s * 0x7FFF;
        }
        return pcm16;
      }

      const ratio = inputRate / 16000;
      const newLength = Math.round(inputBuffer.length / ratio);
      const result = new Int16Array(newLength);
      let offsetResult = 0;
      let offsetBuffer = 0;

      while (offsetResult < result.length) {
        const nextOffsetBuffer = Math.round((offsetResult + 1) * ratio);
        let accum = 0, count = 0;
        for (let i = offsetBuffer; i < nextOffsetBuffer && i < inputBuffer.length; i++) {
          accum += inputBuffer[i];
          count++;
        }
        const avg = count > 0 ? accum / count : 0;
        const s = Math.max(-1, Math.min(1, avg));
        result[offsetResult] = s < 0 ? s * 0x8000 : s * 0x7FFF;
        offsetResult++;
        offsetBuffer = nextOffsetBuffer;
      }
      return result;
    }

    function handleServerMessage(msg) {
      if (msg.serverContent && msg.serverContent.interrupted) {
        stopAllActiveAudio();
        nextAudioStartTime = audioCtx.currentTime;
        return;
      }

      if (msg.serverContent && msg.serverContent.modelTurn) {
        const parts = msg.serverContent.modelTurn.parts;
        for (const part of parts) {
          if (part.inlineData && part.inlineData.data) {
            playAudioChunk(base64ToArrayBuffer(part.inlineData.data));
          }
        }
      }
    }

    function playAudioChunk(arrayBuffer) {
      const pcm16 = new Int16Array(arrayBuffer);
      const float32 = new Float32Array(pcm16.length);
      for (let i = 0; i < pcm16.length; i++) {
        float32[i] = pcm16[i] / 32768.0;
      }

      const audioBuffer = audioCtx.createBuffer(1, float32.length, 24000);
      audioBuffer.copyToChannel(float32, 0);

      const source = audioCtx.createBufferSource();
      source.buffer = audioBuffer;
      source.connect(audioCtx.destination);

      const startTime = Math.max(audioCtx.currentTime, nextAudioStartTime);
      source.start(startTime);
      nextAudioStartTime = startTime + audioBuffer.duration;

      activeAudioNodes.push(source);
      source.onended = () => {
        activeAudioNodes = activeAudioNodes.filter(n => n !== source);
      };
    }

    function stopAllActiveAudio() {
      activeAudioNodes.forEach(node => {
        try { node.stop(); } catch (e) {}
      });
      activeAudioNodes = [];
    }

    function endCall() {
      isCalling = false;
      callCard.classList.remove('active');
      callStatus.innerText = "Call Ended";
      callBtn.style.display = "flex";
      hangupBtn.style.display = "none";

      stopAllActiveAudio();

      if (scriptProcessor) { scriptProcessor.disconnect(); scriptProcessor = null; }
      if (inputAudioStream) { inputAudioStream.getTracks().forEach(t => t.stop()); }
      if (ws && ws.readyState === WebSocket.OPEN) { ws.close(); }
      if (audioCtx && audioCtx.state !== 'closed') { audioCtx.close(); }
    }

    function arrayBufferToBase64(buffer) {
      let binary = '';
      const bytes = new Uint8Array(buffer);
      for (let i = 0; i < bytes.byteLength; i++) {
        binary += String.fromCharCode(bytes[i]);
      }
      return window.btoa(binary);
    }

    function base64ToArrayBuffer(base64) {
      const binaryString = window.atob(base64);
      const bytes = new Uint8Array(binaryString.length);
      for (let i = 0; i < binaryString.length; i++) {
        bytes[i] = binaryString.charCodeAt(i);
      }
      return bytes.buffer;
    }
  </script>
</body>
</html>
