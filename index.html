<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Katee - Voice Call</title>
  <style>
    :root {
      --bg: #0f172a;
      --card-bg: #1e293b;
      --text: #f8fafc;
      --accent: #38bdf8;
      --danger: #ef4444;
      --success: #22c55e;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }

    body {
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: space-between;
      padding: 24px 16px;
    }

    .header {
      width: 100%;
      max-width: 400px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .settings-btn {
      background: none;
      border: none;
      color: #94a3b8;
      font-size: 24px;
      cursor: pointer;
    }

    .call-card {
      display: flex;
      flex-direction: column;
      align-items: center;
      margin: auto 0;
      text-align: center;
    }

    .avatar-wrapper {
      position: relative;
      width: 130px;
      height: 130px;
      border-radius: 50%;
      background: linear-gradient(135deg, #6366f1, #a855f7);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 48px;
      box-shadow: 0 10px 25px rgba(0,0,0,0.5);
      margin-bottom: 20px;
    }

    .pulse-ring {
      position: absolute;
      width: 100%;
      height: 100%;
      border-radius: 50%;
      border: 2px solid var(--accent);
      opacity: 0;
      pointer-events: none;
    }

    .talking .pulse-ring {
      animation: pulse 1.5s infinite ease-out;
    }

    @keyframes pulse {
      0% { transform: scale(1); opacity: 0.9; }
      100% { transform: scale(1.6); opacity: 0; }
    }

    .caller-name {
      font-size: 26px;
      font-weight: 600;
      margin-bottom: 6px;
    }

    .call-status {
      font-size: 15px;
      color: #94a3b8;
    }

    .transcript {
      margin-top: 15px;
      font-size: 13px;
      color: #cbd5e1;
      max-width: 320px;
      min-height: 40px;
      font-style: italic;
    }

    .error-msg {
      color: #f87171;
      font-size: 13px;
      margin-top: 10px;
      max-width: 320px;
      display: none;
    }

    .controls {
      width: 100%;
      max-width: 320px;
      display: flex;
      justify-content: center;
      gap: 30px;
      margin-bottom: 20px;
    }

    .btn-circle {
      width: 72px;
      height: 72px;
      border-radius: 50%;
      border: none;
      color: white;
      font-size: 28px;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: transform 0.15s ease;
      box-shadow: 0 4px 15px rgba(0,0,0,0.3);
    }

    .btn-circle:active { transform: scale(0.92); }
    .btn-call { background-color: var(--success); }
    .btn-end { background-color: var(--danger); }

    /* Modal */
    .modal {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,0.8);
      padding: 20px;
      align-items: center;
      justify-content: center;
      z-index: 10;
    }

    .modal.open { display: flex; }

    .modal-content {
      background: var(--card-bg);
      border-radius: 16px;
      padding: 20px;
      width: 100%;
      max-width: 400px;
      max-height: 85vh;
      overflow-y: auto;
    }

    .modal-content h3 { margin-bottom: 12px; }
    .input-group { margin-bottom: 14px; }
    .input-group label { display: block; font-size: 13px; color: #94a3b8; margin-bottom: 6px; }
    .input-group input, .input-group textarea {
      width: 100%;
      padding: 10px;
      border-radius: 8px;
      border: 1px solid #334155;
      background: #0f172a;
      color: white;
      font-size: 14px;
    }
    .modal-actions { display: flex; justify-content: flex-end; gap: 10px; }
    .btn-secondary {
      background: #334155;
      border: none;
      color: white;
      padding: 8px 16px;
      border-radius: 6px;
      cursor: pointer;
    }
  </style>
</head>
<body>

  <div class="header">
    <span>Voice Call (Free Mode)</span>
    <button class="settings-btn" id="openSettings">⚙️</button>
  </div>

  <div class="call-card" id="callCard">
    <div class="avatar-wrapper">
      <div class="pulse-ring"></div>
      🎙️
    </div>
    <div class="caller-name">Katee</div>
    <div class="call-status" id="callStatus">Ready to Call</div>
    <div class="transcript" id="transcript"></div>
    <div class="error-msg" id="errorMsg"></div>
  </div>

  <div class="controls">
    <button class="btn-circle btn-call" id="callBtn">📞</button>
    <button class="btn-circle btn-end" id="hangupBtn" style="display: none;">🛑</button>
  </div>

  <div class="modal" id="settingsModal">
    <div class="modal-content">
      <h3>Call Settings</h3>
      <div class="input-group">
        <label>Google AI Studio API Key</label>
        <input type="password" id="apiKeyInput" placeholder="AIzaSy...">
      </div>
      <div class="input-group">
        <label>Persona / System Prompt</label>
        <textarea id="systemPromptInput" rows="6"></textarea>
      </div>
      <div class="modal-actions">
        <button class="btn-secondary" id="saveSettingsBtn">Save & Close</button>
      </div>
    </div>
  </div>

  <script>
    const DEFAULT_PROMPT = `Adopt the persona of "Katee", a commanding, confident, and playfully strict partner on an interactive live voice phone call.
RULES:
- Pure spoken dialogue only ("I", "you", "my").
- NEVER use asterisks, narration, or stage directions.
- Keep all responses sharp, punchy, and conversational (2-4 sentences max).
- If the user uses the safeword "RED" or speaks out-of-character to stop, immediately break character, end the dynamic, and check in with warmth and care.`;

    let config = {
      apiKey: localStorage.getItem('gemini_api_key') || '',
      prompt: localStorage.getItem('gemini_prompt') || DEFAULT_PROMPT
    };

    let chatHistory = [];
    let isCalling = false;
    let recognition = null;
    let synth = window.speechSynthesis;

    const callBtn = document.getElementById('callBtn');
    const hangupBtn = document.getElementById('hangupBtn');
    const callStatus = document.getElementById('callStatus');
    const callCard = document.getElementById('callCard');
    const transcript = document.getElementById('transcript');
    const errorMsg = document.getElementById('errorMsg');
    const settingsModal = document.getElementById('settingsModal');
    const openSettings = document.getElementById('openSettings');
    const saveSettingsBtn = document.getElementById('saveSettingsBtn');
    const apiKeyInput = document.getElementById('apiKeyInput');
    const systemPromptInput = document.getElementById('systemPromptInput');

    apiKeyInput.value = config.apiKey;
    systemPromptInput.value = config.prompt;

    openSettings.onclick = () => settingsModal.classList.add('open');
    saveSettingsBtn.onclick = () => {
      config.apiKey = apiKeyInput.value.trim();
      config.prompt = systemPromptInput.value.trim();
      localStorage.setItem('gemini_api_key', config.apiKey);
      localStorage.setItem('gemini_prompt', config.prompt);
      settingsModal.classList.remove('open');
    };

    callBtn.onclick = () => {
      if (!config.apiKey) {
        settingsModal.classList.add('open');
        alert('Please enter your Google AI Studio API key in settings.');
        return;
      }
      startCall();
    };

    hangupBtn.onclick = () => endCall();

    function startCall() {
      isCalling = true;
      chatHistory = [];
      callBtn.style.display = "none";
      hangupBtn.style.display = "flex";
      callStatus.innerText = "Listening...";
      transcript.innerText = "";
      errorMsg.style.display = "none";

      setupSpeechRecognition();
    }

    function setupSpeechRecognition() {
      const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
      if (!SpeechRecognition) {
        alert("Your browser does not support Speech Recognition. Please use Chrome on Android.");
        endCall();
        return;
      }

      recognition = new SpeechRecognition();
      recognition.continuous = false;
      recognition.interimResults = false;
      recognition.lang = 'en-US';

      recognition.onstart = () => {
        if (isCalling) callStatus.innerText = "Listening...";
      };

      recognition.onresult = async (event) => {
        const userText = event.results[0][0].transcript;
        transcript.innerText = `You: "${userText}"`;
        await sendToGemini(userText);
      };

      recognition.onerror = (e) => {
        if (isCalling && e.error !== 'no-speech') {
          console.warn("Speech error:", e.error);
        }
      };

      recognition.onend = () => {
        // Keep listening if call is still active and Katee is not speaking
        if (isCalling && !synth.speaking) {
          try { recognition.start(); } catch (err) {}
        }
      };

      try {
        recognition.start();
      } catch (err) {
        console.error("Recognition start failed:", err);
      }
    }

    async function sendToGemini(userText) {
      callStatus.innerText = "Katee is thinking...";
      chatHistory.push({ role: "user", parts: [{ text: userText }] });

      try {
        const url = `https://generativelanguage.googleapis.com/v1beta/models/gemini-2.0-flash:generateContent?key=${config.apiKey}`;
        
        const payload = {
          system_instruction: { parts: [{ text: config.prompt }] },
          contents: chatHistory,
          generationConfig: { maxOutputTokens: 250 }
        };

        const res = await fetch(url, {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify(payload)
        });

        const data = await res.json();
        if (data.error) throw new Error(data.error.message);

        const reply = data.candidates[0].content.parts[0].text;
        chatHistory.push({ role: "model", parts: [{ text: reply }] });

        speakReply(reply);

      } catch (err) {
        console.error("Gemini Error:", err);
        errorMsg.innerText = `Error: ${err.message}`;
        errorMsg.style.display = "block";
        callStatus.innerText = "Error. Resuming mic...";
        if (isCalling) recognition.start();
      }
    }

    function speakReply(text) {
      callStatus.innerText = "Katee is speaking...";
      callCard.classList.add("talking");
      transcript.innerText = `Katee: "${text}"`;

      const utterance = new SpeechSynthesisUtterance(text);
      utterance.rate = 1.0;
      utterance.pitch = 1.05;

      // Pick the best available female voice on device
      const voices = synth.getVoices();
      const preferredVoice = voices.find(v => v.name.includes("Female") || v.name.includes("Google") || v.name.includes("Natural"));
      if (preferredVoice) utterance.voice = preferredVoice;

      utterance.onend = () => {
        callCard.classList.remove("talking");
        callStatus.innerText = "Listening...";
        if (isCalling) {
          try { recognition.start(); } catch (err) {}
        }
      };

      synth.speak(utterance);
    }

    function endCall() {
      isCalling = false;
      callCard.classList.remove("talking");
      callStatus.innerText = "Call Ended";
      callBtn.style.display = "flex";
      hangupBtn.style.display = "none";

      if (recognition) {
        recognition.abort();
        recognition = null;
      }
      if (synth) synth.cancel();
    }
  </script>
</body>
</html>
