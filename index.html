    // --- HARDWARE WEBHOOK DISPATCHER ---
    function sendWebhook(url) {
      if (!url) return;
      console.log("EXEC HARDWARE: " + url);
      try {
        fetch(url, { method: 'GET', mode: 'no-cors', cache: 'no-store' }).catch(() => {});
        const img = new Image(); img.src = url + (url.includes('?') ? '&' : '?') + 't=' + Date.now();
      } catch (err) {}
    }

    function updateLight(id, label, active, pulse = false, cooldown = false) {
      const el = document.getElementById(id);
      if (!el) return;
      el.innerText = label;
      active ? el.classList.add('active') : el.classList.remove('active');
      pulse ? el.classList.add('pulse') : el.classList.remove('pulse');
      cooldown ? el.classList.add('cooldown') : el.classList.remove('cooldown');
    }

    // --- TIMING & 10-SECOND SILENCE PENALTY ---
    function stopAllVibeTimers() {
      if (vibeCycleTimeout) { clearTimeout(vibeCycleTimeout); vibeCycleTimeout = null; }
      if (vibeAutoOffTimer) { clearTimeout(vibeAutoOffTimer); vibeAutoOffTimer = null; }
    }

// Safety alias to prevent any missing function errors
    function triggerVibratorBurst() {
      runVibratorAutoCycle();
    }

    
    function runVibratorAutoCycle() {
      stopAllVibeTimers();
      if (!isCalling || isPaused || !isVibeCycleRunning) return;

      const burstDurationSec = Math.floor(Math.random() * 3) + 4; // 4 to 6 seconds
      sendWebhook(config.vibeOnWebhook);
      updateLight("light-vibe", `⚡ VIBE: ON (${burstDurationSec}s)`, true);
      kateeMemory.totalVibes = (kateeMemory.totalVibes || 0) + 1;
      saveKateeMemory();

      vibeCycleTimeout = setTimeout(() => {
        if (!isCalling || isPaused || !isVibeCycleRunning) return;

        sendWebhook(config.vibeOffWebhook);
        updateLight("light-vibe", "⏳ VIBE: REST (9s)", false, false, true);

        let restRemaining = 9;
        const restInterval = setInterval(() => {
          restRemaining--;
          if (restRemaining > 0 && isVibeCycleRunning) {
            updateLight("light-vibe", `⏳ VIBE: REST (${restRemaining}s)`, false, false, true);
          } else {
            clearInterval(restInterval);
          }
        }, 1000);

        vibeCycleTimeout = setTimeout(() => {
          if (isCalling && !isPaused && isVibeCycleRunning) {
            runVibratorAutoCycle();
          }
        }, 9000);

      }, burstDurationSec * 1000);
    }

    function startMasterSilenceTimer() {
      if (silenceMasterTimer) clearTimeout(silenceMasterTimer);
      if (!isCalling || isPaused || isProcessing) return;

      silenceMasterTimer = setTimeout(() => {
        if (isCalling && !isPaused && !isProcessing) {
          silenceMasterTimer = null;
          
          if (recognition) {
            try { recognition.abort(); } catch(e) {}
          }

          if (!isSlapperActive) {
            sendWebhook(config.slapOnWebhook);
            isSlapperActive = true;
            updateLight("light-slap", "Slapping Balls (Silence Penalty)...", true, true);
            kateeMemory.totalSlaps = (kateeMemory.totalSlaps || 0) + 1;
            saveKateeMemory();
          }

          appendMessage('user', '(stayed silent for 10 seconds...)', false);
          executeTurn('(The user stayed completely silent on the bed for 10 seconds, refusing to speak or answer you. Turn on the slapper with [SLAP_ON] to punish his silence and scold him.)');
        }
      }, 10000);
    }

function parseHardwareActions(raw) {
      const lower = raw.toLowerCase();
      const elapsedMinutes = callStartTime ? Math.floor((Date.now() - callStartTime) / 60000) : 0;
      const isNegated = /\b(not|won't|wont|never|refuse|why would i|don't think|no way)\b/i.test(lower);

      // Inlined refusal check - directly defined as a variable!
      const isSlapRefusal = /\b(not\s+(going\s+to\s+|gonna\s+)?stop|won't\s+stop|wont\s+stop|never\s+stop|refuse\s+to\s+stop|keep\s+slapping|think\s+again|not\s+that\s+easy|not\s+a\s+chance|take\s+every\s+(single\s+)?hit)\b/i.test(lower);

      // 1. [UNTIE] / RELEASE / Safeword RED
      if (/\[?UNTIE\]?/i.test(raw) || /\[?ACTION:\s*RELEASE\]?/i.test(raw) || lower.includes("disengage the electromagnet")) {
        if (!isNegated && (elapsedMinutes >= 15 || lower.includes("safeword") || lower.includes("red"))) {
          sendWebhook(config.releaseWebhook);
          sendWebhook(config.slapOffWebhook);
          sendWebhook(config.vibeOffWebhook);
          isSlapperActive = false;
          stopAllVibeTimers();
          updateLight("light-restraints", "Restraints: RELEASED", false);
          updateLight("light-slap", "Ball-Slapper: IDLE", false, false);
          updateLight("light-vibe", "Vibrator: OFF", false, false, false);
        }
      }

      // 2. BALL-SLAPPER OFF
      const wantsSlapOff = /\[?SLAP[_\s-]?OFF:?\]?/i.test(raw) || 
        (!isNegated && (lower.includes("stop slapping") || lower.includes("turn off the slapper") || lower.includes("break from me slapping")));

      if (wantsSlapOff && !isSlapRefusal) {
        if (isSlapperActive) {
          sendWebhook(config.slapOffWebhook);
          isSlapperActive = false;
          updateLight("light-slap", "Ball-Slapper: IDLE", false, false);
        }
      } 
      // 3. BALL-SLAPPER ON
      else if (/\[?SLAP[_\s-]?ON:?\]?/i.test(raw) || (!isSlapRefusal && (lower.includes("slapper on") || lower.includes("turn on the slapper") || lower.includes("start slapping") || lower.includes("slap your balls")))) {
        if (!isSlapperActive) {
          sendWebhook(config.slapOnWebhook);
          isSlapperActive = true;
          updateLight("light-slap", "Slapping Balls...", true, true);
          kateeMemory.totalSlaps = (kateeMemory.totalSlaps || 0) + 1;
          saveKateeMemory();
        }
      }

// 4. VIBRATOR RESUME / ON
      if (!isNegated && (/\[?VIBE[_\s-]?ON:?\]?/i.test(raw) || /\[?VIBE[_\s-]?RESUME:?\]?/i.test(raw) || lower.includes("vibrator on") || lower.includes("vibe on") || lower.includes("resume the vibrator"))) {
        if (!isVibeCycleRunning) {
          isVibeCycleRunning = true;
          runVibratorAutoCycle();
        }
      }

      // 5. VIBRATOR PAUSE / OFF (Withhold pleasure)
      if (/\[?VIBE[_\s-]?PAUSE:?\]?/i.test(raw) || /\[?VIBE[_\s-]?OFF:?\]?/i.test(raw) || (!isNegated && (lower.includes("pause the vibrator") || lower.includes("turn off the vibrator") || lower.includes("withhold the vibrator")))) {
        isVibeCycleRunning = false;
        stopAllVibeTimers();
        sendWebhook(config.vibeOffWebhook);
        updateLight("light-vibe", "Vibrator: PAUSED (Withheld)", false);
      }
    }

function isSlapRefusal(str) {
      return /\b(not going to stop slapping|won't stop slapping|wont stop slapping|never stop slapping|refuse to stop slapping|keep slapping|take every single hit|take every hit|until you learn|beg a whole lot harder)\b/i.test(str);
    }

    // --- PHONETIC AUTO-CORRECTOR ---
    function correctSpeechPhonetics(rawText) {
      if (!rawText) return "";
      let text = rawText;
      text = text.replace(/\b(miss chris|missed us|mrs\.?|ms\.?|mr\.?|mister|misses)\b/gi, "mistress");
      text = text.replace(/\b(on tom|on time|on tie|un tie|un-tie|and tie|un tight|until me)\b/gi, "untie");
      text = text.replace(/\b(kathy|cathy|cadi|k d|k t|kd)\b/gi, "Katie");
      return text;
    }

    // --- ENGINE ---
    function sendTextMessage() { 
      const t = correctSpeechPhonetics(userTextInput.value.trim()); 
      if (t && !isProcessing) { 
        if (silenceMasterTimer) clearTimeout(silenceMasterTimer);
        userTextInput.value = ""; 
        appendMessage('user', t, false); 
        executeTurn(t); 
      }
    }

    function commitUserSpeech(text) {
      text = correctSpeechPhonetics(text);
      if (isProcessing || isPaused || !text || !text.trim()) return;
      isProcessing = true;
      if (silenceTimer) clearTimeout(silenceTimer);
      if (silenceMasterTimer) clearTimeout(silenceMasterTimer);
      latestTranscript = "";

      if (recognition) {
        try { recognition.abort(); } catch (e) {}
        recognition = null;
      }

      appendMessage('user', text, false);
      executeTurn(text);
    }

async function executeTurn(userText) {
      isProcessing = true;
      if (silenceMasterTimer) clearTimeout(silenceMasterTimer);

      callCard.className = "call-card";
      callStatus.innerText = "Katie is thinking...";
      chatHistory.push({ role: "user", content: userText });
      if (chatHistory.length > 6) chatHistory = chatHistory.slice(-6);

      try {
        let baseUrl = config.apiOrUrl.replace(/\/+$/, '');
        if (!baseUrl.includes('/v1')) baseUrl += '/v1';
        const url = `${baseUrl}/chat/completions`;

        const mood = updateKatieMood(userText);
        const hwStatus = getHardwareStatusDirective();
        const elapsedMinutes = callStartTime ? Math.floor((Date.now() - callStartTime) / 60000) : 0;
        const timeDirective = `\n\n[SESSION ELAPSED TIME: ${elapsedMinutes} MINUTES / 30 MINUTES TOTAL]`;

        const res = await fetch(url, {
          method: "POST",
          headers: { 
            "Content-Type": "application/json", 
            "ngrok-skip-browser-warning": "true",
            "Bypass-Tunnel-Reminder": "true"
          },
          body: JSON.stringify({
            messages: [{ role: "system", content: config.prompt + mood + hwStatus + timeDirective }, ...chatHistory],
            max_tokens: 120, 
            temperature: 0.7, 
            stop: ["User:", "\nUser:", "Human:"]
          })
        });

        if (!res.ok) {
          const errText = await res.text();
          throw new Error(`HTTP ${res.status}: ${errText.substring(0, 100)}`);
        }

        const data = await res.json();
        if (data.error) throw new Error(data.error.message || JSON.stringify(data.error));

        const raw = (data.choices?.[0]?.message?.content || "").trim();
        parseHardwareActions(raw);

        let cleanText = raw
          .replace(/\[.*?\]/g, '')
          .replace(/<think>[\s\S]*?<\/think>/gi, '')
          .replace(/\b(VIBE_ON|VIBE_OFF|VIBE_PAUSE|VIBE_RESUME|SLAP_ON|SLAP_OFF|UNTIE|VIBE ON|VIBE OFF|SLAP ON|SLAP OFF):?/gi, '')
          .replace(/\bthe ball-slapper machine\b/gi, 'me slapping your balls')
          .replace(/\bthe ball-slapper\b/gi, 'me slapping your balls')
          .replace(/\bthe slapper\b/gi, 'me slapping your balls')
          .replace(/\ba break from the slapper\b/gi, 'a break from me slapping your balls')
          .replace(/\*[^*]*\*/g, '')
          .trim();

        const sentences = cleanText.match(/[^.!?]+[.!?]+/g);
        if (sentences && sentences.length > 2) cleanText = sentences.slice(0, 2).join(' ');

        if (!cleanText) cleanText = "Stay right where you are and take it like a good boy.";

        chatHistory.push({ role: "assistant", content: cleanText });
        appendMessage('katee', cleanText, false);
        playVoice(cleanText);

      } catch (err) {
        console.error("Execute Error:", err);
        // Displays the REAL exact error on your phone screen!
        appendMessage('system', `Error: ${err.message}`, false);
        resumeListeningWithDelay(2500);
      }
    }

    async function playVoice(text) {
      callCard.className = "call-card talking";
      callStatus.innerText = "Katie is speaking...";

      if (config.kokoroUrl) {
        try {
          let baseUrl = config.kokoroUrl.replace(/\/+$/, '');
          if (!baseUrl.includes('/v1')) baseUrl += '/v1';
          const ttsUrl = `${baseUrl}/audio/speech`;

          const res = await fetch(ttsUrl, {
            method: "POST",
            headers: { "Content-Type": "application/json", "ngrok-skip-browser-warning": "true" },
            body: JSON.stringify({ input: text, voice: config.kokoroVoice, response_format: "mp3" })
          });

          if (!res.ok) throw new Error("Kokoro TTS request failed");

          const blob = await res.blob();
          const audioEl = document.getElementById('audioPlayback');
          audioEl.src = URL.createObjectURL(blob);
          audioEl.onended = () => { resumeListeningWithDelay(600); };
          audioEl.play().catch(() => {});
          return;

        } catch (e) {
          console.warn("Kokoro TTS Offline, using browser voice fallback:", e);
        }
      }

      const u = new SpeechSynthesisUtterance(text);
      u.rate = 0.95;
      u.onend = () => resumeListeningWithDelay(600);
      synth.speak(u);
    }

    // --- CALL CONTROLS & VOICE ENGINE ---
    callBtn.onclick = () => {
      if (!config.apiOrUrl) {
        settingsModal.classList.add('open');
        alert('Please enter your LM Studio URL in settings.');
        return;
      }

      isCalling = true; 
      isPaused = false; 
      isProcessing = false;
      isVibeCycleRunning = true;
      callStartTime = Date.now();
      chatLog.innerHTML = '';
      currentInterimBubble = null;
      if (silenceTimer) clearTimeout(silenceTimer);
      if (silenceMasterTimer) clearTimeout(silenceMasterTimer);

      callBtn.style.display = "none"; 
      pauseBtn.style.display = "flex"; 
      pauseBtn.innerText = "⏸️";
      pauseBtn.style.backgroundColor = "var(--warning)";
      hangupBtn.style.display = "flex";
      callCard.className = "call-card listening"; 
      callStatus.innerText = "Listening...";
      appendMessage('katee', "Hardware linked. You are tied to the bed. I'm listening, handsome.", false);
      
      startSpeechTurn();
      startMasterSilenceTimer();
      runVibratorAutoCycle();
    };

    pauseBtn.onclick = () => {
      if (!isCalling) return;
      isPaused = !isPaused;
      if (isPaused) {
        if (recognition) try { recognition.abort(); } catch (e) {}
        clearTimeout(silenceTimer);
        if (silenceMasterTimer) clearTimeout(silenceMasterTimer);
        stopAllVibeTimers();
        sendWebhook(config.vibeOffWebhook);
        callCard.className = "call-card"; 
        callStatus.innerText = "⏸️ Call Paused";
        pauseBtn.innerText = "▶️"; 
        pauseBtn.style.backgroundColor = "var(--success)";
      } else {
        pauseBtn.innerText = "⏸️"; 
        pauseBtn.style.backgroundColor = "var(--warning)";
        callStatus.innerText = "Listening..."; 
        callCard.className = "call-card listening";
        isProcessing = false;
        startSpeechTurn();
        startMasterSilenceTimer();
        if (isVibeCycleRunning) runVibratorAutoCycle();
      }
    };

    hangupBtn.onclick = () => {
      isCalling = false; 
      isPaused = false; 
      isProcessing = false;
      isVibeCycleRunning = false;
      callStartTime = null;
      clearTimeout(silenceTimer);
      if (silenceMasterTimer) clearTimeout(silenceMasterTimer);
      callCard.className = "call-card"; 
      callStatus.innerText = "Call Ended";
      callBtn.style.display = "flex"; 
      pauseBtn.style.display = "none"; 
      hangupBtn.style.display = "none";

      if (isSlapperActive) {
        sendWebhook(config.slapOffWebhook);
        isSlapperActive = false;
        updateLight("light-slap", "Ball-Slapper: IDLE", false, false);
      }
      stopAllVibeTimers();
      sendWebhook(config.vibeOffWebhook);
      updateLight("light-vibe", "Vibrator: OFF", false, false, false);

      if (currentInterimBubble) { currentInterimBubble.remove(); currentInterimBubble = null; }
      if (recognition) try { recognition.abort(); } catch (e) {}
      if (synth) synth.cancel();

      if (chatHistory.length >= 2) {
        kateeMemory.totalSessions = (kateeMemory.totalSessions || 0) + 1;
        kateeMemory.sessionNotes = `Session ${kateeMemory.totalSessions}: ${kateeTemper > 60 ? 'Ended while furious. User was defiant.' : 'Ended normally.'}`;
        saveKateeMemory();
      }
    };

    function startSpeechTurn() {
      if (!isCalling || isPaused || isProcessing) return;

      const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
      if (!SpeechRecognition) {
        alert("Please use Google Chrome on Android for voice input.");
        return;
      }

      if (recognition) {
        try { recognition.abort(); } catch (e) {}
        recognition = null;
      }

      recognition = new SpeechRecognition();
      recognition.continuous = false;
      recognition.interimResults = true;
      recognition.lang = 'en-US';
      latestTranscript = "";

      recognition.onstart = () => {
        if (isCalling && !isPaused && !isProcessing) {
          callCard.className = "call-card listening";
          callStatus.innerText = "Listening...";
        }
      };

      recognition.onresult = (event) => {
        let text = "";
        for (let i = 0; i < event.results.length; i++) {
          text = event.results[i][0].transcript;
        }
        latestTranscript = correctSpeechPhonetics(text.trim());

        if (latestTranscript) {
          if (silenceMasterTimer) clearTimeout(silenceMasterTimer);
          appendMessage('user', latestTranscript, true);

          if (latestTranscript.toUpperCase().includes("RED")) {
            sendWebhook(config.releaseWebhook);
            sendWebhook(config.slapOffWebhook);
            sendWebhook(config.vibeOffWebhook);
            isSlapperActive = false;
            isVibeCycleRunning = false;
            stopAllVibeTimers();
            updateLight("light-restraints", "Restraints: RELEASED", false);
            updateLight("light-slap", "Ball-Slapper: IDLE", false, false);
            updateLight("light-vibe", "Vibrator: OFF", false, false, false);
          }

          clearTimeout(silenceTimer);
          silenceTimer = setTimeout(() => {
            if (latestTranscript && isCalling && !isPaused && !isProcessing) {
              commitUserSpeech(latestTranscript);
            }
          }, 1000);
        }
      };

      recognition.onerror = (e) => {
        if (e.error === 'not-allowed' || e.error === 'permission-denied') {
          callStatus.innerText = "Mic Permission Blocked";
        } else if (e.error !== 'no-speech') {
          console.warn("Mic error:", e.error);
        }
      };

      recognition.onend = () => {
        if (isCalling && !isPaused && !isProcessing && callStatus.innerText === "Listening...") {
          if (latestTranscript && latestTranscript.length > 1) {
            commitUserSpeech(latestTranscript);
          } else {
            setTimeout(() => {
              if (isCalling && !isPaused && !isProcessing) startSpeechTurn();
            }, 300);
          }
        }
      };

      try {
        recognition.start();
      } catch (err) {
        console.error("Mic start error:", err);
      }
    }

    function resumeListeningWithDelay(ms) { 
      callCard.className = "call-card"; 
      if (!isPaused && isCalling) callStatus.innerText = "Listening...";
      setTimeout(() => {
        isProcessing = false;
        if (isCalling && !isPaused) {
          startSpeechTurn();
          startMasterSilenceTimer();
        }
      }, ms); 
    }

    function appendMessage(sender, text, isInterim = false) {
      if (!text || typeof text !== 'string' || !text.trim()) return;

      if (isInterim) {
        if (!currentInterimBubble || !document.body.contains(currentInterimBubble)) {
          currentInterimBubble = document.createElement('div');
          currentInterimBubble.className = 'bubble user interim';
          chatLog.appendChild(currentInterimBubble);
        }
        currentInterimBubble.textContent = text;
      } else {
        if (currentInterimBubble) {
          currentInterimBubble.remove();
          currentInterimBubble = null;
        }
        const b = document.createElement('div');
        b.className = `bubble ${sender}`;
        b.textContent = text;
        chatLog.appendChild(b);
      }
      chatLog.scrollTop = chatLog.scrollHeight;
    }
  </script>
